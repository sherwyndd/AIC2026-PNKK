      }, []);

      const asrInfoMap = React.useMemo(() => getAsrInfoMap(keyframes), [keyframes]);
      const currentAsrInfo = asrInfoMap[currentIndex];

      // Calculate sliding window frames
      const windowFrames = React.useMemo(() => {
        const frames = [];
        for (let i = startIdx; i <= endIdx; i++) {
          const kf = keyframes[i];
          const kfVid = kf.video_id || kf.videoId || item?.videoId || '';
          const kfId = kf.keyframe_id || (kfVid && kf.frame_idx !== undefined ? `${kfVid}_${kf.frame_idx}` : kf.id);
          const key = kfId || `${kfVid}_${i}`;
          const fullUrl = getResolvedImageUrl(
            kf.image_url || kf.image_path || (kfVid && kfId ? `${kfVid}/${kfId}.jpg` : ''),
            kfVid,
            kfId
          );

          const offset = i - currentIndex;
          frames.push({
            index: i,
            kf,
            key,
            url: fullUrl,
            offset,
            isCurrent: i === currentIndex,
            asrInfo: asrInfoMap[i] || null,
          });
        }
        return frames;
      }, [keyframes, startIdx, endIdx, currentIndex, asrInfoMap]);

      // Manage edge-only loading & aborting outside requests
      React.useEffect(() => {
        const visibleKeys = new Set(windowFrames.map(f => f.key));

        // 1. Abort any active/queued requests outside current window
        window.__keyframeImagePool.pruneOutside(visibleKeys);

        // 2. Enqueue missing frames (priority: closest to center first)
        windowFrames.forEach(f => {
          const cached = window.__keyframeLRUCache.get(f.key) || window.__keyframeLRUCache.getByUrl(f.url);
          if (!cached || cached.status !== 'loaded') {
            const priority = 10 - Math.abs(f.offset);
            window.__keyframeImagePool.loadKeyframe(f.key, f.url, priority);
          }
        });
      }, [windowFrames]);

      // Keep the selected frame visible and centered when the strip overflows.
      React.useEffect(() => {
        const activeCard = stripRef.current?.querySelector(`[data-keyframe-index="${currentIndex}"]`);
        activeCard?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }, [currentIndex, startIdx, endIdx]);

      // Manual retry handler for failed image cards
      const handleRetryCard = (e, cardKey, cardUrl, cardOffset) => {
        e.stopPropagation();
        window.__keyframeLRUCache.cache.delete(cardKey);
        const priority = 10 - Math.abs(cardOffset);
        window.__keyframeImagePool.loadKeyframe(cardKey, cardUrl, priority);
      };

      return (
        <div className="w-full select-none">
          {/* Responsive Horizontal Strip: all cards fit smoothly */}
          <div ref={stripRef} className="flex items-stretch justify-center gap-1 sm:gap-1.5 w-full overflow-x-auto py-0.5 scrollbar-thin scrollbar-thumb-slate-700 scroll-smooth">
            {windowFrames.map(({ index, kf, key, url, offset, isCurrent, asrInfo }) => {
              return (
                <div
                  key={key}
                  onClick={() => onSelectIndex(index)}
                  data-keyframe-index={index}
                  className={`relative flex-1 min-w-[65px] max-w-[115px] cursor-pointer rounded-lg overflow-hidden border transition-all duration-150 flex flex-col group ${isCurrent
                    ? `ring-2 ring-sky-400 ${asrInfo ? asrInfo.theme.border : 'border-sky-400'} bg-sky-950/60 shadow-xl scale-[1.04] z-10`
                    : asrInfo
                      ? `${asrInfo.theme.border} ${asrInfo.theme.bg} hover:border-sky-400 hover:scale-[1.02] opacity-95 hover:opacity-100 shadow-sm`
                      : 'border-slate-700/80 hover:border-sky-400 hover:scale-[1.02] bg-slate-950/60 opacity-75 hover:opacity-100'
                    }`}
                  title={`Click để chuyển sang Frame #${kf.frame_idx} (${kf.keyframe_id || ''})${asrInfo ? ` • [ASR #${asrInfo.groupId}] "${asrInfo.text}"` : ' • Không có ASR'}`}
                >
                  {/* Thumbnail Container */}
                  <div className="aspect-video bg-slate-950 relative overflow-hidden flex items-center justify-center">
                    <ResultGridImage
                      src={url}
                      alt={`Frame ${kf.frame_idx}`}
                      lazy={false}
                    />

                    {/* Active Frame Indicator Overlay */}
                    {isCurrent && (
                      <div className="absolute top-1 left-1 bg-sky-500 text-white text-[9px] font-bold px-1.5 py-0.2 rounded shadow z-20 flex items-center gap-0.5">
                        <span>Current</span>
                      </div>
                    )}

                    {/* Offset badge */}
                    {!isCurrent && (
                      <div className="absolute top-1 left-1 bg-black/60 backdrop-blur text-slate-300 text-[9px] font-mono px-1 py-0.2 rounded z-20">
                        {offset > 0 ? `+${offset}` : offset}
                      </div>
                    )}

                    {/* ASR Group Badge (Same number & color for same ASR, different for different ASR) */}
                    {asrInfo ? (
                      <div
                        className={`absolute top-1 right-1 ${asrInfo.theme.badgeBg} ${asrInfo.theme.badgeText} text-[8.5px] font-black px-1 py-0.2 rounded shadow-md z-20 flex items-center gap-0.5 border border-black/20 leading-none`}
                        title={`Cùng nhóm ASR #${asrInfo.groupId}: "${asrInfo.text}"`}
                      >
                        <span>A{asrInfo.groupId}</span>
                      </div>
                    ) : (
                      <div
                        className="absolute top-1 right-1 bg-black/40 text-slate-400 text-[7.5px] font-mono px-0.5 py-0.2 rounded z-20 opacity-40 group-hover:opacity-80"
                        title="Không có lời thoại ASR"
                      >
                        -
                      </div>
                    )}
                  </div>

                  {/* Card Bottom Meta */}
                  <div
                    className={`px-1 py-0.5 text-[10px] font-mono flex items-center justify-between transition-colors ${isCurrent
                      ? 'bg-sky-900/90 text-sky-200 font-bold'
                      : asrInfo
                        ? 'bg-slate-900/95 text-slate-300'
                        : 'bg-slate-950 text-slate-400'
                      }`}
                  >
                    <div className="flex items-center gap-1 min-w-0 truncate">
                      {asrInfo && (
                        <span
                          className={`w-1.5 h-1.5 rounded-full shrink-0 ${asrInfo.theme.dot}`}
                          title={`ASR Nhóm #${asrInfo.groupId}`}
                        />
                      )}
                      <span className="truncate text-[10px]">#{kf.frame_idx}</span>
                    </div>
                    <div className="flex items-center gap-1 shrink-0 text-[9px]">
                      {asrInfo && (
                        <span className={`font-black ${asrInfo.theme.text}`} title={`ASR Nhóm #${asrInfo.groupId}`}>
                          A{asrInfo.groupId}
                        </span>
                      )}
                      <span className="opacity-80">
                        {kf.pts_time !== undefined ? `${kf.pts_time.toFixed(1)}s` : ''}
                      </span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function formatMilliseconds(ms) {
      if (ms === null || ms === undefined || ms === '' || isNaN(ms)) return '00:00:00.000';
      const numMs = parseInt(ms, 10);
      const totalSec = Math.floor(numMs / 1000);
      const msec = String(numMs % 1000).padStart(3, '0');
      const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSec % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}.${msec}`;
    }

    /**
     * SearchSideVideoPanel:
     * Khung xem video song song bên phải khung xem Frame trong Search module.
     * Kế thừa toàn bộ tính năng và thiết kế của Check Video (Realtime Video, Frame Accurate Scrubbing,
     * Keyframe Context Strip, Copy ID, KIS/QA Ranking, DRES/VQA submit).
     */
    function SearchSideVideoPanel({
      videoId,
      initialFrameIdx,
      initialTimestamp,
      initialPtsTime,
      keyframes = [],
      currentIndex = 0,
      onSelectIndex,
      onClose,
      onNoteImage,
      onAddToKisRanking,
      onAddToQaRanking,
      kisKeyframeIds = new Set(),
      qaKeyframeIds = new Set(),
      notedKeyframeIds = new Set(),
      submitMode = 'S',
      showToast = window.__showToast,
    }) {
      const videoRef = React.useRef(null);
      const animFrameRef = React.useRef(null);
      const BACKEND_BASE = `${window.location.protocol}//${window.location.hostname}:${window.location.port || '8888'}`;

      const [videoCurrentTime, setVideoCurrentTime] = React.useState(Number(initialPtsTime || 0));
      const [isPlaying, setIsPlaying] = React.useState(false);
      const [videoFps, setVideoFps] = React.useState(25);
      const [videoStreamFailed, setVideoStreamFailed] = React.useState(false);
      const [customSecondsInput, setCustomSecondsInput] = React.useState(String(Number((initialPtsTime || 0).toFixed(3))));
      const [copyFormat, setCopyFormat] = React.useState('comma');
      const [copiedAction, setCopiedAction] = React.useState(null);

      // VQA & DRES
      const [vqaAnswer, setVqaAnswer] = React.useState('');
      const [isSubmittingVqa, setIsSubmittingVqa] = React.useState(false);
      const [isSubmittingDres, setIsSubmittingDres] = React.useState(false);

      // Seek video when initialPtsTime changes (e.g. keyframe changed on left frame modal)
      React.useEffect(() => {
        const targetPts = Number(initialPtsTime !== undefined ? initialPtsTime : (initialTimestamp / 1000.0) || 0);
        setVideoCurrentTime(targetPts);
        setCustomSecondsInput(String(Number(targetPts.toFixed(3))));
        if (videoRef.current) {
          try {
            videoRef.current.currentTime = targetPts;
            videoRef.current.play().catch(() => {});
          } catch (e) {
            console.warn('Side video seek error:', e);
          }
        }
      }, [initialPtsTime, initialTimestamp, videoId]);

      // Continuous high-precision real-time time tracking
      React.useEffect(() => {
        let isCancelled = false;
        const syncLoop = () => {
          if (!isCancelled && videoRef.current) {
            const cur = videoRef.current.currentTime || 0;
            setVideoCurrentTime(cur);
            setIsPlaying(!videoRef.current.paused && !videoRef.current.ended);
          }
          animFrameRef.current = requestAnimationFrame(syncLoop);
        };
        animFrameRef.current = requestAnimationFrame(syncLoop);
        return () => {
          isCancelled = true;
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        };
      }, [videoId]);

      const handleVideoLoadedMetadata = () => {
        if (videoRef.current) {
          const targetPts = Number(initialPtsTime !== undefined ? initialPtsTime : (initialTimestamp / 1000.0) || 0);
          videoRef.current.currentTime = targetPts;
          setVideoCurrentTime(targetPts);
          setCustomSecondsInput(String(Number(targetPts.toFixed(3))));
          videoRef.current.play().catch(() => {});
        }
      };

      const handleStepFrame = (frameDelta) => {
        if (videoRef.current) {
          if (!videoRef.current.paused) videoRef.current.pause();
          const curTime = videoRef.current.currentTime || 0;
          const curFrame = Math.round(curTime * videoFps);
          const nextFrame = Math.max(0, curFrame + frameDelta);
          const nextTime = nextFrame / videoFps;
          videoRef.current.currentTime = nextTime;
          setVideoCurrentTime(nextTime);
          setCustomSecondsInput(String(Number(nextTime.toFixed(3))));
        }
      };

      const handleSeekRelativeSeconds = (seconds) => {
        if (videoRef.current) {
          const newTime = Math.max(0, videoRef.current.currentTime + seconds);
          videoRef.current.currentTime = newTime;
          setVideoCurrentTime(newTime);
          setCustomSecondsInput(String(Number(newTime.toFixed(3))));
        }
      };

      const handleResetToTargetFrame = () => {
        if (videoRef.current) {
          const targetPts = Number(initialPtsTime !== undefined ? initialPtsTime : (initialTimestamp / 1000.0) || 0);
          videoRef.current.currentTime = targetPts;
          setVideoCurrentTime(targetPts);
          setCustomSecondsInput(String(Number(targetPts.toFixed(3))));
          videoRef.current.play().catch(() => {});
        }
      };

      const calculatedFrameIdx = Math.max(0, Math.round(videoCurrentTime * videoFps));
      const calculatedTimestampMs = Math.round(videoCurrentTime * 1000);
      const calculatedPts = Number(videoCurrentTime.toFixed(3));

      const closestKeyframe = React.useMemo(() => {
        if (!keyframes || keyframes.length === 0) return null;
        let best = keyframes[0];
        let minDiff = Infinity;
        for (const kf of keyframes) {
          const kfPts = kf.pts_time !== undefined ? kf.pts_time : (kf.timestamp / 1000.0);
          const diff = Math.abs(kfPts - videoCurrentTime);
          if (diff < minDiff) {
            minDiff = diff;
            best = kf;
          }
        }
        return best;
      }, [keyframes, videoCurrentTime]);

      const calculatedKeyframeId = closestKeyframe && Math.abs((closestKeyframe.pts_time !== undefined ? closestKeyframe.pts_time : closestKeyframe.timestamp / 1000.0) - videoCurrentTime) < 0.1
        ? closestKeyframe.keyframe_id
        : `${videoId}_kf_${String(calculatedFrameIdx).padStart(4, '0')}`;

      const copyToSystemClipboard = async (text, successMsg) => {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
          }
          if (showToast) showToast(successMsg || `Đã sao chép: ${text}`, 'success');
          return true;
        } catch (err) {
          console.error('Clipboard copy error:', err);
          if (showToast) showToast('Lỗi khi sao chép vào bộ nhớ tạm!', 'error');
          return false;
        }
      };

      const handleCopyVideoAndFrame = async () => {
        const textToCopy = copyFormat === 'space' ? `${videoId} ${calculatedFrameIdx}` : `${videoId},${calculatedFrameIdx}`;
        const ok = await copyToSystemClipboard(textToCopy, `Đã copy vào Clipboard: ${textToCopy}`);
        if (ok) {
          setCopiedAction('both');
          setTimeout(() => setCopiedAction(null), 2000);
        }
      };

      const handleAddFrameToKis = () => {
        const kid = calculatedKeyframeId;
        const thumbUrl = closestKeyframe && closestKeyframe.image_url
          ? `${BACKEND_BASE}${closestKeyframe.image_url}`
          : `${BACKEND_BASE}/api/video/${videoId}/thumbnail`;

        if (onAddToKisRanking) {
          onAddToKisRanking({
            id: kid,
            keyframe_id: kid,
            videoId: videoId,
            videoTitle: videoId,
            frameId: calculatedFrameIdx,
            timestamp: calculatedTimestampMs,
            pts_time: calculatedPts,
            thumbnailUrl: thumbUrl,
            score: 1.0,
          });
          setCopiedAction('kis');
          setTimeout(() => setCopiedAction(null), 2000);
          if (showToast) showToast(`Đã thêm Frame #${calculatedFrameIdx} vào KIS Ranking`, 'success');
        }
      };

      const handleAddFrameToQa = () => {
        const kid = calculatedKeyframeId;
        const thumbUrl = closestKeyframe && closestKeyframe.image_url
          ? `${BACKEND_BASE}${closestKeyframe.image_url}`
          : `${BACKEND_BASE}/api/video/${videoId}/thumbnail`;

        if (onAddToQaRanking) {
          onAddToQaRanking({
            id: kid,
            keyframe_id: kid,
            videoId: videoId,
            videoTitle: videoId,
            frameId: calculatedFrameIdx,
            timestamp: calculatedTimestampMs,
            pts_time: calculatedPts,
            thumbnailUrl: thumbUrl,
            score: 1.0,
            answer: vqaAnswer ? vqaAnswer.trim() : undefined,
          });
          setCopiedAction('qa');
          setTimeout(() => setCopiedAction(null), 2000);
          if (showToast) showToast(`Đã thêm Frame #${calculatedFrameIdx} vào QA Ranking${vqaAnswer ? ` (Đáp án: ${vqaAnswer.trim()})` : ''}`, 'success');
        }
      };

      const handleSubmitVqaDres = async () => {
        if (!vqaAnswer.trim()) {
          if (showToast) showToast('Vui lòng nhập câu trả lời VQA trước khi nộp', 'warning');
          return;
        }
        setIsSubmittingVqa(true);
        try {
          const payload = {
            video_id: String(videoId),
            timestamp_ms: calculatedTimestampMs,
            timestamp: calculatedTimestampMs,
            answer: vqaAnswer.trim(),
            mode: 'vqa',
          };
          const res = await fetch(`${BACKEND_BASE}/api/dres/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok || data.status === false) {
            if (showToast) showToast(`Nộp VQA thất bại: ${data.detail || data.description || 'Lỗi'}`, 'error');
          } else {
            const subKey = `${videoId}_${calculatedFrameIdx}_${calculatedTimestampMs}_vqa`;
            window.__dresSubmittedSet = window.__dresSubmittedSet || new Set();
            window.__dresSubmittedSet.add(subKey);
            if (showToast) showToast(`Đã nộp VQA: "${vqaAnswer.trim()}" tại Frame #${calculatedFrameIdx} thành công!`, 'success');
          }
        } catch (err) {
          if (showToast) showToast(`Lỗi nộp VQA DRES: ${err.message}`, 'error');
        } finally {
          setIsSubmittingVqa(false);
        }
      };

      const handleSubmitDres = async () => {
        setIsSubmittingDres(true);
        try {
          const payload = {
            video_id: String(videoId),
            timestamp: calculatedTimestampMs,
            timestamp_ms: calculatedTimestampMs,
            start: calculatedTimestampMs,
            end: calculatedTimestampMs,
            mode: 'search',
          };
          const res = await fetch(`${BACKEND_BASE}/api/dres/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok || data.status === false) {
            if (showToast) showToast(`Nộp DRES thất bại: ${data.detail || data.description || 'Lỗi'}`, 'error');
          } else {
            const subKey = `${videoId}_${calculatedFrameIdx}_${calculatedTimestampMs}`;
            window.__dresSubmittedSet = window.__dresSubmittedSet || new Set();
            window.__dresSubmittedSet.add(subKey);
            if (showToast) showToast(`Đã nộp ${videoId} Frame #${calculatedFrameIdx} lên DRES thành công!`, 'success');
          }
        } catch (err) {
          if (showToast) showToast(`Lỗi nộp DRES: ${err.message}`, 'error');
        } finally {
          setIsSubmittingDres(false);
        }
      };

      const isKisRanked = (calculatedKeyframeId && kisKeyframeIds.has(calculatedKeyframeId));
      const isQaRanked = (calculatedKeyframeId && qaKeyframeIds.has(calculatedKeyframeId));

      const dresSubKey = `${videoId}_${calculatedFrameIdx}_${calculatedTimestampMs}`;
      const isAlreadySubmittedDres = window.__dresSubmittedSet && (
        window.__dresSubmittedSet.has(dresSubKey) ||
        window.__dresSubmittedSet.has(`${videoId}_${calculatedFrameIdx}`) ||
        (closestKeyframe && (
          window.__dresSubmittedSet.has(`${videoId}_${closestKeyframe.frame_idx}_${closestKeyframe.timestamp}`) ||
          window.__dresSubmittedSet.has(`${videoId}_${closestKeyframe.frame_idx}`)
        ))
      );

      const vqaSubKey = `${videoId}_${calculatedFrameIdx}_${calculatedTimestampMs}_vqa`;
      const isAlreadySubmittedVqa = window.__dresSubmittedSet && (
        window.__dresSubmittedSet.has(vqaSubKey) ||
        window.__dresSubmittedSet.has(`${videoId}_${calculatedFrameIdx}_vqa`)
      );

      return (
        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl 2xl:max-w-3xl overflow-hidden border border-slate-700/30 flex flex-col max-h-[95vh] shrink-0 animate-fade-in">
          {/* Header Bar */}
          <div className="bg-slate-900 text-white px-4 py-2.5 flex items-center justify-between flex-wrap gap-2 text-xs font-mono border-b border-slate-800">
            <div className="flex items-center gap-2">
              <span className="px-2.5 py-0.5 bg-purple-500/20 text-purple-300 border border-purple-500/30 rounded-md font-bold text-xs">
                {videoId}
              </span>
              <span className="text-slate-400 text-[11px]">
                Target: <strong className="text-slate-200">#{initialFrameIdx}</strong>
              </span>
            </div>

            <div className="flex items-center gap-2.5 text-[11px]">
              <div className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${isPlaying ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                <span className="text-slate-300 font-medium">{isPlaying ? 'Đang phát' : 'Đã dừng'}</span>
              </div>
              <span className="bg-slate-800 px-2 py-0.5 rounded text-amber-400 font-bold border border-slate-700">
                {calculatedPts.toFixed(3)}s
              </span>
              {onClose && (
                <button
                  type="button"
                  onClick={onClose}
                  className="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors cursor-pointer ml-1"
                  title="Đóng khung xem Video"
                >
                  <Icon name="x" className="w-4 h-4" />
                </button>
              )}
            </div>
          </div>

          {/* Body Content */}
          <div className="p-3.5 sm:p-4 overflow-y-auto space-y-3 flex-1">
            {/* Video Player */}
            <div className="aspect-video bg-black rounded-xl overflow-hidden relative shadow-inner border border-slate-800 flex items-center justify-center">
              {!videoStreamFailed ? (
                <video
                  ref={videoRef}
                  src={`${BACKEND_BASE}/api/video/${videoId}/stream`}
                  controls
                  autoPlay
                  playsInline
                  preload="auto"
                  onLoadedMetadata={handleVideoLoadedMetadata}
                  onError={() => {
                    console.warn('Video stream failed, showing fallback image');
                    setVideoStreamFailed(true);
                  }}
                  className="w-full h-full object-contain bg-black"
                />
              ) : (
                <div className="w-full h-full flex flex-col items-center justify-center text-slate-300 bg-slate-950 p-4 relative">
                  <div className="absolute top-3 left-3 bg-amber-500 text-slate-950 text-xs font-bold px-2.5 py-1 rounded-lg shadow-md flex items-center gap-1.5">
                    <Icon name="alert-triangle" className="w-3.5 h-3.5" />
                    <span>File video MP4 chưa có trên phân vùng này</span>
                  </div>
                </div>
              )}
            </div>

            {/* Keyframe Context Strip */}
            {keyframes.length > 0 && (
              <div className="space-y-1 pt-0.5">
                <div className="flex items-center justify-between text-[11px] text-slate-500 font-semibold px-1">
                  <span>Dải Keyframe ngữ cảnh ({keyframes.length} frames)</span>
                  <span className="text-[10px] text-slate-400">Click để tua video</span>
                </div>
                <KeyframeContextStrip
                  keyframes={keyframes}
                  currentIndex={currentIndex}
                  onSelectIndex={(newIdx) => {
                    if (onSelectIndex) onSelectIndex(newIdx);
                    if (keyframes[newIdx]) {
                      const kf = keyframes[newIdx];
                      const pts = kf.pts_time !== undefined ? kf.pts_time : (kf.timestamp / 1000.0);
                      setVideoCurrentTime(pts);
                      setCustomSecondsInput(String(Number(pts.toFixed(3))));
                      if (videoRef.current) videoRef.current.currentTime = pts;
                    }
                  }}
                  radius={4}
                />
              </div>
            )}

            {/* Frame-Accurate Scrubbing Toolbar */}
            <div className="flex items-center justify-between gap-1.5 p-2 bg-slate-100 rounded-xl border border-slate-200 flex-wrap">
              <div className="flex items-center gap-1 flex-wrap">
                <button
                  type="button"
                  onClick={() => handleSeekRelativeSeconds(-5)}
                  className="px-2 py-1 bg-white hover:bg-slate-50 text-slate-700 font-mono font-bold text-xs rounded-lg border border-slate-300 shadow-xs cursor-pointer"
                  title="Tua lùi 5 giây"
                >
                  -5s
                </button>
                <button
                  type="button"
                  onClick={() => handleSeekRelativeSeconds(-1)}
                  className="px-2 py-1 bg-white hover:bg-slate-50 text-slate-700 font-mono font-bold text-xs rounded-lg border border-slate-300 shadow-xs cursor-pointer"
                  title="Tua lùi 1 giây"
                >
                  -1s
                </button>
                <button
                  type="button"
                  onClick={() => handleStepFrame(-1)}
                  className="px-2 py-1 bg-purple-100 hover:bg-purple-200 text-purple-900 font-mono font-bold text-xs rounded-lg border border-purple-300 shadow-xs cursor-pointer"
                  title="Tua lùi 1 Frame (-0.04s)"
                >
                  -1f
                </button>
                <button
                  type="button"
                  onClick={handleResetToTargetFrame}
                  className="px-2.5 py-1 bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold text-xs rounded-lg border border-purple-200 shadow-xs flex items-center gap-1 cursor-pointer"
                  title="Nhảy về frame gốc [R]"
                >
                  <Icon name="rotate-ccw" className="w-3 h-3" />
                  <span>Về gốc</span>
                </button>
                <button
                  type="button"
                  onClick={() => handleStepFrame(1)}
                  className="px-2 py-1 bg-purple-100 hover:bg-purple-200 text-purple-900 font-mono font-bold text-xs rounded-lg border border-purple-300 shadow-xs cursor-pointer"
                  title="Tua tới 1 Frame (+0.04s)"
                >
                  +1f
                </button>
                <button
                  type="button"
                  onClick={() => handleSeekRelativeSeconds(1)}
                  className="px-2 py-1 bg-white hover:bg-slate-50 text-slate-700 font-mono font-bold text-xs rounded-lg border border-slate-300 shadow-xs cursor-pointer"
                  title="Tua tới 1 giây"
                >
                  +1s
                </button>
                <button
                  type="button"
                  onClick={() => handleSeekRelativeSeconds(5)}
                  className="px-2 py-1 bg-white hover:bg-slate-50 text-slate-700 font-mono font-bold text-xs rounded-lg border border-slate-300 shadow-xs cursor-pointer"
                  title="Tua tới 5 giây"
                >
                  +5s
                </button>
              </div>

              {/* Running Time & Frame Badges */}
              <div className="flex items-center gap-1.5">
                <div className="flex items-center gap-1 px-2.5 py-1 bg-white rounded-lg border border-purple-200 shadow-2xs">
                  <span className="text-[10px]">⏱️</span>
                  <span className="text-xs font-mono font-black text-purple-700">
                    {calculatedPts.toFixed(3)}s
                  </span>
                </div>
                <div className="flex items-center gap-1 px-2.5 py-1 bg-white rounded-lg border border-indigo-200 shadow-2xs">
                  <span className="text-[10px]">🎯</span>
                  <span className="text-xs font-mono font-black text-indigo-700 bg-indigo-50 px-1 py-0.2 rounded border border-indigo-100">
                    #{calculatedFrameIdx}
                  </span>
                </div>
              </div>
            </div>

            {/* Action Buttons & VQA Toolbar */}
            <div className="bg-white rounded-xl border border-slate-200 p-2.5 space-y-2 shadow-xs">
              {/* Row 1: Copy ID | + KIS Ranking | Submit DRES */}
              <div className="flex items-center gap-1.5 sm:gap-2 flex-wrap">
                {/* Copy Video & Frame ID */}
                <div className="flex items-stretch rounded-xl shadow-2xs border border-purple-300 bg-purple-50 overflow-hidden shrink-0">
                  <button
                    type="button"
                    onClick={handleCopyVideoAndFrame}
                    className={`px-2.5 sm:px-3 py-2 font-bold text-xs flex items-center justify-center gap-1.5 transition-all cursor-pointer ${
                      copiedAction === 'both'
                        ? 'bg-emerald-600 text-white'
                        : 'bg-purple-600 hover:bg-purple-700 text-white'
                    }`}
                    title={`Copy ${videoId}${copyFormat === 'space' ? ' ' : ','}${calculatedFrameIdx}`}
                  >
                    <Icon name={copiedAction === 'both' ? 'check' : 'copy'} className="w-3.5 h-3.5" />
                    <span>{copiedAction === 'both' ? 'Đã Copy!' : 'Copy ID'}</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => setCopyFormat(prev => prev === 'comma' ? 'space' : 'comma')}
                    className="px-2 bg-purple-800 hover:bg-purple-900 text-white font-mono font-bold text-xs cursor-pointer"
                    title={`Đổi định dạng: Hiện là "${copyFormat === 'comma' ? 'vid,fid' : 'vid fid'}"`}
                  >
                    {copyFormat === 'comma' ? ',' : '␣'}
                  </button>
                </div>

                {/* Add to KIS Ranking */}
                <button
                  type="button"
                  onClick={handleAddFrameToKis}
                  className={`flex-1 min-w-[120px] py-2 px-2.5 sm:px-3 rounded-xl font-extrabold text-xs text-white bg-gradient-to-br from-sky-600 via-blue-600 to-indigo-600 hover:from-sky-700 hover:via-blue-700 hover:to-indigo-700 hover:shadow-md shadow-[0_3px_12px_-6px_rgba(37,99,235,0.6)] ring-1 ring-white/25 active:scale-[0.99] transition-all flex items-center justify-center gap-1.5 cursor-pointer border border-blue-700/30 overflow-hidden relative ${
                    isKisRanked ? 'ring-2 ring-sky-300' : ''
                  }`}
                  title="Thêm frame này vào KIS Ranking"
                >
                  <svg className="w-3.5 h-3.5 text-white drop-shadow-[0_1px_0_rgba(0,0,0,0.25)]" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="12" y1="20" x2="12" y2="10"></line>
                    <line x1="18" y1="20" x2="18" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="16"></line>
                  </svg>
                  <span className="tracking-wide truncate">{isKisRanked ? 'Trong KIS' : '+ KIS Ranking'}</span>
                </button>

                {/* Submit DRES */}
                <button
                  type="button"
                  onClick={handleSubmitDres}
                  disabled={isSubmittingDres}
                  className={`py-2 px-3 rounded-xl font-extrabold text-xs border shadow-[0_3px_10px_-6px_rgba(16,185,129,0.55)] ring-1 transition-all active:scale-[0.99] flex items-center justify-center gap-1.5 cursor-pointer shrink-0 overflow-hidden relative ${
                    isAlreadySubmittedDres
                      ? 'bg-gradient-to-br from-emerald-500 via-teal-500 to-cyan-600 text-white border-emerald-600/40 ring-emerald-300/40 hover:from-emerald-600 hover:via-teal-600 hover:to-cyan-700'
                      : 'bg-gradient-to-br from-white via-slate-50 to-slate-100 hover:from-emerald-50 hover:via-teal-50 hover:to-cyan-50 text-slate-800 hover:text-emerald-700 border-emerald-200 ring-emerald-200/60 hover:border-emerald-300'
                  } ${isSubmittingDres ? 'opacity-70 cursor-not-allowed' : ''}`}
                  title={`Nộp frame #${calculatedFrameIdx} (${calculatedTimestampMs}ms) trực tiếp lên hệ thống DRES`}
                >
                  {isSubmittingDres ? (
                    <div className="w-3.5 h-3.5 border-2 border-emerald-600 border-t-transparent rounded-full animate-spin"></div>
                  ) : (
                    <svg className={`w-3.5 h-3.5 ${isAlreadySubmittedDres ? 'text-white drop-shadow' : 'text-emerald-600'}`} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                      <polyline points="17 8 12 3 7 8"></polyline>
                      <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                  )}
                  <span className="truncate">{isSubmittingDres ? 'Đang nộp...' : 'Submit DRES'}</span>
                  {isAlreadySubmittedDres && (
                    <span className="shrink-0 inline-flex items-center justify-center w-4 h-4 rounded-full bg-white text-emerald-600 text-[8px] font-black shadow-inner">✓</span>
                  )}
                </button>
              </div>

              {/* Row 2: VQA Answer input | + QA Ranking | Submit VQA */}
              <div className="flex items-center gap-1.5 sm:gap-2 pt-2 border-t border-slate-100 flex-wrap sm:flex-nowrap">
                <div className="flex-1 relative flex items-center min-w-[140px]">
                  <div className="absolute left-2.5 text-purple-600 pointer-events-none flex items-center">
                    <Icon name="message-square" className="w-3.5 h-3.5" />
                  </div>
                  <input
                    type="text"
                    placeholder="Nhập câu trả lời VQA..."
                    value={vqaAnswer}
                    onChange={(e) => setVqaAnswer(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        e.preventDefault();
                        if (e.shiftKey) handleSubmitVqaDres();
                        else handleAddFrameToQa();
                      }
                    }}
                    className="w-full pl-8 pr-2.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all"
                  />
                </div>

                <button
                  type="button"
                  onClick={handleAddFrameToQa}
                  className={`py-2 px-2.5 sm:px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1 border shadow-2xs transition-all cursor-pointer shrink-0 ${
                    isQaRanked || copiedAction === 'qa'
                      ? 'bg-purple-700 text-white border-purple-800 ring-2 ring-purple-200'
                      : 'bg-purple-50 hover:bg-purple-100 text-purple-800 border-purple-200'
                  }`}
                  title="Thêm đáp án VQA này vào QA Ranking"
                >
                  <Icon name="message-square" className="w-3.5 h-3.5" />
                  <span>{isQaRanked ? 'Trong QA' : '+ QA Ranking'}</span>
                </button>

                <button
                  type="button"
                  onClick={handleSubmitVqaDres}
                  disabled={isSubmittingVqa || !vqaAnswer.trim()}
                  className={`py-2 px-2.5 sm:px-3 rounded-xl font-extrabold text-xs border shadow-2xs transition-all cursor-pointer shrink-0 flex items-center justify-center gap-1.5 ${
                    isAlreadySubmittedVqa
                      ? 'bg-gradient-to-br from-purple-600 to-indigo-700 text-white border-purple-700 shadow-purple-500/20'
                      : 'bg-gradient-to-br from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white border-purple-600 disabled:opacity-40 disabled:hover:from-purple-600 disabled:cursor-not-allowed'
                  }`}
                  title="Nộp đáp án VQA này trực tiếp lên DRES"
                >
                  {isSubmittingVqa ? (
                    <div className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                  ) : (
                    <Icon name="send" className="w-3.5 h-3.5" />
                  )}
                  <span>{isSubmittingVqa ? 'Đang nộp...' : 'Submit VQA'}</span>
                  {isAlreadySubmittedVqa && (
                    <span className="shrink-0 inline-flex items-center justify-center w-4 h-4 rounded-full bg-white text-purple-700 text-[8px] font-black shadow-inner">✓</span>
                  )}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ResultDetailModal({
      item,
      initialShowSideVideo = false,
      onClose,
      onNote,
      notedKeyframeIds,
      onAddToKisRanking,
      onAddToQaRanking,
      kisKeyframeIds = new Set(),
      qaKeyframeIds = new Set(),
      onOpenInCheckVideo,
      submitMode = 'S'
    }) {
      if (!item) return null;

      const videoId = item.videoId;
      const [keyframes, setKeyframes] = React.useState(window.__videoKeyframesCache[videoId] || []);
      const [currentIndex, setCurrentIndex] = React.useState(0);
      const [loadingList, setLoadingList] = React.useState(!window.__videoKeyframesCache[videoId]);
      const [radius, setRadius] = React.useState(0);

      const initCached = (window.__keyframeLRUCache?.getByUrl && window.__keyframeLRUCache.getByUrl(item.thumbnailUrl)) ||
                         (window.__keyframeLRUCache?.get && window.__keyframeLRUCache.get(item.keyframe_id || item.id));
      const [imgState, setImgState] = React.useState(initCached && initCached.status === 'loaded' ? 'loaded' : 'loading');
      const [curSrc, setCurSrc] = React.useState(initCached && initCached.status === 'loaded' ? (initCached.blobUrl || item.thumbnailUrl) : item.thumbnailUrl);
      const [retryCount, setRetryCount] = React.useState(0);

      const [showAsr, setShowAsr] = React.useState(false);
      const [asrText, setAsrText] = React.useState('');
      const [asrFullText, setAsrFullText] = React.useState('');
      const [asrLoading, setAsrLoading] = React.useState(false);

      // Side-by-side Video Inspector state (Search module)
      const [showSideVideo, setShowSideVideo] = React.useState(Boolean(initialShowSideVideo));

      React.useEffect(() => {
        if (initialShowSideVideo) {
          setShowSideVideo(true);
        }
      }, [initialShowSideVideo, item?.id, item?.keyframe_id]);

      // Mode selection: 'semantic' | 'vqa' (persisted across modal opens)
      window.__currentDetailMode = window.__currentDetailMode || 'semantic';
      const [mode, setModeState] = React.useState(window.__currentDetailMode);
      const setMode = (newMode) => {
        window.__currentDetailMode = newMode;
        setModeState(newMode);
      };

      const [vqaAnswer, setVqaAnswer] = React.useState('');
      const [vqaSubmitStatus, setVqaSubmitStatus] = React.useState('idle'); // 'idle' | 'submitting' | 'success' | 'error'
      const [vqaSubmitResult, setVqaSubmitResult] = React.useState(null);

      const [submitStatus, setSubmitStatus] = React.useState('idle'); // 'idle' | 'submitting' | 'success' | 'error'
      const [submitResult, setSubmitResult] = React.useState(null);
      const [showDetails, setShowDetails] = React.useState(true);

      const BACKEND_BASE = `${window.location.protocol}//${window.location.hostname}:${window.location.port || '8888'}`;

      // Preload neighboring keyframe images
      const preloadNeighbors = React.useCallback((list, activeIdx) => {
        if (!list || list.length === 0) return;
        const offsets = [-3, -2, -1, 1, 2, 3];
        offsets.forEach((offset) => {
          const targetIdx = activeIdx + offset;
          if (targetIdx >= 0 && targetIdx < list.length) {
            const kf = list[targetIdx];
            const rawUrl = kf.image_url || '';
            const fullUrl = rawUrl.startsWith('http')
              ? rawUrl
              : rawUrl.startsWith('/')
                ? `${window.location.origin}${rawUrl}`
                : `${window.location.origin}/${rawUrl}`;
            const img = new Image();
            img.src = fullUrl;
          }
        });
      }, []);

      // Resolve starting index in keyframes list
      const resolveStartIdx = (list) => {
        if (!list || list.length === 0) return 0;
        const targetKid = item.keyframe_id || item.id || '';
        if (targetKid) {
          const idx = list.findIndex((k) => k.keyframe_id === targetKid);
          if (idx >= 0) return idx;
        }
        if (item.thumbnailUrl) {
          const filename = item.thumbnailUrl.split('/').pop().split('?')[0];
          if (filename) {
            const idx = list.findIndex((k) => k.image_path && (k.image_path.endsWith(filename) || k.keyframe_id + '.jpg' === filename));
            if (idx >= 0) return idx;
          }
        }
        if (item.frameId !== undefined && item.frameId !== '') {
          const exactIdx = list.findIndex((k) => String(k.frame_idx) === String(item.frameId));
          if (exactIdx >= 0) return exactIdx;

          // If frameId (e.g. 602) is not a direct keyframe, find the keyframe closest to this frame
          const targetFidx = Number(item.frameId);
          if (!isNaN(targetFidx)) {
            let bestIdx = 0;
            let minDiff = Infinity;
            list.forEach((k, i) => {
              const diff = Math.abs(Number(k.frame_idx) - targetFidx);
              if (diff < minDiff) {
                minDiff = diff;
                bestIdx = i;
              }
            });
            return bestIdx;
          }
        }
        return 0;
      };

      // Load keyframes for this video once (cached client-side)
      React.useEffect(() => {
        let isMounted = true;
        if (window.__videoKeyframesCache[videoId]) {
          const list = window.__videoKeyframesCache[videoId];
          setKeyframes(list);
          setLoadingList(false);
          const startIdx = resolveStartIdx(list);
          setCurrentIndex(startIdx);
          preloadNeighbors(list, startIdx);
        } else {
          setLoadingList(true);
          fetch(`${BACKEND_BASE}/api/video/${videoId}/keyframes`)
            .then((res) => {
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return res.json();
            })
            .then((data) => {
              if (!isMounted) return;
              const list = data.keyframes || [];
              window.__videoKeyframesCache[videoId] = list;
              setKeyframes(list);
              setLoadingList(false);
              const startIdx = resolveStartIdx(list);
              setCurrentIndex(startIdx);
              preloadNeighbors(list, startIdx);
            })
            .catch((err) => {
              if (!isMounted) return;
              console.warn('Could not fetch video keyframes list:', err);
              setLoadingList(false);
            });
        }
        return () => { isMounted = false; };
      }, [videoId, item.id, item.keyframe_id, item.thumbnailUrl, preloadNeighbors, BACKEND_BASE]);

      // Determine active keyframe values from keyframes[currentIndex]
      const activeKf = (keyframes.length > 0 && currentIndex >= 0 && currentIndex < keyframes.length)
        ? keyframes[currentIndex]
        : null;

      const activeFrameId = activeKf ? activeKf.frame_idx : item.frameId;
      const activeKeyframeId = activeKf ? activeKf.keyframe_id : (item.keyframe_id || item.id || '');
      const activeTimestamp = activeKf
        ? activeKf.timestamp
        : (item.timestamp !== '' && item.timestamp !== undefined ? item.timestamp : 0);
      const activePts = activeKf
        ? activeKf.pts_time
        : (item.pts_time !== undefined ? item.pts_time : (activeTimestamp / 1000.0));

      const activeImageSrc = React.useMemo(() => {
        if (activeKf && activeKf.image_url) {
          const u = activeKf.image_url;
          return u.startsWith('http') ? u : u.startsWith('/') ? `${window.location.origin}${u}` : `${window.location.origin}/${u}`;
        }
        const u = item.thumbnailUrl || '';
        return u.startsWith('http') || u === ''
          ? u
          : u.startsWith('/')
            ? `${window.location.origin}${u}`
            : `${window.location.origin}/${u}`;
      }, [activeKf, item.thumbnailUrl]);

      // When active image changes, check LRU cache & update curSrc
      React.useEffect(() => {
        const key = activeKeyframeId || `${videoId}_${activeFrameId}`;
        const cached = (window.__keyframeLRUCache?.get && window.__keyframeLRUCache.get(key)) ||
                       (window.__keyframeLRUCache?.getByUrl && window.__keyframeLRUCache.getByUrl(activeImageSrc)) ||
                       (window.__keyframeLRUCache?.getByUrl && window.__keyframeLRUCache.getByUrl(item.thumbnailUrl));
        if (cached && cached.status === 'loaded') {
          setCurSrc(cached.blobUrl || activeImageSrc);
          setImgState('loaded');
        } else {
          setImgState('loading');
          setRetryCount(0);
          setCurSrc(activeImageSrc);
        }
        if (keyframes.length > 0) {
          preloadNeighbors(keyframes, currentIndex);
        }
      }, [activeImageSrc, currentIndex, keyframes, preloadNeighbors, activeKeyframeId, videoId, activeFrameId, item.thumbnailUrl]);

      React.useEffect(() => {
        if (!showAsr) {
          setAsrText('');
          setAsrFullText('');
          return;
        }

        const setBoth = (asr6s, full) => {
          const a6s = asr6s || '';
          const af = full || asr6s || '';
          setAsrText(a6s || af || 'Không có dữ liệu ASR cho keyframe này.');
          setAsrFullText(af || a6s || 'Không có dữ liệu ASR cho keyframe này.');
        };

        const useMetadataAsr = (source) => {
          if (!source) return;
          const asr6s = source.asr_6s || source.asr_text || '';
          const fullText = source.full_text || source.asr_text || asr6s;
          setBoth(asr6s, fullText);
        };

        if (activeKf && (activeKf.asr_6s || activeKf.asr_text || activeKf.full_text)) {
          useMetadataAsr(activeKf);
          return;
        }
        if (item && (item.keyframe_id === activeKeyframeId || item.id === activeKeyframeId) && (item.asr_6s || item.asr_text || item.full_text)) {
          useMetadataAsr(item);
          return;
        }

        setAsrLoading(true);
        setAsrText('');
        setAsrFullText('');

        const params = new URLSearchParams({
          video_id: String(videoId),
          frame_idx: String(activeFrameId),
        });
        if (activeKeyframeId) {
          params.append('keyframe_id', String(activeKeyframeId));
        }

        fetch(`${BACKEND_BASE}/api/keyframe/asr?${params.toString()}`)
          .then((res) => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
          })
          .then((data) => {
            const asr6s = data.asr_6s || data.asr_text || '';
            const fullText = data.full_text || data.asr_text || asr6s;
            setBoth(asr6s, fullText);
          })
          .catch((err) => {
            console.error('Error fetching ASR:', err);
            setAsrText('Không tìm thấy dữ liệu phụ đề ASR.');
            setAsrFullText('');
          })
          .finally(() => {
            setAsrLoading(false);
          });
      }, [showAsr, videoId, activeFrameId, activeKeyframeId, activeKf, item, BACKEND_BASE]);

      // Navigation helpers
      const goPrev = React.useCallback(() => {
        if (currentIndex > 0) {
          setCurrentIndex((prev) => prev - 1);
        }
      }, [currentIndex]);

      const goNext = React.useCallback(() => {
        if (currentIndex < keyframes.length - 1) {
          setCurrentIndex((prev) => prev + 1);
        }
      }, [currentIndex, keyframes.length]);

      const goPrev5 = React.useCallback(() => {
        if (currentIndex > 0) {
          setCurrentIndex((prev) => Math.max(0, prev - 5));
        }
      }, [currentIndex]);

      const goNext5 = React.useCallback(() => {
        if (currentIndex < keyframes.length - 1) {
          setCurrentIndex((prev) => Math.min(keyframes.length - 1, prev + 5));
        }
      }, [currentIndex, keyframes.length]);

      // Duplicate submission key
      const submissionKey = `${videoId}_${activeFrameId}_${activeTimestamp}`;
      const isAlreadySubmitted = window.__dresSubmittedSet.has(submissionKey);
      const isNoted = notedKeyframeIds && notedKeyframeIds.has(activeKeyframeId);
      const isKisRanked = kisKeyframeIds && kisKeyframeIds.has(activeKeyframeId);
      const isQaRanked = qaKeyframeIds && qaKeyframeIds.has(activeKeyframeId);

      const handleNote = React.useCallback(() => {
        if (!onNote || isNoted) return;
        const imageUrl = activeImageSrc || item.thumbnailUrl;
        onNote({
          id: activeKeyframeId || item.id,
          keyframe_id: activeKeyframeId,
          videoId,
          videoTitle: item.videoTitle || videoId,
          frameId: activeFrameId,
          timestamp: activeTimestamp,
          pts_time: activePts,
          thumbnailUrl: imageUrl,
          score: item.score ?? 0,
          rank: item.rank ?? 1,
          matchedSources: item.matchedSources || [],
          caption: activeKeyframeId || item.caption,
        });
      }, [onNote, isNoted, activeImageSrc, activeKeyframeId, activeFrameId, activeTimestamp, activePts, videoId, item]);

      const handleAddToKisRankingAction = React.useCallback(() => {
        if (!onAddToKisRanking) return;
        const imageUrl = activeImageSrc || item.thumbnailUrl;
        onAddToKisRanking({
          id: activeKeyframeId || item.id,
          keyframe_id: activeKeyframeId,
          videoId,
          videoTitle: item.videoTitle || videoId,
          frameId: activeFrameId,
          timestamp: activeTimestamp,
          pts_time: activePts,
          thumbnailUrl: imageUrl,
          score: item.score ?? 0,
          rank: item.rank ?? 1,
          matchedSources: item.matchedSources || [],
          caption: activeKeyframeId || item.caption,
        }, radius);

          video_id: String(videoId),
          timestamp: tsMs,
          timestamp_ms: tsMs,
          start: tsMs,
          end: tsMs,
          mode: 'search',

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

              description: data.detail || data.description || 'Submission failed',

              description: data.description || 'Submitted',

          setSubmitResult({
            status: false,
            description: `Submission failed: ${err.message}`,

            if (e.key === 'Escape') {
              e.preventDefault();
              onClose();
            }
            return;
          }

          if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && e.shiftKey) {
            e.preventDefault();
            goPrev5();
          } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && e.shiftKey) {
            e.preventDefault();
            goNext5();
          } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
            e.preventDefault();
            goPrev();
          } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {

          } else if (e.key === 'Escape') {
            e.preventDefault();
            onClose();
          }
        };

        window.addEventListener('keydown', handleKeyDown);

                      <Icon name={showDetails ? "chevron-up" : "chevron-down"} className="w-3.5 h-3.5 text-slate-500 transition-transform" />
                      <span>Thông tin chi tiết</span>
                    </button>

                    <div className="shrink-0 flex items-center gap-1.5 bg-white border border-[#e8dfca] rounded-lg px-2 py-1 shadow-2xs">
                      <span className="text-[11px] font-semibold text-slate-500">± Frame:</span>
                      <input
                        type="number"
                        min="0"
                        max="50"
                        value={radius}
                        onChange={(e) => {
                          const val = parseInt(e.target.value, 10);
                          setRadius(isNaN(val) || val < 0 ? 0 : val);
                        }}
                        className="w-10 text-center text-xs font-bold text-slate-900 bg-slate-50 border border-slate-200 rounded-md py-0.5 focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 font-mono"
                      />
                      <span className="text-[10px] text-slate-400 font-medium hidden sm:inline">
                        {radius === 0 ? '(chỉ frame này)' : `(±${radius})`}
                      </span>
                    </div>
                  </div>

                  {showDetails && (
                    <div className="p-3 pt-0 border-t border-[#ebd8b7]/60 mt-1 grid grid-cols-2 sm:grid-cols-4 gap-2 animate-fade-in">
                      <div className="p-2.5 bg-white rounded-lg border border-[#e8dfca] shadow-2xs">
                        <div className="text-[10px] font-medium text-slate-500 mb-0.5 flex items-center gap-1">
                          <Icon name="film" className="w-3 h-3 text-slate-400" />
                          <span>Video ID</span>
                        </div>
                        <div className="font-mono font-bold text-slate-900 text-xs sm:text-sm truncate" title={videoId}>
                          {videoId}
                        </div>
                      </div>

                      <div className="p-2.5 bg-white rounded-lg border border-[#e8dfca] shadow-2xs">
                        <div className="text-[10px] font-medium text-slate-500 mb-0.5 flex items-center gap-1">
                          <Icon name="hash" className="w-3 h-3 text-slate-400" />
                          <span>Frame ID</span>
                        </div>
                        <div className="font-mono font-bold text-sky-700 text-xs sm:text-sm">
                          {activeFrameId}
                        </div>
                      </div>

                      <div className="p-2.5 bg-white rounded-lg border border-[#e8dfca] shadow-2xs">
                        <div className="text-[10px] font-semibold text-sky-800 mb-0.5 flex items-center gap-1">
                          <Icon name="clock" className="w-3 h-3 text-sky-600" />
                          <span>Timestamp (ms)</span>
                        </div>
                        <div className="font-mono font-bold text-sky-950 text-xs sm:text-sm">
                          {activeTimestamp} ms
                        </div>
                        <div className="text-[9px] font-mono text-sky-600 truncate">
                          {formatMilliseconds(activeTimestamp)}
                        </div>
                      </div>

                      <div className="p-2.5 bg-white rounded-lg border border-[#e8dfca] shadow-2xs">
                        <div className="text-[10px] font-medium text-slate-500 mb-0.5 flex items-center gap-1">
                          <Icon name="tag" className="w-3 h-3 text-slate-400" />
                          <span>Thứ hạng (Rank)</span>
                        </div>
                        <div className="font-mono font-bold text-slate-900 text-xs sm:text-sm">
                          #{item.rank ?? 1}
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {/* 4. VQA Input field if in VQA mode */}
                {mode === 'vqa' && (
                  <div className="bg-purple-50/40 p-3.5 rounded-xl border border-purple-200/70 space-y-2">
                    <label className="block text-xs font-bold text-purple-900 flex items-center gap-1.5">
                      <Icon name="message-square" className="w-3.5 h-3.5 text-purple-600" />
                      <span>Câu trả lời (Answer) cho truy vấn Q&A:</span>
                    </label>
                    <input
                      type="text"
                      value={vqaAnswer}
                      onChange={(e) => setVqaAnswer(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          handleVqaSubmit();
                        }
                      }}
                      placeholder="Nhập đáp án (ví dụ: xedap, TikTok, Nike, 5, Màu đỏ)..."
                      className="w-full px-3.5 py-2.5 bg-white border border-purple-300 rounded-xl text-sm text-slate-900 font-medium placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500 shadow-sm"
                      autoFocus
                    />
                  </div>
                )}

                {/* 5. Bottom Actions: Add to ranking (70%) + Submit DRES (30%) */}
                <div className="flex items-center gap-2 pt-0.5">
                  <button
                    type="button"
                    onClick={mode === 'vqa' ? handleAddToQaRankingAction : handleAddToKisRankingAction}
                    className="flex-[7] py-2.5 px-3 rounded-xl font-extrabold text-xs sm:text-sm text-white bg-gradient-to-br from-sky-600 via-blue-600 to-indigo-600 hover:from-sky-700 hover:via-blue-700 hover:to-indigo-700 hover:shadow-lg shadow-[0_5px_16px_-8px_rgba(37,99,235,0.6)] ring-1 ring-white/25 active:scale-[0.99] transition-all flex items-center justify-center gap-2 cursor-pointer border border-blue-700/30 overflow-hidden relative"
                  >
                    <span className="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/25 to-transparent hover:translate-x-full transition-transform duration-1000 ease-out pointer-events-none"></span>
                    <svg className="w-3.5 h-3.5 text-white drop-shadow-[0_1px_0_rgba(0,0,0,0.25)]" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round">
                      <line x1="12" y1="20" x2="12" y2="10"></line>
                      <line x1="18" y1="20" x2="18" y2="4"></line>
                      <line x1="6" y1="20" x2="6" y2="16"></line>
                    </svg>
                    <span className="tracking-wide drop-shadow-[0_1px_0_rgba(0,0,0,0.25)]">Add to ranking</span>
                  </button>

                  <button
                    type="button"
                    onClick={mode === 'semantic' ? handleSubmit : handleVqaSubmit}
                    disabled={submitStatus === 'submitting' || vqaSubmitStatus === 'submitting'}
                    className={`flex-[3] py-2.5 px-2.5 rounded-xl font-extrabold text-xs sm:text-sm border shadow-[0_3px_12px_-8px_rgba(16,185,129,0.55)] ring-1 transition-all active:scale-[0.99] flex items-center justify-center gap-1.5 cursor-pointer overflow-hidden relative ${isAlreadySubmitted
                      ? 'bg-gradient-to-br from-emerald-500 via-teal-500 to-cyan-600 text-white border-emerald-600/40 ring-emerald-300/40 hover:from-emerald-600 hover:via-teal-600 hover:to-cyan-700 hover:shadow-lg'
                      : 'bg-gradient-to-br from-white via-slate-50 to-slate-100 hover:from-emerald-50 hover:via-teal-50 hover:to-cyan-50 text-slate-800 hover:text-emerald-700 border-emerald-200 ring-emerald-200/60 hover:border-emerald-300 hover:ring-emerald-300/70 hover:shadow-md'
                      } ${(submitStatus === 'submitting' || vqaSubmitStatus === 'submitting') ? 'opacity-70 cursor-not-allowed' : ''}`}
                    title="Submit frame này lên hệ thống DRES (Enter)"
                  >
                    {!isAlreadySubmitted && <span className={`absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent ${isAlreadySubmitted ? 'via-white/20' : 'via-emerald-400/20'} to-transparent hover:translate-x-full transition-transform duration-1000 ease-out pointer-events-none`}></span>}
                    <svg className={`w-3.5 h-3.5 ${isAlreadySubmitted ? 'text-white drop-shadow' : 'text-emerald-600 group-hover:text-emerald-700'}`} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                      <polyline points="17 8 12 3 7 8"></polyline>
                      <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <span className={`truncate tracking-tight ${isAlreadySubmitted ? 'text-white drop-shadow-[0_1px_0_rgba(0,0,0,0.25)]' : ''}`}>
                      {submitStatus === 'submitting' || vqaSubmitStatus === 'submitting' ? 'Đang nộp...' : 'Submit DRES'}
                    </span>
                    {isAlreadySubmitted && (
                      <span className="shrink-0 inline-flex items-center justify-center w-4.5 h-4.5 rounded-full bg-white text-emerald-600 text-[9px] font-black shadow-inner">✓</span>
                    )}
                  </button>
                </div>

                {/* Submission Feedback Display */}
                {(submitResult || vqaSubmitResult) && (
                  <div
                    className={`p-3 rounded-xl border flex items-center gap-2.5 transition-all animate-fade-in ${(submitResult || vqaSubmitResult).status
                      ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-bold text-xs'
                      : 'bg-rose-50 border-rose-300 text-rose-900 font-bold text-xs'
                      }`}
                  >
                    <span>{(submitResult || vqaSubmitResult).status ? '✅' : '❌'}</span>
                    <span>{(submitResult || vqaSubmitResult).status ? '✓ Submitted thành công' : `Submission failed: ${(submitResult || vqaSubmitResult).description}`}</span>
                  </div>
                )}
              </div>

            </div>

            {/* Right Card: SearchSideVideoPanel (Side-by-side video inspector) */}
            {showSideVideo && (
              <SearchSideVideoPanel
                videoId={videoId}
                initialFrameIdx={activeFrameId}
                initialTimestamp={activeTimestamp}
                initialPtsTime={activePts}
                keyframes={keyframes}
                currentIndex={currentIndex}
                onSelectIndex={(newIdx) => setCurrentIndex(newIdx)}
                onClose={() => setShowSideVideo(false)}
                onNoteImage={onNote}
                onAddToKisRanking={onAddToKisRanking}
                onAddToQaRanking={onAddToQaRanking}
                kisKeyframeIds={kisKeyframeIds}
                qaKeyframeIds={qaKeyframeIds}
                notedKeyframeIds={notedKeyframeIds}
                submitMode={submitMode}
              />
            )}

          </div>
        </div>
      );
    }

    function ClipboardPanel({
      clipboard,
      onRestoreQuery,
      onSelectImage,
      onOpenInCheckVideo,
      onRemoveImage,
      onClearAll,
      onClearKis,
      onClearQa,
      onClearTrake,
      onSelectRankingItem,
      onMoveKisUp,
      onMoveKisDown,
      onRemoveKisItem,
      onJumpKisRank,
      onAutoFillKisTop100,
      searchResultsCount = 0,
      onMoveQaUp,
      onMoveQaDown,
      onRemoveQaItem,
      onJumpQaRank,
      onAutoFillQaTop100,
      onUpdateQaAnswer,
      onMoveTrakeUp,
      onMoveTrakeDown,
      onRemoveTrakeItem,
      onJumpTrakeRank,
      onAutoFillTrakeTop100,
      trakeResultsCount = 0,
      onSetNoteText,
      onSwitchToTrakeWithRanking,
      onOpenTrakeForVideo,
      onOpenTrakeForVidResult,
      showToast,
      wsStatus = 'connected',
      onlineUsers = 1,
      onAddToKisRanking,
      onAddToQaRanking,
      onAddToTrakeRanking,
      submitMode = 'S',
    }) {
      const [confirmClear, setConfirmClear] = useState(false);
      const [activeTab, setActiveTab] = useState('kis'); // 'kis' | 'qa' | 'trake' | 'note' | 'history'
      const [bulkQaAnswer, setBulkQaAnswer] = useState('');

      const [jumpingKisIdx, setJumpingKisIdx] = useState(null);
      const [targetKisRank, setTargetKisRank] = useState('');
      const [jumpingQaIdx, setJumpingQaIdx] = useState(null);
      const [targetQaRank, setTargetQaRank] = useState('');
      const [jumpingTrakeIdx, setJumpingTrakeIdx] = useState(null);
      const [targetTrakeRank, setTargetTrakeRank] = useState('');

      // ── Custom CSV Filename & Export Modal State ───────────────────────────
      const [kisFileName, setKisFileName] = useState('query-1-kis.csv');
      const [qaFileName, setQaFileName] = useState('query-2-qa.csv');
      const [trakeFileName, setTrakeFileName] = useState('query-3-trake.csv');
      const [exportModal, setExportModal] = useState(null); // { type, title, fileName, count, csv, color }

      // ── Add Basic state ──────────────────────────────────────────────────────
      const [showAddBasic, setShowAddBasic] = useState(false);
      const [addBasicCombined, setAddBasicCombined] = useState('');
      const [addBasicLoading, setAddBasicLoading] = useState(false);
      const [addBasicError, setAddBasicError] = useState('');
      const BACKEND_BASE = `${window.location.protocol}//${window.location.hostname}:${window.location.port || '8888'}`;

      const _splitVidFrameAb = (s) => {
        const v = String(s || '').trim();
        if (!v) return { vid: '', fid: '', fids: [] };
        // Check for comma or whitespace separated list: e.g. L26_V004, 10, 20 or L26_V004 10 20
        const commaParts = v.split(/[,;\s]+/).map(p => p.trim()).filter(Boolean);
        if (commaParts.length >= 2) {
          const vid = commaParts[0].replace(/\.mp4$/i, '');
          const fids = commaParts.slice(1).filter(p => /^\d+$/.test(p));
          if (fids.length > 0) {
            return { vid, fid: fids[0], fids };
          }
        }
        // Check for underscore format: e.g. L26_V004_10 or L26_V004_10_20_30
        const usParts = v.split('_');
        if (usParts.length >= 3 && (/^L\d+$/i.test(usParts[0]) || /^V\d+$/i.test(usParts[1]))) {
          const vid = `${usParts[0]}_${usParts[1]}`;
          const fids = usParts.slice(2).filter(p => /^\d+$/.test(p));
          if (fids.length > 0) {
            return { vid, fid: fids[0], fids };
          }
        } else {
          const lastUs = v.lastIndexOf('_');
          const lastDash = v.lastIndexOf('-');
          const lastSep = Math.max(lastUs, lastDash);
          if (lastSep > 0) {
            const left = v.slice(0, lastSep);
            const right = v.slice(lastSep + 1);
            if (/^\d+$/.test(right)) return { vid: left.trim(), fid: right.trim(), fids: [right.trim()] };
          }
        }
        return { vid: v, fid: '', fids: [] };
      };

      const handleAddBasicSubmit = async () => {
        const { vid, fid, fids } = _splitVidFrameAb(addBasicCombined);
        if (!vid || !fid) { setAddBasicError('Vui lòng nhập đúng format: L26_V004_0 hoặc L26_V004,10,20,30'); return; }
        setAddBasicError('');
        setAddBasicLoading(true);
        try {
          const params = new URLSearchParams({ video_id: vid, frame_idx: fid });
          const res = await fetch(`${BACKEND_BASE}/api/v1/frame/timestamp?${params}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Không tìm thấy frame');

          const kfItem = {
            id: data.keyframe_id,
            keyframe_id: data.keyframe_id,
            videoId: data.video_id,
            videoTitle: data.video_id,
            frameId: data.frame_idx,
            timestamp: data.timestamp,
            pts_time: data.pts_time,
            thumbnailUrl: `${BACKEND_BASE}${data.image_url}`,
            score: 1.0,
            matchedSources: [],
            caption: data.keyframe_id,
          };

          if (activeTab === 'kis' && onAddToKisRanking) {
            onAddToKisRanking(kfItem);
            if (showToast) showToast(`Đã thêm ${data.keyframe_id} vào KIS Ranking`, 'success');
          } else if (activeTab === 'qa' && onAddToQaRanking) {
            onAddToQaRanking(kfItem);
            if (showToast) showToast(`Đã thêm ${data.keyframe_id} vào QA Ranking`, 'success');
          } else if (activeTab === 'trake' && onAddToTrakeRanking) {
            const frameList = (fids && fids.length > 0) ? fids : [fid];
            const timeline = frameList.map((fIdx, i) => ({
              event_id: `E${i + 1}`,
              frame_idx: parseInt(fIdx, 10),
              timestamp: (parseInt(fIdx, 10) === parseInt(data.frame_idx, 10) && data.timestamp) ? data.timestamp : 0,
              pts_time: (parseInt(fIdx, 10) === parseInt(data.frame_idx, 10) && data.pts_time) ? data.pts_time : 0,
              image_path: `${vid}/${vid}_kf_${String(fIdx).padStart(4, '0')}.jpg`,
              keyframe_id: `${vid}_${fIdx}`,
              thumbnailUrl: parseInt(fIdx, 10) === parseInt(data.frame_idx, 10) ? `${BACKEND_BASE}${data.image_url}` : undefined,
            }));
            const trakeItem = {
              ...kfItem,
              video_id: vid,
              videoId: vid,
              timeline,
            };
            onAddToTrakeRanking(trakeItem);
            if (showToast) showToast(`Đã thêm chuỗi video ${vid} (${timeline.length} mốc) vào TRAKE Ranking`, 'success');
          } else {
            if (showToast) showToast('Tab hiện tại không hỗ trợ thêm trực tiếp', 'warning');
          }
          setAddBasicCombined('');
          setShowAddBasic(false);
        } catch (e) {
          setAddBasicError(e.message || 'Lỗi khi tải thông tin frame');
        } finally {
          setAddBasicLoading(false);
        }
      };
      // ────────────────────────────────────────────────────────────────────────

      const kisList = clipboard.kisRanking || [];
      const qaList = clipboard.qaRanking || [];
      const trakeList = clipboard.trakeRanking || [];
      const noteList = clipboard.savedImages || [];
      const historyList = clipboard.queryHistory || [];

      const totalItems = kisList.length + qaList.length + trakeList.length + noteList.length + historyList.length;
      const hasItems = totalItems > 0;

      const handleClear = () => {
        if (!confirmClear) {
          setConfirmClear(true);
          return;
        }
        onClearAll();
        setConfirmClear(false);
      };

      const copyText = (txt, msg) => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(() => {
            if (showToast) showToast(msg || 'Đã sao chép vào bộ nhớ tạm!', 'success');
          }).catch(() => {
            if (showToast) showToast('Không thể sao chép!', 'error');
          });
        }
      };

      const handleConfirmKisJump = (fromIdx) => {
        const target = parseInt(targetKisRank, 10);
        if (isNaN(target) || target < 1) {
          if (showToast) showToast('Vui lòng nhập thứ hạng từ 1 trở lên', 'info');
          return;
        }
        if (onJumpKisRank) onJumpKisRank(fromIdx, target - 1);
        setJumpingKisIdx(null);
      };

      const handleConfirmQaJump = (fromIdx) => {
        const target = parseInt(targetQaRank, 10);
        if (isNaN(target) || target < 1) {
          if (showToast) showToast('Vui lòng nhập thứ hạng từ 1 trở lên', 'info');
          return;
        }
        if (onJumpQaRank) onJumpQaRank(fromIdx, target - 1);
        setJumpingQaIdx(null);
      };

      const handleConfirmTrakeJump = (fromIdx) => {
        const target = parseInt(targetTrakeRank, 10);
        if (isNaN(target) || target < 1) {
          if (showToast) showToast('Vui lòng nhập thứ hạng từ 1 trở lên', 'info');
          return;
        }
        if (onJumpTrakeRank) onJumpTrakeRank(fromIdx, target - 1);
        setJumpingTrakeIdx(null);
      };

      const handleOpenExportKisModal = () => {
        if (kisList.length === 0) {
          if (showToast) showToast('Danh sách KIS đang trống!', 'info');
          return;
        }
        const csv = buildKisCsv(kisList);
        setExportModal({
          type: 'kis',
          title: 'Tải file CSV cho Textual KIS',
          fileName: kisFileName.endsWith('.csv') ? kisFileName : `${kisFileName}.csv`,
          count: kisList.length,
          csv: csv,
          color: 'sky'
        });
      };

      const handleExportKisCsv = () => {
        handleOpenExportKisModal();
      };

      const handleCopyKisCsv = () => {
        if (kisList.length === 0) {
          if (showToast) showToast('Danh sách KIS đang trống!', 'info');
          return;
        }
        const csv = buildKisCsv(kisList);
        copyText(csv, `Đã sao chép ${kisList.length} dòng CSV KIS!`);
      };

      const handleOpenExportQaModal = () => {
        if (qaList.length === 0) {
          if (showToast) showToast('Danh sách Q&A đang trống!', 'info');
          return;
        }
        const csv = buildQaCsv(qaList);
        setExportModal({
          type: 'qa',
          title: 'Tải file CSV cho Q&A (VQA)',
          fileName: qaFileName.endsWith('.csv') ? qaFileName : `${qaFileName}.csv`,
          count: qaList.length,
          csv: csv,
          color: 'purple'
        });
      };

      const handleExportQaCsv = () => {
        handleOpenExportQaModal();
      };

      const handleCopyQaCsv = () => {
        if (qaList.length === 0) {
          if (showToast) showToast('Danh sách Q&A đang trống!', 'info');
          return;
        }
        const csv = buildQaCsv(qaList);
        copyText(csv, `Đã sao chép ${qaList.length} dòng CSV Q&A!`);
      };

      const handleApplyBulkQaAnswer = () => {
        if (!bulkQaAnswer.trim()) {
          if (showToast) showToast('Vui lòng nhập câu trả lời cần gán!', 'info');
          return;
        }
        if (qaList.length === 0) {
          if (showToast) showToast('Danh sách Q&A đang trống!', 'info');
          return;
        }
        qaList.forEach((_, idx) => {
          if (onUpdateQaAnswer) onUpdateQaAnswer(idx, bulkQaAnswer.trim());
        });
        if (showToast) showToast(`Đã gán đáp án "${bulkQaAnswer.trim()}" cho toàn bộ ${qaList.length} kết quả Q&A!`, 'success');
        setBulkQaAnswer('');
      };

      const handleOpenExportTrakeModal = () => {
        if (trakeList.length === 0) {
          if (showToast) showToast('Danh sách TRAKE đang trống!', 'info');
          return;
        }
        const csv = buildTrakeCsv(trakeList);
        setExportModal({
          type: 'trake',
          title: 'Tải file CSV cho TRAKE',
          fileName: trakeFileName.endsWith('.csv') ? trakeFileName : `${trakeFileName}.csv`,
          count: trakeList.length,
          csv: csv,
          color: 'indigo'
        });
      };

      const handleExportTrakeCsv = () => {
        handleOpenExportTrakeModal();
      };

      const handleCopyTrakeCsv = () => {
        if (trakeList.length === 0) {
          if (showToast) showToast('Danh sách TRAKE đang trống!', 'info');
          return;
        }
        const csv = buildTrakeCsv(trakeList);
        copyText(csv, `Đã sao chép ${trakeList.length} dòng CSV TRAKE!`);
      };

      const handleConfirmExportCsv = (customName) => {
        if (!exportModal) return;
        let finalName = (customName || exportModal.fileName || 'result.csv').trim();
        if (!finalName) finalName = 'result.csv';
        if (!finalName.toLowerCase().endsWith('.csv')) {
          finalName += '.csv';
        }
        downloadCsvFile(exportModal.csv, finalName);
        if (showToast) showToast(`Đã xuất file ${finalName} (${exportModal.count} dòng)`, 'success');

        if (exportModal.type === 'kis') setKisFileName(finalName);
        else if (exportModal.type === 'qa') setQaFileName(finalName);
        else if (exportModal.type === 'trake') setTrakeFileName(finalName);

        setExportModal(null);
