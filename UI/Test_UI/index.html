<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K2PN – Giao diện Tìm kiếm Video/Ảnh (AI Challenge 2026)</title>
  <meta name="description"
    content="Hệ thống tìm kiếm ảnh keyframe thông minh sử dụng Jina CLIP v2 và SigLIP2 kết hợp RRF Fusion">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #f8fafc;
      font-family: 'Inter', sans-serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @keyframes shimmer {
      0% {
        background-position: -400px 0;
      }

      100% {
        background-position: 400px 0;
      }
    }

    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 0px, #f1f5f9 200px, #e2e8f0 400px);
      background-size: 800px 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fade-in 0.2s ease-out;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-toast-in {
      animation: toast-in 0.25s ease-out;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 antialiased select-none min-h-screen">
  <div id="root"></div>
  <div id="global-error-banner"
    style="display:none; padding:20px; margin:20px; background:#fff1f2; border:2px solid #f43f5e; border-radius:12px; color:#9f1239; font-family:monospace; font-size:13px; line-height:1.5; white-space:pre-wrap; z-index:999999; position:relative; box-shadow:0 10px 25px rgba(0,0,0,0.1);">
  </div>
  <script>
    window.addEventListener('error', function (e) {
      var box = document.getElementById('global-error-banner');
      if (box) {
        box.style.display = 'block';
        box.textContent = '❌ Lỗi JavaScript / Babel:\n' + (e.message || e.error || e) + '\n\nFile: ' + e.filename + ' (Dòng: ' + e.lineno + ', Cột: ' + e.colno + ')\n\n' + (e.error && e.error.stack ? e.error.stack : '');
      }
    });
    window.addEventListener('unhandledrejection', function (e) {
      var box = document.getElementById('global-error-banner');
      if (box) {
        box.style.display = 'block';
        box.textContent = '❌ Lỗi Promise Rejection:\n' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : e);
      }
    });
  </script>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    const MOCK_RESULTS = [
      { id: "res-1", rank: 1, videoId: "L01_V001", videoTitle: "Hành trình xe đạp TPHCM", frameId: "100", timestamp: "00:04:00", score: 0.94, matchedType: "text", caption: "Người đàn ông đi xe đạp trên con đường rợp bóng cây", thumbnailUrl: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=600&auto=format&fit=crop&q=80" },
      { id: "res-2", rank: 2, videoId: "L01_V002", videoTitle: "Xe cơ giới giao thông", frameId: "250", timestamp: "00:10:00", score: 0.88, matchedType: "object", caption: "Ô tô màu đỏ chạy trong thành phố đông đúc", thumbnailUrl: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600&auto=format&fit=crop&q=80" },
      { id: "res-3", rank: 3, videoId: "L02_V001", videoTitle: "Ẩm thực đường phố", frameId: "500", timestamp: "00:20:00", score: 0.85, matchedType: "asr", caption: "Người phụ nữ đang chuẩn bị nguyên liệu nấu ăn", thumbnailUrl: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?w=600&auto=format&fit=crop&q=80" },
    ];

    const SEARCH_TYPES = [
      { id: 'text', label: 'Text (Semantic)', tabLabel: 'TEXT', shortLabel: 'Text', iconName: 'type', placeholder: 'Mô tả nội dung ảnh bằng văn bản...' },
      { id: 'ocr', label: 'OCR', tabLabel: 'OCR', shortLabel: 'OCR', iconName: 'scan-text', placeholder: 'Tìm theo văn bản trong ảnh...' },
      { id: 'asr', label: 'ASR', tabLabel: 'ASR', shortLabel: 'ASR', iconName: 'mic', placeholder: 'Tìm theo lời thoại / âm thanh...' },
      { id: 'image', label: 'Keyframe (Image)', tabLabel: 'IMG', shortLabel: 'Keyframe', iconName: 'image', placeholder: 'VD: L21_V001_12345 (Video ID + Frame ID)...' },
    ];

    const CLIPBOARD_KEY = 'aic2026_clipboard';
    const MAX_QUERY_HISTORY = 15;
    const MAX_SAVED_IMAGES = 30;
    const MAX_RANKING_ITEMS = 200;

    const getSourceMeta = (src) => {
      if (!src) return { label: 'UNKNOWN', color: 'bg-slate-500 text-white', ring: 'ring-slate-200' };
      const s = String(src).toLowerCase();
      if (s.startsWith('semantic') || s.startsWith('text')) {
        return { label: src.toUpperCase(), color: 'bg-sky-500 text-white', ring: 'ring-sky-200' };
      }
      if (s.startsWith('ocr')) {
        return { label: src.toUpperCase(), color: 'bg-amber-500 text-white', ring: 'ring-amber-200' };
      }
      if (s.startsWith('asr')) {
        return { label: src.toUpperCase(), color: 'bg-purple-500 text-white', ring: 'ring-purple-200' };
      }
      if (s.startsWith('image') || s.startsWith('keyframe')) {
        return { label: src.toUpperCase(), color: 'bg-emerald-500 text-white', ring: 'ring-emerald-200' };
      }
      if (s.startsWith('temporal')) {
        return { label: src.toUpperCase(), color: 'bg-indigo-500 text-white', ring: 'ring-indigo-200' };
      }
      if (s.startsWith('trake')) {
        return { label: src.toUpperCase(), color: 'bg-teal-500 text-white', ring: 'ring-teal-200' };
      }
      return { label: src.toUpperCase(), color: 'bg-slate-500 text-white', ring: 'ring-slate-200' };
    };


    const PANEL_TYPE_META = {
      text: { label: 'Text', color: 'bg-sky-100 text-sky-800 border-sky-200' },
      ocr: { label: 'OCR', color: 'bg-amber-100 text-amber-800 border-amber-200' },
      asr: { label: 'ASR', color: 'bg-purple-100 text-purple-800 border-purple-200' },
      image: { label: 'Keyframe', color: 'bg-emerald-100 text-emerald-800 border-emerald-200' },
    };

    const ACTIVE_TAB_COLORS = {
      text: 'bg-sky-600 text-white shadow-sm scale-105',
      ocr: 'bg-amber-500 text-white shadow-sm scale-105',
      asr: 'bg-purple-600 text-white shadow-sm scale-105',
      image: 'bg-emerald-600 text-white shadow-sm scale-105',
    };

    const SOFT_ICON_COLORS = {
      text: 'bg-sky-100 text-sky-700',
      ocr: 'bg-amber-100 text-amber-700',
      asr: 'bg-purple-100 text-purple-700',
      image: 'bg-emerald-100 text-emerald-700',
    };

    const HOVER_MENU_COLORS = {
      text: 'hover:bg-sky-50 hover:text-sky-700',
      ocr: 'hover:bg-amber-50 hover:text-amber-700',
      asr: 'hover:bg-purple-50 hover:text-purple-700',
      image: 'hover:bg-emerald-50 hover:text-emerald-700',
    };

    const SEARCH_COLORS = {
      text: {
        accent: 'bg-sky-600',
        text: 'text-sky-600',
        border: 'border-sky-200',
        hoverBorder: 'hover:border-sky-300',
        focusBorder: 'focus:border-sky-500',
        focusRing: 'focus:ring-sky-200',
        accentColor: 'accent-sky-600',
      },
      ocr: {
        accent: 'bg-amber-600',
        text: 'text-amber-600',
        border: 'border-amber-200',
        hoverBorder: 'hover:border-amber-300',
        focusBorder: 'focus:border-amber-500',
        focusRing: 'focus:ring-amber-200',
        accentColor: 'accent-amber-600',
      },
      asr: {
        accent: 'bg-purple-600',
        text: 'text-purple-600',
        border: 'border-purple-200',
        hoverBorder: 'hover:border-purple-300',
        focusBorder: 'focus:border-purple-500',
        focusRing: 'focus:ring-purple-200',
        accentColor: 'accent-purple-600',
      },
      image: {
        accent: 'bg-emerald-600',
        text: 'text-emerald-600',
        border: 'border-emerald-200',
        hoverBorder: 'hover:border-emerald-300',
        focusBorder: 'focus:border-emerald-500',
        focusRing: 'focus:ring-emerald-200',
        accentColor: 'accent-emerald-600',
      }
    };


    function loadClipboard() {
      try {
        const raw = localStorage.getItem(CLIPBOARD_KEY);
        if (!raw) return { kisRanking: [], qaRanking: [], trakeRanking: [], savedImages: [], queryHistory: [], noteText: '' };
        const data = JSON.parse(raw);
        let kis = Array.isArray(data.kisRanking) ? data.kisRanking.slice(0, 100) : [];
        let qa = Array.isArray(data.qaRanking) ? data.qaRanking.slice(0, 100) : [];
        let trake = Array.isArray(data.trakeRanking) ? data.trakeRanking.slice(0, 100).map(item => {
          if (!item || typeof item !== 'object') return null;
          return {
            ...item,
            video_id: item.video_id || item.videoId,
            timeline: Array.isArray(item.timeline) ? item.timeline : (item.frameId !== undefined ? [{ event_id: 'E1', frame_idx: Number(item.frameId), timestamp: item.timestamp || 0 }] : [])
          };
        }).filter(Boolean) : [];
        // Migration from old single rankingList
        if (kis.length === 0 && qa.length === 0 && trake.length === 0 && Array.isArray(data.rankingList)) {
          data.rankingList.forEach(item => {
            if (!item || typeof item !== 'object') return;
            if (item.timeline || (item.matchedSources && item.matchedSources.includes('trake'))) {
              trake.push(item);
            } else if (item.answer) {
              qa.push(item);
            } else {
              kis.push(item);
            }
          });
        }
        return {
          kisRanking: kis.slice(0, 100),
          qaRanking: qa.slice(0, 100),
          trakeRanking: trake.slice(0, 100),
          savedImages: Array.isArray(data.savedImages) ? data.savedImages.slice(-MAX_SAVED_IMAGES) : [],
          queryHistory: Array.isArray(data.queryHistory) ? data.queryHistory.slice(0, MAX_QUERY_HISTORY) : [],
          noteText: typeof data.noteText === 'string' ? data.noteText : '',
        };
      } catch {
        return { kisRanking: [], qaRanking: [], trakeRanking: [], savedImages: [], queryHistory: [], noteText: '' };
      }
    }

    function persistClipboard(data) {
      try {
        localStorage.setItem(CLIPBOARD_KEY, JSON.stringify(data));
      } catch (e) {
        console.warn('Không thể lưu Clipboard:', e);
      }
    }

    function makeClipboardId() {
      return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function historyFingerprint(entry) {
      return JSON.stringify({ topK: entry.topK, panels: entry.panels });
    }

    function pushQueryHistory(clipboard, entry) {
      const fp = historyFingerprint(entry);
      const history = [entry, ...(clipboard.queryHistory || []).filter((h) => historyFingerprint(h) !== fp)].slice(0, MAX_QUERY_HISTORY);
      return { ...clipboard, queryHistory: history };
    }

    function pushSavedImage(clipboard, image) {
      const kid = image.keyframe_id || image.id;
      if ((clipboard.savedImages || []).some((img) => (img.keyframe_id || img.id) === kid)) {
        return { data: clipboard, added: false };
      }
      let saved = [...(clipboard.savedImages || []), image];
      if (saved.length > MAX_SAVED_IMAGES) saved = saved.slice(-MAX_SAVED_IMAGES);
      return { data: { ...clipboard, savedImages: saved }, added: true };
    }

    function getSurroundingFrames(item, N) {
      if (!N || N <= 0) return [item];

      const frameIdx = Number(item.frameId !== undefined ? item.frameId : item.frame_idx);
      if (isNaN(frameIdx)) return [item];

      const results = [];
      const kfId = item.keyframe_id || item.id || '';

      let prefix = `${item.videoId}_kf_`;
      let padLen = 4;
      const match = kfId.match(/^(.*?)(\d+)$/);
      if (match) {
        prefix = match[1];
        padLen = match[2].length;
      }

      const offsets = [0];
      for (let i = 1; i <= N; i++) {
        offsets.push(i);
        offsets.push(-i);
      }

      for (const offset of offsets) {
        const curFrameIdx = frameIdx + offset;
        if (curFrameIdx < 0) continue;

        const curKfId = `${prefix}${String(curFrameIdx).padStart(padLen, '0')}`;

        if (offset === 0) {
          results.push(item);
          continue;
        }

        const newItem = {
          ...item,
          id: curKfId,
          keyframe_id: curKfId,
          frameId: curFrameIdx,
          frame_idx: curFrameIdx,
          timestamp: typeof item.timestamp === 'number' ? Math.max(0, item.timestamp + offset * 500) : item.timestamp,
          pts_time: typeof item.pts_time === 'number' ? Math.max(0, item.pts_time + offset * 0.5) : item.pts_time,
          thumbnailUrl: item.thumbnailUrl ? item.thumbnailUrl.replace(kfId, curKfId) : '',
          score: item.score,
          rank: item.rank,
          matchedSources: [...(item.matchedSources || []), 'surrounding'],
          caption: `${item.videoId} - Frame ${curFrameIdx} (Lân cận)`,
        };
        results.push(newItem);
      }
      return results;
    }

    function getItemFrameKey(item) {
      if (!item) return '';
      const vid = String(item.videoId || item.video_id || '').replace(/\.mp4$/i, '').trim();
      const fid = item.frameId !== undefined ? item.frameId : item.frame_idx;
      if (vid && fid !== undefined && fid !== '') return `${vid}_${fid}`;
      return item.id || item.keyframe_id || '';
    }

    function pushKisRanking(clipboard, item, opts = {}) {
      const fKey = getItemFrameKey(item);
      if (!fKey) return { data: clipboard, added: false };
      const existing = clipboard.kisRanking || [];
      const exists = existing.some((r) => getItemFrameKey(r) === fKey);
      if (exists) return { data: clipboard, added: false };
      let ranked = [...existing, { ...item }];
      if (ranked.length > 100) ranked = ranked.slice(0, 100);
      return { data: { ...clipboard, kisRanking: ranked }, added: true };
    }

    function pushQaRanking(clipboard, item, opts = {}) {
      const { isSurrounding = false } = opts;
      const fKey = getItemFrameKey(item);
      if (!fKey) return { data: clipboard, added: false, updated: false };
      const existing = clipboard.qaRanking || [];
      if (isSurrounding) {
        const exists = existing.some((r) => getItemFrameKey(r) === fKey);
        if (exists) return { data: clipboard, added: false, updated: false };
      } else {
        const newAns = String(item.answer || '').trim();
        const sameKeyAndAnswer = existing.some((r) => {
          if (getItemFrameKey(r) !== fKey) return false;
          const rAns = String(r.answer || '').trim();
          return rAns === newAns;
        });
        if (sameKeyAndAnswer) return { data: clipboard, added: false, updated: false };
      }
      let ranked = [...existing, { ...item }];
      if (ranked.length > 100) ranked = ranked.slice(0, 100);
      return { data: { ...clipboard, qaRanking: ranked }, added: true, updated: false };
    }

    function getTrakeSequenceKey(item) {
      if (!item) return '';
      const vid = String(item.video_id || item.videoId || '').replace(/\.mp4$/i, '').trim();
      let fids = [];
      if (Array.isArray(item.timeline) && item.timeline.length > 0) {
        fids = item.timeline.map(f => parseInt(f.frame_idx !== undefined ? f.frame_idx : (f.frameId !== undefined ? f.frameId : 0), 10));
      } else if (Array.isArray(item.frame_chain) && item.frame_chain.length > 0) {
        fids = item.frame_chain.map(f => parseInt(f.frame_idx !== undefined ? f.frame_idx : (f.frameId !== undefined ? f.frameId : 0), 10));
      } else if (item.frameId !== undefined || item.frame_idx !== undefined) {
        fids = [parseInt(item.frameId !== undefined ? item.frameId : item.frame_idx, 10)];
      }

      if (fids.length > 0) {
        return `${vid}__${fids.join('_')}`;
      }
      if (item.sequence_id !== undefined) {
        return `${vid}__seq_${item.sequence_id}`;
      }
      if (item.id || item.keyframe_id) {
        return `${vid}__${item.id || item.keyframe_id}`;
      }
      return vid;
    }

    function pushTrakeRanking(clipboard, vidResult) {
      const vid = vidResult.video_id || vidResult.videoId;
      if (!vid) return { data: clipboard, added: false, updated: false };

      const newKey = getTrakeSequenceKey(vidResult);
      const existing = clipboard.trakeRanking || [];
      const existingIdx = existing.findIndex((r) => getTrakeSequenceKey(r) === newKey);

      const newEntry = {
        ...vidResult,
        video_id: vid,
        timeline: Array.isArray(vidResult.timeline) ? vidResult.timeline : (vidResult.frameId !== undefined || vidResult.frame_idx !== undefined ? [{
          event_id: 'E1',
          frame_idx: parseInt(vidResult.frameId !== undefined ? vidResult.frameId : vidResult.frame_idx, 10),
          timestamp: vidResult.timestamp || 0,
          pts_time: vidResult.pts_time || 0,
          keyframe_id: vidResult.keyframe_id || `${vid}_${vidResult.frameId !== undefined ? vidResult.frameId : vidResult.frame_idx}`,
          thumbnailUrl: vidResult.thumbnailUrl,
        }] : []),
      };

      if (existingIdx >= 0) {
        const updated = [...existing];
        updated[existingIdx] = { ...updated[existingIdx], ...newEntry };
        return { data: { ...clipboard, trakeRanking: updated }, added: false, updated: true };
      }
      let ranked = [...existing, newEntry];
      if (ranked.length > 100) ranked = ranked.slice(0, 100);
      return { data: { ...clipboard, trakeRanking: ranked }, added: true, updated: false };
    }

    function downloadCsvFile(content, filename) {
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function buildKisCsv(list) {
      return (list || []).slice(0, 100).map(item => {
        const vid = String(item.videoId || item.video_id || '').replace(/\.mp4$/i, '').trim();
        const fid = parseInt(item.frameId !== undefined ? item.frameId : item.frame_idx, 10) || 0;
        return `${vid},${fid}`;
      }).join('\n');
    }

    function buildQaCsv(list) {
      return (list || []).slice(0, 100).map(item => {
        const vid = String(item.videoId || item.video_id || '').replace(/\.mp4$/i, '').trim();
        const fid = parseInt(item.frameId !== undefined ? item.frameId : item.frame_idx, 10) || 0;
        let ans = String(item.answer || '').trim();
        if (ans.length > 100) ans = ans.slice(0, 100);
        const escaped = ans.replace(/"/g, '""');
        return `${vid},${fid},"${escaped}"`;
      }).join('\n');
    }

    function buildTrakeCsv(list) {
      return (list || []).slice(0, 100).map(item => {
        const vid = String(item.video_id || item.videoId || '').replace(/\.mp4$/i, '').trim();
        let fids = [];
        if (Array.isArray(item.timeline) && item.timeline.length > 0) {
          fids = item.timeline.map(f => parseInt(f.frame_idx !== undefined ? f.frame_idx : (f.frameId || 0), 10));
        } else if (item.frameId !== undefined || item.frame_idx !== undefined) {
          fids = [parseInt(item.frameId !== undefined ? item.frameId : item.frame_idx, 10)];
        }
        return [vid, ...fids].join(',');
      }).join('\n');
    }

    function extractRankingFileName(item) {
      if (!item) return 'Unknown';
      if (item.keyframe_id) return item.keyframe_id;
      if (item.videoId && (item.frameId !== undefined && item.frameId !== '')) return `${item.videoId}_F${item.frameId}`;
      if (item.videoId) return item.videoId;
      if (item.id) return item.id;
      return 'Unknown';
    }

    function formatRelativeTime(iso) {
      if (!iso) return '';
      const t = new Date(iso).getTime();
      if (isNaN(t)) return '';
      const diff = Date.now() - t;
      const sec = Math.floor(diff / 1000);
      if (sec < 45) return 'Vừa xong';
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min} phút trước`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr} giờ trước`;
      return new Date(iso).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function Toast({ message, tone, onClose }) {
      useEffect(() => {
        const t = setTimeout(onClose, 2800);
        return () => clearTimeout(t);
      }, [onClose]);
      const tones = {
        success: 'bg-slate-900 text-white border-slate-700',
        info: 'bg-amber-600 text-white border-amber-500',
        error: 'bg-rose-600 text-white border-rose-500',
      };
      return (
        <div className={`fixed bottom-6 right-6 z-[100] px-4 py-3 rounded-xl shadow-2xl border text-sm font-semibold animate-toast-in flex items-center gap-2 ${tones[tone] || tones.success}`}>
          <Icon name={tone === 'success' ? 'check-circle' : tone === 'error' ? 'x-circle' : 'bookmark'} className="w-4 h-4 shrink-0" />
          <span>{message}</span>
        </div>
      );
    }

    const ICONS = {

    function Icon({ name, className }) {
      const IconComponent = ICONS[name] || ICONS.default;
      return <IconComponent className={className} />;
    }

    function RankingImage({ item, className = "w-12 h-8 object-cover rounded bg-slate-900 shrink-0 border border-slate-200" }) {
      const [src, setSrc] = React.useState(item?.thumbnailUrl || '');
      const [hasError, setHasError] = React.useState(false);

      React.useEffect(() => {
        setSrc(item?.thumbnailUrl || '');
        setHasError(false);
      }, [item?.thumbnailUrl]);

      if (!src || hasError) {
        return null;
      }

      return (
        <img
          src={src}
          onError={() => setHasError(true)}
          alt=""
          className={className}
        />
      );
    }

    function RadiusSelector({ value, onChange, theme = 'slate' }) {
      const [isOpen, setIsOpen] = React.useState(false);

      const options = [
        { value: 0, label: '0 (Chỉ đúng frame này)' },
        { value: 1, label: '1 (± 1 frame lân cận)' },
        { value: 2, label: '2 (± 2 frame lân cận)' },
        { value: 3, label: '3 (± 3 frame lân cận)' },
        { value: 5, label: '5 (± 5 frame lân cận)' },
        { value: 10, label: '10 (± 10 frame lân cận)' }
      ];

      const activeOption = options.find(opt => opt.value === value) || options[0];

      const containerRef = React.useRef(null);
      React.useEffect(() => {
        function handleClickOutside(event) {
          if (containerRef.current && !containerRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        }
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const getThemeClasses = () => {
        if (theme === 'purple') {
          return {
            button: 'bg-white hover:bg-purple-50 text-purple-900 border-purple-200 focus:ring-purple-500/20 focus:border-purple-500',
            menu: 'bg-white border-purple-100 shadow-purple-100/50',
            itemHover: 'hover:bg-purple-50 hover:text-purple-900',
            itemActive: 'bg-purple-600 text-white hover:bg-purple-700'
          };
        }
        if (theme === 'indigo') {
          return {
            button: 'bg-white hover:bg-indigo-50 text-indigo-900 border-indigo-200 focus:ring-indigo-500/20 focus:border-indigo-500',
            menu: 'bg-white border-indigo-100 shadow-indigo-100/50',
            itemHover: 'hover:bg-indigo-50 hover:text-indigo-900',
            itemActive: 'bg-indigo-600 text-white hover:bg-indigo-700'
          };
        }
        return {
          button: 'bg-white hover:bg-slate-50 text-slate-800 border-slate-200 focus:ring-sky-500/20 focus:border-sky-500',
          menu: 'bg-white border-slate-100 shadow-slate-100/50',
          itemHover: 'hover:bg-slate-50 hover:text-slate-900',
          itemActive: 'bg-sky-600 text-white hover:bg-sky-700'
        };
      };

      const classes = getThemeClasses();

      return (
        <div ref={containerRef} className="relative inline-block text-left">
          <button
            type="button"
            onClick={() => setIsOpen(!isOpen)}
            className={`flex items-center justify-between gap-2 px-3 py-1.5 border rounded-xl font-bold text-xs shadow-xs focus:outline-none focus:ring-2 transition-all cursor-pointer min-w-[170px] ${classes.button}`}
          >
            <span>{activeOption.label}</span>
            <svg className={`w-3.5 h-3.5 text-slate-400 transition-transform duration-200 shrink-0 ${isOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
              <polyline points="6 9 12 15 18 9" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
          </button>

          {isOpen && (
            <div className={`absolute right-0 z-[100] mt-1 w-[200px] origin-top-right rounded-xl border bg-white p-1 shadow-lg ring-1 ring-black/5 focus:outline-none ${classes.menu}`}>
              <div className="py-0.5 space-y-0.5">
                {options.map((opt) => {
                  const isSelected = opt.value === value;
                  return (
                    <button
                      key={opt.value}
                      type="button"
                      onClick={() => {
                        onChange(opt.value);
                        setIsOpen(false);
                      }}
                      className={`w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition-colors flex items-center justify-between ${isSelected ? classes.itemActive : `text-slate-700 ${classes.itemHover}`
                        }`}
                    >
                      <span>{opt.label}</span>
                      {isSelected && (
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                          <polyline points="20 6 9 17 4 12" strokeLinecap="round" strokeLinejoin="round" />
                        </svg>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { error: null };
      }
      static getDerivedStateFromError(error) {
        return { error };
      }
      componentDidCatch(error, info) {
        console.error('ErrorBoundary caught', error, info);
      }
      reset = () => this.setState({ error: null });
      render() {
        if (this.state.error) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100">
              <div className="max-w-lg w-full bg-white border border-rose-200 rounded-xl p-6 text-center shadow">
                <h3 className="text-lg font-bold text-rose-700 mb-2">Đã xảy ra lỗi giao diện</h3>
                <p className="text-sm text-slate-600 mb-4">Có lỗi nội bộ khi render giao diện: <span className="font-mono text-xs break-all">{String(this.state.error)}</span></p>
                <div className="flex items-center justify-center gap-2">
                  <button onClick={() => location.reload()} className="py-2 px-4 bg-sky-600 text-white rounded">Tải lại</button>
                  <button onClick={this.reset} className="py-2 px-4 bg-slate-100 border rounded">Đóng thông báo</button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function Header({ onReset, topK, onChangeTopK, queryTime, isSearching, viewMode, onChangeViewMode, clipboardCount, submitMode, onChangeSubmitMode }) {
      const handleTopKInput = (e) => {
        const val = parseInt(e.target.value, 10);
        if (!isNaN(val) && val >= 1 && val <= 500) onChangeTopK(val);
        else if (e.target.value === '') onChangeTopK(1);
      };
      const decrement = () => onChangeTopK(Math.max(1, topK - (topK > 20 ? 5 : 1)));
      const increment = () => onChangeTopK(Math.min(500, topK + (topK >= 20 ? 5 : 1)));

    function SearchPanel({ panel, index, totalPanels, onUpdate, onRemove, onEnterSearch }) {

      const [history, setHistory] = React.useState(query ? [query] : []);

      React.useEffect(() => {
        const timeout = setTimeout(() => {
          setHistory(prev => {
            if (query && query !== prev[prev.length - 1]) {
              return [...prev, query].slice(-20);
            }
            return prev;
          });
        }, 800);
        return () => clearTimeout(timeout);
      }, [query]);

      const handleUndo = () => {
        setHistory(prev => {
          if (prev.length > 1) {
            if (query === prev[prev.length - 1]) {
              const newHist = prev.slice(0, prev.length - 1);
              onUpdate({ ...panel, query: newHist[newHist.length - 1] });
              return newHist;
            } else {
              onUpdate({ ...panel, query: prev[prev.length - 1] });
              return prev;
            }
          } else if (prev.length === 1) {
            if (query !== prev[0]) {
              onUpdate({ ...panel, query: prev[0] });
            } else {
              onUpdate({ ...panel, query: '' });
              return [];
            }
            return prev;
          }
          return prev;
        });
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (onEnterSearch) onEnterSearch();

      const colors = SEARCH_COLORS[type] || SEARCH_COLORS.text;

    function getResolvedImageUrl(pathOrUrl, videoId, kfId) {
      if (!pathOrUrl && videoId && kfId) {
        pathOrUrl = `${videoId}/${kfId}.jpg`;
      }
      if (!pathOrUrl) return '';
      let str = String(pathOrUrl).trim();
      if (str.startsWith('http://') || str.startsWith('https://') || str.startsWith('data:')) {
        return str;
      }
      const prefixes = [
        '/AIClub_NAS/core_baotg/nhan/dataset/keyframes/',
        '/AIClub_NAS/core_baotg/nhan/dataset/metadata/keyframes/',
        '/AIClub_NAS/core_baotg/nhan/dataset/',
        '/AIClub_NAS/Datasets/HCMAI25/full/',
        '/AIClub_NAS/Datasets/Viettel_AI_Track_1/',
        '/mlcv1/WorkingSpace/Personal/baotg/AIC_2026/dataset/keyframes/',
        '/mlcv1/WorkingSpace/Personal/baotg/AIC_2026/dataset/',
        '/mlcv1/WorkingSpace/Personal/baotg/AIC_2026/keyframes/',
        '/mlcv1/Datasets/HCMAI25/full/',
        '/mlcv1/Datasets/HCMAI25/batch1/',
        '/mlcv1/Datasets/HCMAI25/streaming/',
        '/workspace/dataset/keyframes/',
        '/workspace/dataset/metadata/keyframes/',
        '/workspace/dataset/HCMAI25/full/',
        '/workspace/dataset/HCMAI25/batch1/',
        '/workspace/dataset/HCMAI25/streaming/',
        '/workspace/dataset/Viettel_AI_Track_1/',
        '/workspace/dataset/',
        '/dataset/keyframes/',
        '/dataset/',
        '/keyframes/',
        'keyframes/',
      ];
      for (const prefix of prefixes) {
        while (str.startsWith(prefix)) {
          str = str.substring(prefix.length);
        }
      }
      while (str.startsWith('/images/')) {
        str = str.substring('/images/'.length);
      }
      str = str.replace(/^\/+/, '');
      if (!str && videoId && kfId) {
        str = `${videoId}/${kfId}.jpg`;
      }
      const backendHost = window.location.hostname || '127.0.0.1';
      const backendPort = window.location.port || '8888';
      return `http://${backendHost}:${backendPort}/images/${str}`;
    }

    function ResultGridImage({ src, alt, lazy }) {
      const MAX_RETRY = 2;
      const getCachedItem = (url) => {
        if (!url || !window.__keyframeLRUCache) return null;
        const c1 = window.__keyframeLRUCache.get(url);
        if (c1 && c1.status === 'loaded') return c1;
        if (window.__keyframeLRUCache.getByUrl) {
          const c2 = window.__keyframeLRUCache.getByUrl(url);
          if (c2 && c2.status === 'loaded') return c2;
        }
        return null;
      };

      const initialCached = getCachedItem(src);
      const [state, setState] = React.useState(initialCached ? 'loaded' : 'loading');
      const [retryCount, setRetryCount] = React.useState(0);
      const [curSrc, setCurSrc] = React.useState(initialCached ? (initialCached.blobUrl || src) : src);

      React.useEffect(() => {
        const cached = getCachedItem(src);
        if (cached) {
          setState('loaded');
          setCurSrc(cached.blobUrl || src);
        } else {
          setState('loading');
          setRetryCount(0);
          setCurSrc(src);
        }
      }, [src]);

      const handleLoad = () => {
        setState('loaded');
        if (window.__keyframeLRUCache) {
          window.__keyframeLRUCache.set(src, { status: 'loaded', url: src });
        }
      };
      const handleError = () => {
        if (retryCount < MAX_RETRY) {
          const next = retryCount + 1;
          setRetryCount(next);
          const sep = src.includes('?') ? '&' : '?';
          setCurSrc(src + sep + '__retry=' + next + '_' + Date.now());
          setState('loading');
        } else {
          setState('error');
        }
      };
      const manualRetry = (e) => {
        e.stopPropagation();
        setRetryCount(0);
        setState('loading');
        const sep = src.includes('?') ? '&' : '?';
        setCurSrc(src + sep + '__retry=m_' + Date.now());
      };
      const openNewTab = (e) => {
        e.stopPropagation();
        const full = src.startsWith('http')
          ? src
          : src.startsWith('/')
            ? `${window.location.origin}${src}`
            : `${window.location.origin}/${src}`;
        window.open(full, '_blank', 'noopener,noreferrer');
      };

      if (state === 'loaded') {
        return (
          <img src={curSrc} alt={alt} loading={lazy ? 'lazy' : 'eager'} decoding="async"

    // =========================================================================
    // 1. IN-MEMORY LRU IMAGE CACHE (Max 80 full images with Blob Revocation)
    // =========================================================================
    class KeyframeLRUCache {
      constructor(maxSize = 600) {
        this.maxSize = maxSize;
        this.cache = new Map(); // key -> { status, url, blobUrl, timestamp }
      }

      get(key) {
        if (!key || !this.cache.has(key)) return null;
        const val = this.cache.get(key);
        // Move to most recent
        this.cache.delete(key);
        this.cache.set(key, val);
        return val;
      }

      getByUrl(url) {
        if (!url) return null;
        if (this.cache.has(url)) return this.get(url);
        const cleanUrl = String(url).split('?')[0];
        const filename = cleanUrl.split('/').pop();
        if (!filename) return null;
        for (const [key, val] of this.cache.entries()) {
          if (val && val.status === 'loaded') {
            if (key === filename || key.endsWith(filename) || (val.url && val.url.includes(filename))) {
              return val;
            }
          }
        }
        return null;
      }

      has(key) {
        return Boolean(key && this.cache.has(key));
      }

      set(key, value) {
        if (!key) return;
        if (this.cache.has(key)) {
          const old = this.cache.get(key);
          if (old.blobUrl && old.blobUrl !== value.blobUrl) {
            try { URL.revokeObjectURL(old.blobUrl); } catch (e) { }
          }
          this.cache.delete(key);
        } else if (this.cache.size >= this.maxSize) {
          // Evict least recently used (first key in map)
          const oldestKey = this.cache.keys().next().value;
          const oldestVal = this.cache.get(oldestKey);
          if (oldestVal && oldestVal.blobUrl) {
            try { URL.revokeObjectURL(oldestVal.blobUrl); } catch (e) { }
          }
          this.cache.delete(oldestKey);
        }
        this.cache.set(key, { ...value, timestamp: Date.now() });
      }

      clear() {
        for (const [k, v] of this.cache.entries()) {
          if (v && v.blobUrl) {
            try { URL.revokeObjectURL(v.blobUrl); } catch (e) { }
          }
        }
        this.cache.clear();
      }
    }

    window.__keyframeLRUCache = window.__keyframeLRUCache || new KeyframeLRUCache(600);

    // =========================================================================
    // 2. CONCURRENCY-LIMITED IMAGE POOL WITH ABORTCONTROLLER (Max 5 parallel)
    // =========================================================================
    class KeyframeImagePool {
      constructor(concurrency = 5) {
        this.concurrency = concurrency;
        this.activeRequests = new Map(); // key -> AbortController
        this.queue = []; // Array of { key, url, priority, controller }
        this.subscribers = new Set();
      }

      subscribe(cb) {
        this.subscribers.add(cb);
        return () => this.subscribers.delete(cb);
      }

      notify(key, data) {
        for (const cb of this.subscribers) {
          try { cb(key, data); } catch (e) { }
        }
      }

      // Load keyframe image with cancellation & concurrency limit
      loadKeyframe(key, url, priority = 0) {
        const cached = window.__keyframeLRUCache.get(key);
        if (cached && cached.status === 'loaded') {
          return;
        }

        // If already active or queued, update priority
        if (this.activeRequests.has(key)) {
          return;
        }

        const existingQueueIdx = this.queue.findIndex(t => t.key === key);
        if (existingQueueIdx >= 0) {
          this.queue[existingQueueIdx].priority = priority;
          this.queue.sort((a, b) => b.priority - a.priority);
          return;
        }

        const controller = new AbortController();
        const task = { key, url, priority, controller };

        this.queue.push(task);
        this.queue.sort((a, b) => b.priority - a.priority);

        this.processQueue();
      }

      processQueue() {
        while (this.activeRequests.size < this.concurrency && this.queue.length > 0) {
          const task = this.queue.shift();
          if (!task) break;

          if (task.controller.signal.aborted) continue;

          const { key, url, controller } = task;
          this.activeRequests.set(key, controller);
          window.__keyframeLRUCache.set(key, { status: 'loading', url });
          this.notify(key, { status: 'loading', url });

          fetch(url, { signal: controller.signal })
            .then(res => {
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return res.blob();
            })
            .then(blob => {
              const blobUrl = URL.createObjectURL(blob);
              const data = { status: 'loaded', url, blobUrl };
              window.__keyframeLRUCache.set(key, data);
              this.activeRequests.delete(key);
              this.notify(key, data);
              this.processQueue();
            })
            .catch(err => {
              this.activeRequests.delete(key);
              if (err.name === 'AbortError') {
                // Aborted because user navigated away before completion
                const cached = window.__keyframeLRUCache.get(key);
                if (cached && cached.status === 'loading') {
                  window.__keyframeLRUCache.cache.delete(key);
                }
              } else {
                const data = { status: 'error', url, error: err.message };
                window.__keyframeLRUCache.set(key, data);
                this.notify(key, data);
              }
              this.processQueue();
            });
        }
      }

      // Abort requests for frames that fall outside the active window
      pruneOutside(visibleKeysSet) {
        // 1. Remove & abort tasks in pending queue
        this.queue = this.queue.filter(task => {
          if (!visibleKeysSet.has(task.key)) {
            task.controller.abort();
            return false;
          }
          return true;
        });

        // 2. Abort in-flight network requests not in visible set
        for (const [key, controller] of this.activeRequests.entries()) {
          if (!visibleKeysSet.has(key)) {
            controller.abort();
            this.activeRequests.delete(key);
            const cached = window.__keyframeLRUCache.get(key);
            if (cached && cached.status === 'loading') {
              window.__keyframeLRUCache.cache.delete(key);
            }
          }
        }

        // Fill freed up concurrency slots for remaining visible tasks
        this.processQueue();
      }
    }

    // Map all keyframes in the video: identical ASR text gets the same group ID & color theme
    const getAsrInfoMap = (frames) => {
      const textToGroup = new Map();
      let groupCounter = 1;
      return (frames || []).map((frame) => {
        const text = getFrameAsrText(frame);

    const getAsrSegmentIndexes = (frames) => {

    const ASR_SEGMENT_CLASSES = ASR_THEMES.map(t => t.barBg);

    // =========================================================================
    // 3. KEYFRAME CONTEXT STRIP COMPONENT (Sliding Window ~11-13 Frames)
    // =========================================================================
    function KeyframeContextStrip({ keyframes, currentIndex, onSelectIndex, radius = 5 }) {
      if (!keyframes || keyframes.length === 0) return null;

      const total = keyframes.length;
      const startIdx = Math.max(0, currentIndex - radius);
      const endIdx = Math.min(total - 1, currentIndex + radius);

      const stripRef = React.useRef(null);

        const unsubscribe = window.__keyframeImagePool.subscribe(() => {
