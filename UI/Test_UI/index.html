    // =========================================================================
    // TRAKE VIDEO INSPECTOR & TIMELINE SCRUBBER MODAL
    // =========================================================================
    function TrakeVideoInspectorModal({
      videoResult,
      events,
      initialFrameIdx,
      initialKeyframeId,
      onClose,
      onNote,
      notedKeyframeIds,
      onAddToRanking,
      onAddToKisRanking,
      onAddToQaRanking,
      rankingKeyframeIds,
      kisKeyframeIds = new Set(),
      qaKeyframeIds = new Set(),
      showToast,
      enableStageActions = false,
      onOpenInCheckVideo,
      submitMode = 'S'
    }) {
      if (!videoResult) return null;

      const videoId = videoResult.video_id;
      const [keyframes, setKeyframes] = React.useState(window.__videoKeyframesCache[videoId] || []);
      const [loadingList, setLoadingList] = React.useState(!window.__videoKeyframesCache[videoId]);
      const [radius, setRadius] = React.useState(0);

      // Map of chosen event frames: { E1: frameObj, E2: frameObj, ... }
      const [assignedEvents, setAssignedEvents] = React.useState(() => {
        const initial = {};
        (videoResult.timeline || []).forEach((item) => {
          initial[item.event_id] = {
            event_id: item.event_id,
            keyframe_id: item.keyframe_id,
            frame_idx: item.frame_idx,
            timestamp: item.timestamp,
            pts_time: item.pts_time !== undefined ? item.pts_time : (item.timestamp / 1000.0),
            image_path: item.image_path,
            score: item.score,
            isAi: true,
          };
        });
        return initial;
      });
      const [stageVqaOpen, setStageVqaOpen] = React.useState({});
      const [stageVqaAnswers, setStageVqaAnswers] = React.useState({});
      const [stageVqaStatus, setStageVqaStatus] = React.useState({});

      // AI original picks for quick reference / reset
      const aiOriginalPicks = React.useMemo(() => {
        const orig = {};
        (videoResult.timeline || []).forEach((item) => {
          orig[item.event_id] = { ...item, isAi: true };
        });
        return orig;
      }, [videoResult]);

      const [currentIndex, setCurrentIndex] = React.useState(0);
      const [retryCount, setRetryCount] = React.useState(0);

      const [showAsr, setShowAsr] = React.useState(false);
      const [asrText, setAsrText] = React.useState('');
      const [asrLoading, setAsrLoading] = React.useState(false);
      const [mode, setMode] = React.useState('semantic');
      const [vqaAnswer, setVqaAnswer] = React.useState('');
      const [vqaSubmitStatus, setVqaSubmitStatus] = React.useState('idle');
      const [vqaSubmitResult, setVqaSubmitResult] = React.useState(null);

      const [submittingEventId, setSubmittingEventId] = React.useState(null);

      const BACKEND_BASE = `${window.location.protocol}//${window.location.hostname}:${window.location.port || '8888'}`;

      // Synchronously build immediate initial frame from available search/timeline context
      const fallbackInitialFrame = React.useMemo(() => {
        const tl = videoResult.timeline || [];
        let matched = null;
        if (initialKeyframeId) {
          matched = tl.find(k => k.keyframe_id === initialKeyframeId);
        }
        if (!matched && initialFrameIdx !== undefined && initialFrameIdx !== null && initialFrameIdx !== '') {
          matched = tl.find(k => String(k.frame_idx) === String(initialFrameIdx) || k.keyframe_id === initialFrameIdx);
        }
        if (!matched && tl.length > 0) {
          matched = tl[0];
        }
        const kfId = initialKeyframeId || matched?.keyframe_id || (initialFrameIdx !== undefined ? `${videoId}_kf_${String(initialFrameIdx).padStart(4, '0')}` : `${videoId}_kf_0001`);
        const fIdx = initialFrameIdx !== undefined && initialFrameIdx !== null ? Number(initialFrameIdx) : (matched?.frame_idx ?? 0);
        const imgPath = matched?.image_path || `${videoId}/${kfId}.jpg`;
        const rawUrl = getResolvedImageUrl(matched?.image_url || matched?.thumbnail_url || imgPath, videoId, kfId);
        const ts = matched?.timestamp ?? 0;
        const pts = matched?.pts_time ?? (ts ? ts / 1000 : 0);

        return {
          video_id: videoId,
          keyframe_id: kfId,
          frame_idx: fIdx,
          timestamp: ts,
          pts_time: pts,
          image_path: imgPath,
          image_url: rawUrl,
          thumbnail_url: rawUrl,
          score: matched?.score || 1.0,
        };
      }, [videoResult, initialKeyframeId, initialFrameIdx, videoId]);

      // Active keyframe currently viewed: priority #1 - immediately available via fallbackInitialFrame
      const activeKf = (keyframes.length > 0 && currentIndex >= 0 && currentIndex < keyframes.length)
        ? keyframes[currentIndex]
        : fallbackInitialFrame;

      const activeImageSrc = React.useMemo(() => {
        if (activeKf) {
          if (activeKf.image_url) {
            return getResolvedImageUrl(activeKf.image_url, videoId, activeKf.keyframe_id);
          }
          if (activeKf.thumbnail_url) {
            return getResolvedImageUrl(activeKf.thumbnail_url, videoId, activeKf.keyframe_id);
          }
          if (activeKf.image_path) {
            return getResolvedImageUrl(activeKf.image_path, videoId, activeKf.keyframe_id);
          }
          if (activeKf.keyframe_id) {
            return getResolvedImageUrl(`${videoId}/${activeKf.keyframe_id}.jpg`, videoId, activeKf.keyframe_id);
          }
        }
        return '';
      }, [activeKf, videoId]);

      const [imgState, setImgState] = React.useState('loading');
      const [curSrc, setCurSrc] = React.useState(() => activeImageSrc);

      // Helper to preload neighbor frames
      const preloadNeighbors = React.useCallback((list, activeIdx) => {
        if (!list || list.length === 0) return;
        const offsets = [-3, -2, -1, 1, 2, 3];
        offsets.forEach((offset) => {
          const targetIdx = activeIdx + offset;
          if (targetIdx >= 0 && targetIdx < list.length) {
            const kf = list[targetIdx];
            const rawUrl = kf.thumbnail_url || kf.image_url || '';
            const fullUrl = rawUrl.startsWith('http')
              ? rawUrl
              : rawUrl.startsWith('/')
                ? `${window.location.origin}${rawUrl}`
                : `${window.location.origin}/${rawUrl}`;
            const img = new Image();
            img.src = fullUrl;
          }
        });
      }, []);

      // Helper to accurately locate starting index in keyframes list
      const resolveStartIdx = React.useCallback((list) => {
        if (!list || list.length === 0) return 0;
        if (initialKeyframeId) {
          const idx = list.findIndex(k => k.keyframe_id === initialKeyframeId);
          if (idx >= 0) return idx;
        }
        if (initialFrameIdx !== undefined && initialFrameIdx !== null && initialFrameIdx !== '') {
          const idx = list.findIndex(k => String(k.frame_idx) === String(initialFrameIdx) || k.keyframe_id === initialFrameIdx);
          if (idx >= 0) return idx;
        }
        if (videoResult.timeline && videoResult.timeline.length > 0) {
          const targetKid = videoResult.timeline[0].keyframe_id;
          const targetFidx = videoResult.timeline[0].frame_idx;
          const idx = list.findIndex(k => (targetKid && k.keyframe_id === targetKid) || (targetFidx !== undefined && String(k.frame_idx) === String(targetFidx)));
          if (idx >= 0) return idx;
        }
        return 0;
      }, [initialKeyframeId, initialFrameIdx, videoResult]);

      // Load all keyframes for this video in background (timeline & neighbors) without blocking main frame
      React.useEffect(() => {
        let isMounted = true;
        if (window.__videoKeyframesCache[videoId]) {
          const list = window.__videoKeyframesCache[videoId];
          setKeyframes(list);
          setLoadingList(false);

          const startIdx = resolveStartIdx(list);
          setCurrentIndex(startIdx);
          preloadNeighbors(list, startIdx);
        } else {
          setLoadingList(true);
          fetch(`${BACKEND_BASE}/api/video/${videoId}/keyframes`)
            .then((res) => {
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return res.json();
            })
            .then((data) => {
              if (!isMounted) return;
              const list = data.keyframes || [];
              window.__videoKeyframesCache[videoId] = list;
              setKeyframes(list);
              setLoadingList(false);

              const startIdx = resolveStartIdx(list);
              setCurrentIndex(startIdx);
              preloadNeighbors(list, startIdx);
            })
            .catch((err) => {
              if (!isMounted) return;
              console.warn('Could not fetch video keyframes:', err);
              setLoadingList(false);
            });
        }
        return () => { isMounted = false; };
      }, [videoId, resolveStartIdx, preloadNeighbors, BACKEND_BASE]);

      React.useEffect(() => {
        setImgState('loading');
        setRetryCount(0);
        setCurSrc(activeImageSrc);
        if (keyframes.length > 0) {
          preloadNeighbors(keyframes, currentIndex);
        }
      }, [activeImageSrc, currentIndex, keyframes, preloadNeighbors]);

      // ASR Loader for active keyframe
      React.useEffect(() => {
        if (!showAsr || !activeKf) {
          setAsrText('');
          return;
        }

        if (activeKf.asr_6s || activeKf.asr_text || activeKf.full_text) {
          setAsrText(activeKf.asr_6s || activeKf.full_text || activeKf.asr_text);
          return;
        }

        setAsrLoading(true);
        setAsrText('');

        const params = new URLSearchParams({
          video_id: String(videoId),
          frame_idx: String(activeKf.frame_idx),
        });
        if (activeKf.keyframe_id) {
          params.append('keyframe_id', String(activeKf.keyframe_id));
        }

        fetch(`${BACKEND_BASE}/api/keyframe/asr?${params.toString()}`)
          .then((res) => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
          })
          .then((data) => {
            const txt = data.asr_6s || data.asr_text || data.full_text || 'Không có dữ liệu ASR cho frame này.';
            setAsrText(txt);
          })
          .catch(() => {
            setAsrText('Không tìm thấy dữ liệu ASR.');
          })
          .finally(() => {
            setAsrLoading(false);
          });
      }, [showAsr, activeKf, videoId, BACKEND_BASE]);

      const handleVqaSubmit = React.useCallback(async () => {
        if (!activeKf || !vqaAnswer.trim() || vqaSubmitStatus === 'submitting') return;
        setVqaSubmitStatus('submitting');
        setVqaSubmitResult(null);
        try {
          const res = await fetch(`${BACKEND_BASE}/api/dres/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              video_id: String(videoId),
              timestamp_ms: Number(activeKf.timestamp) || 0,
              timestamp: Number(activeKf.timestamp) || 0,
              answer: vqaAnswer.trim(),
              mode: 'vqa',
            }),
          });
          const data = await res.json();
          if (!res.ok || data.status === false) throw new Error(data.detail || data.description || 'Submission failed');
          setVqaSubmitStatus('success');
          setVqaSubmitResult({ status: true, description: data.description || 'Submitted' });
        } catch (err) {
          setVqaSubmitStatus('error');
          setVqaSubmitResult({ status: false, description: err.message });
        }
      }, [activeKf, BACKEND_BASE, videoId, vqaAnswer, vqaSubmitStatus]);

      // Navigation helpers
      const goPrev = React.useCallback(() => {
        if (currentIndex > 0) setCurrentIndex(prev => prev - 1);
      }, [currentIndex]);

      const goNext = React.useCallback(() => {
        if (currentIndex < keyframes.length - 1) setCurrentIndex(prev => prev + 1);
      }, [currentIndex, keyframes.length]);

      const goPrev5 = React.useCallback(() => {
        if (currentIndex > 0) setCurrentIndex(prev => Math.max(0, prev - 5));
      }, [currentIndex]);

      const goNext5 = React.useCallback(() => {
        if (currentIndex < keyframes.length - 1) setCurrentIndex(prev => Math.min(keyframes.length - 1, prev + 5));
      }, [currentIndex, keyframes.length]);

      // Assign current frame to an Event (E1, E2, E3...)
      const handleAssignCurrentToEvent = (eventId) => {
        if (!activeKf) return;
        setAssignedEvents(prev => ({
          ...prev,
          [eventId]: {
            event_id: eventId,
            keyframe_id: activeKf.keyframe_id,
            frame_idx: activeKf.frame_idx,
            timestamp: activeKf.timestamp,
            pts_time: activeKf.pts_time,
            image_path: activeKf.image_path,
            score: 1.0,
            isAi: false,
          }
        }));
        if (showToast) showToast(`Đã gán frame ${activeKf.keyframe_id} cho ${eventId}`, 'success');
      };

      // Reset event back to AI choice
      const handleResetEventToAi = (eventId) => {
        if (!aiOriginalPicks[eventId]) return;
        setAssignedEvents(prev => ({
          ...prev,
          [eventId]: { ...aiOriginalPicks[eventId], isAi: true }
        }));
        if (showToast) showToast(`Đã đặt lại ${eventId} về gợi ý AI`, 'info');
      };

      const getAssignedStageItem = (eventId) => {
        const item = assignedEvents[eventId] || aiOriginalPicks[eventId];
        if (!item) return null;
        const kf = keyframes.find(k => k.keyframe_id === item.keyframe_id || String(k.frame_idx) === String(item.frame_idx)) || item;
        const timestamp = Number(kf.timestamp ?? item.timestamp) || 0;
        return {
          id: kf.keyframe_id || item.keyframe_id || `${videoId}_${kf.frame_idx}`,
          keyframe_id: kf.keyframe_id || item.keyframe_id,
          videoId,
          videoTitle: videoId,
          frameId: kf.frame_idx ?? item.frame_idx,
          timestamp,
          pts_time: Number(kf.pts_time ?? item.pts_time ?? timestamp / 1000),
          thumbnailUrl: kf.image_url || kf.thumbnail_url || `http://${window.location.hostname}:${window.location.port || '8888'}/images/${kf.image_path || item.image_path}`,
          score: kf.score || item.score || 1,
          rank: 1,
          matchedSources: ['temporal', eventId],
          caption: `${eventId}: ${videoId} (F#${kf.frame_idx ?? item.frame_idx})`,
        };
      };

      const handleAddAssignedStageToKis = (eventId) => {
        const item = getAssignedStageItem(eventId);
        if (item && onAddToKisRanking) onAddToKisRanking(item, radius);
      };

      const handleAddAssignedStageToQa = (eventId) => {
        const item = getAssignedStageItem(eventId);
        const answer = (stageVqaAnswers[eventId] || '').trim();
        if (item && answer && onAddToQaRanking) onAddToQaRanking({ ...item, answer }, radius);
      };

      const handleSubmitAssignedStageVqa = async (eventId) => {
        const item = getAssignedStageItem(eventId);
        const answer = (stageVqaAnswers[eventId] || '').trim();
        if (!item || !answer || stageVqaStatus[eventId] === 'submitting') return;
        setStageVqaStatus(prev => ({ ...prev, [eventId]: 'submitting' }));
        try {
          const res = await fetch(`${BACKEND_BASE}/api/dres/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ video_id: videoId, timestamp: item.timestamp, timestamp_ms: item.timestamp, answer, mode: 'vqa' }),
          });
          const data = await res.json();
          if (!res.ok || data.status === false) throw new Error(data.detail || data.description || 'VQA submit failed');
          setStageVqaStatus(prev => ({ ...prev, [eventId]: 'success' }));
          if (showToast) showToast(`ÄÃ£ submit VQA cho ${eventId}`, 'success');
        } catch (err) {
          setStageVqaStatus(prev => ({ ...prev, [eventId]: 'error' }));
          if (showToast) showToast(err.message || 'VQA submit failed', 'error');
        }
      };

      // Jump scrubber to an event's chosen keyframe
      const handleJumpToEvent = (eventId) => {
        const item = assignedEvents[eventId] || aiOriginalPicks[eventId];
        if (!item || keyframes.length === 0) return;
        const idx = keyframes.findIndex(k =>
          (item.keyframe_id && k.keyframe_id === item.keyframe_id) ||
          (item.frame_idx !== undefined && String(k.frame_idx) === String(item.frame_idx))
        );
        if (idx >= 0) setCurrentIndex(idx);
      };

      // Chronological sequence validation: t1 < t2 < t3...
      const eventKeys = React.useMemo(() => {
        const keySet = new Set();
        // 1. From enabled events prop
        (events || []).forEach((ev, idx) => {
          const eid = ev.eventId || ev.event_id || (enableStageActions ? `Stage ${idx + 1}` : `E${idx + 1}`);
          if (eid) keySet.add(eid);
        });
        // 2. From videoResult timeline if any
        (videoResult?.timeline || []).forEach((item) => {
          if (item && item.event_id) keySet.add(item.event_id);
        });
        // 3. From current assignedEvents
        Object.keys(assignedEvents || {}).forEach((k) => {
          if (k) keySet.add(k);
        });

        return Array.from(keySet).sort((a, b) => {
          const na = parseInt(String(a).replace(/\D/g, '') || '0', 10);
          const nb = parseInt(String(b).replace(/\D/g, '') || '0', 10);
          if (na !== nb) return na - nb;
          return String(a).localeCompare(String(b));
        });
      }, [events, videoResult, assignedEvents, enableStageActions]);

      const orderValidation = React.useMemo(() => {
        const assignedKeys = eventKeys.filter(k => assignedEvents[k] && assignedEvents[k].timestamp !== undefined);
        if (assignedKeys.length <= 1) return { isValid: true, errorMsg: null };
        for (let i = 0; i < assignedKeys.length - 1; i++) {
          const e1 = assignedEvents[assignedKeys[i]];
          const e2 = assignedEvents[assignedKeys[i + 1]];
          if (e1 && e2 && e1.timestamp >= e2.timestamp) {
            return {
              isValid: false,
              errorMsg: `Thứ tự thời gian chưa tăng dần: ${assignedKeys[i + 1]} (${formatMilliseconds(e2.timestamp)}) đang xảy ra trước hoặc cùng lúc với ${assignedKeys[i]} (${formatMilliseconds(e1.timestamp)}). Hãy chọn lại frame phù hợp!`
            };
          }
        }
        return { isValid: true, errorMsg: null };
      }, [assignedEvents, eventKeys]);

      // Submit specific event frame to DRES
      const handleSubmitEventToDres = async (eventId) => {
        const item = assignedEvents[eventId];
        if (!item) return;

        setSubmittingEventId(eventId);
        const payload = {
          video_id: String(videoId),
          timestamp: parseInt(item.timestamp, 10) || 0,
          timestamp_ms: parseInt(item.timestamp, 10) || 0,
          start: parseInt(item.timestamp, 10) || 0,
          end: parseInt(item.timestamp, 10) || 0,
          mode: 'search',
        };

        try {
          const res = await fetch(`${BACKEND_BASE}/api/dres/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok || data.status === false) {
            if (showToast) showToast(`Nộp ${eventId} thất bại: ${data.detail || data.description || 'Lỗi'}`, 'error');
          } else {
            const subKey = `${videoId}_${item.frame_idx}_${item.timestamp}`;
            window.__dresSubmittedSet.add(subKey);
            if (showToast) showToast(`Đã nộp ${eventId} (${item.keyframe_id}) lên DRES thành công!`, 'success');
          }
        } catch (err) {
          if (showToast) showToast(`Lỗi nộp DRES: ${err.message}`, 'error');
        } finally {
          setSubmittingEventId(null);
        }
      };

      const [isBatchSubmitting, setIsBatchSubmitting] = React.useState(false);

      const handleCopySequence = () => {
        const lines = eventKeys.map(eid => {
          const ev = assignedEvents[eid];
          return `${eid}: ${videoId} | ${ev ? ev.keyframe_id : 'Chưa gán'} | Frame: ${ev ? ev.frame_idx : 'N/A'} | Timestamp: ${ev ? ev.timestamp + 'ms (' + formatMilliseconds(ev.timestamp) + ')' : 'N/A'}`;
        });
        const text = `[TRAKE Sequence for ${videoId}]\n` + lines.join('\n');
        navigator.clipboard.writeText(text).then(() => {
          if (showToast) showToast('Đã sao chép chuỗi mốc TRAKE vào clipboard', 'success');
        }).catch(() => {
          if (showToast) showToast('Không thể sao chép vào clipboard', 'error');
        });
      };

      const handleSubmitAllToDres = async () => {
        if (isBatchSubmitting) return;
        const validEids = eventKeys.filter(eid => assignedEvents[eid]);
        if (validEids.length === 0) {
          if (showToast) showToast('Chưa có mốc nào được gán frame để nộp!', 'info');
          return;
        }
        setIsBatchSubmitting(true);
        let successCount = 0;
        for (const eid of validEids) {
          const item = assignedEvents[eid];
          if (!item) continue;
          const payload = {
            video_id: String(videoId),
            timestamp: parseInt(item.timestamp, 10) || 0,
            timestamp_ms: parseInt(item.timestamp, 10) || 0,
            start: parseInt(item.timestamp, 10) || 0,
            end: parseInt(item.timestamp, 10) || 0,
            mode: 'search',
          };
          try {
            const res = await fetch(`${BACKEND_BASE}/api/dres/submit`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (res.ok && data.status !== false) {
              successCount++;
              const subKey = `${videoId}_${item.frame_idx}_${item.timestamp}`;
              window.__dresSubmittedSet.add(subKey);
            }
          } catch (e) {
            console.error('Batch submit error for', eid, e);
          }
        }
        setIsBatchSubmitting(false);
        if (showToast) showToast(`Đã nộp thành công ${successCount}/${validEids.length} mốc lên DRES!`, successCount > 0 ? 'success' : 'error');
      };

      const handleAddAllToRanking = () => {
        if (!onAddToRanking) return;
        const timeline = eventKeys
          .map(eid => {
            const item = assignedEvents[eid] || (aiOriginalPicks ? aiOriginalPicks[eid] : null);
            if (!item) return null;
            const kf = (keyframes || []).find(k => (k.keyframe_id === item.keyframe_id) || (k.frame_idx === item.frame_idx)) || item;
            return {
              event_id: eid,
              keyframe_id: kf ? (kf.keyframe_id || item.keyframe_id) : item.keyframe_id,
              frame_idx: kf && kf.frame_idx !== undefined ? kf.frame_idx : (item.frame_idx || 0),
              timestamp: kf && kf.timestamp !== undefined ? kf.timestamp : (item.timestamp || 0),
              image_path: item.image_path || `${videoId}/${kf ? (kf.keyframe_id || '') : ''}.jpg`,
              score: item.score || 1.0,
            };
          })
          .filter(Boolean);

        if (timeline.length === 0) {
          if (showToast) showToast('Chưa có mốc nào được gán frame để thêm vào ranking!', 'info');
          return;
        }

        const trakeVideoEntry = {
          video_id: videoId,
          global_score: videoResult.global_score || 1.0,
          timeline: timeline,
        };
        onAddToRanking(trakeVideoEntry);
        if (showToast) showToast(`Đã lưu toàn bộ chuỗi ${timeline.length} mốc của video ${videoId} vào TRAKE Ranking!`, 'success');
      };

      // Keyboard navigation
      React.useEffect(() => {
        const handleKeyDown = (e) => {
          const isInput = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
          if (isInput) {
            if (e.key === 'Escape') {
              e.preventDefault();
              onClose();
            }
            return;
          }
          if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && e.shiftKey) {
            e.preventDefault();
            goPrev5();
          } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && e.shiftKey) {
            e.preventDefault();
            goNext5();
          } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
            e.preventDefault();
            goPrev();
          } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
            e.preventDefault();
            goNext();
          } else if (e.key === 'Escape') {
            e.preventDefault();
            onClose();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [goPrev, goNext, goPrev5, goNext5, onClose]);

      const handleNoteCurrent = () => {
        if (!activeKf || !onNote) return;
        onNote({
          id: activeKf.keyframe_id,
          keyframe_id: activeKf.keyframe_id,
          videoId,
          videoTitle: videoId,
          frameId: activeKf.frame_idx,
          timestamp: activeKf.timestamp,
          pts_time: activeKf.pts_time,
          thumbnailUrl: activeKf.image_url || activeKf.thumbnail_url,
          score: 1.0,
          rank: 1,
          matchedSources: ['trake'],
          caption: `TRAKE ${videoId} - Frame ${activeKf.frame_idx}`,
        });
      };

      const handleAddToRankingCurrent = () => {
        handleAddAllToRanking();
      };

      const isCurrentNoted = activeKf && notedKeyframeIds && notedKeyframeIds.has(activeKf.keyframe_id);
      const isCurrentRanked = activeKf && rankingKeyframeIds && rankingKeyframeIds.has(activeKf.keyframe_id);

      return (
        <div
          id="trake-video-inspector-modal"
          className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-black/80 backdrop-blur-md animate-fade-in overflow-y-auto"
          onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
        >
          <div className="w-full max-w-6xl flex flex-col gap-2.5 my-auto max-h-[96vh]">



            {/* MAIN INSPECTOR CARD */}
            <div className="bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-700/30 flex flex-col flex-1 min-h-0">

              {/* Top Bar Header: TRAKE Inspector — [CheckVideo + Gán Stage] ĐẦU DÒNG → Video_ID/Frame/Copy_ID nhỏ 70% SAU */}
              <div className="bg-gradient-to-br from-slate-50 via-white to-slate-50 px-2.5 sm:px-3.5 py-2.5 border-b border-slate-200/90 shadow-xs">
                <div className="flex items-center gap-2 w-full flex-wrap justify-between">
                  {/* LEFT PRIORITY: Check Video + 4 Stage Gán/Đã Gán — trên đầu dòng */}
                  <div className="flex items-center gap-1.5 flex-wrap flex-1 min-w-0">
                    {/* 1. Check Video Button */}
                    <button
                      type="button"
                      onClick={() => {
                        if (onOpenInCheckVideo) {
                          onOpenInCheckVideo({
                            videoId,
                            frameId: activeKf ? activeKf.frame_idx : initialFrameIdx,
                            keyframe_id: activeKf ? activeKf.keyframe_id : initialKeyframeId,
                            timestamp: activeKf ? activeKf.timestamp : 0,
                            pts_time: activeKf ? activeKf.pts_time : 0,
                          });
                        }
                      }}
                      className="px-2.5 py-1.5 bg-white hover:bg-slate-50 text-slate-800 border border-slate-300/90 hover:border-sky-300 hover:text-sky-700 rounded-lg text-[11px] sm:text-xs font-black flex items-center justify-center gap-1 shadow-xs transition-all active:scale-95 cursor-pointer"
                      title="Chuyển sang tab Check Video để xem video tại frame này"
                    >
                      <Icon name="video" className="w-3.5 h-3.5 text-slate-700" />
                      <span>Check Video</span>
                    </button>

                    {/* 2. Stage Assignment Buttons — đầu dòng, giữ size nổi bật */}
                    <div className="flex items-center gap-1.25 flex-wrap">
                      {(eventKeys.length > 0 ? eventKeys : ['Stage 1', 'Stage 2', 'Stage 3', 'Stage 4']).map((eid) => {
                        const isAssignedToThisFrame = activeKf && assignedEvents[eid] && (
                          assignedEvents[eid].keyframe_id === activeKf.keyframe_id ||
                          String(assignedEvents[eid].frame_idx) === String(activeKf.frame_idx)
                        );
                        return (
                          <button
                            key={eid}
                            type="button"
                            onClick={() => handleAssignCurrentToEvent(eid)}
                            className={`px-2.5 py-1.5 rounded-lg text-[11px] sm:text-xs font-black flex items-center justify-center gap-1 transition-all active:scale-95 cursor-pointer shadow-xs border ${isAssignedToThisFrame
                                ? 'bg-gradient-to-br from-emerald-500 to-teal-600 text-white border-emerald-600/50 ring-2 ring-emerald-300/40 hover:from-emerald-600 hover:to-teal-700 shadow-[0_4px_14px_-6px_rgba(16,185,129,0.65)]'
                                : 'bg-gradient-to-br from-white to-slate-50 hover:from-emerald-50 hover:to-teal-50 text-slate-800 hover:text-emerald-700 border-slate-300/90 hover:border-emerald-300'
                              }`}
                            title={`Gán frame hiện tại (#${activeKf ? activeKf.frame_idx : ''}) cho ${eid}`}
                          >
                            <span className={`w-2.25 h-2.25 rounded-full ${isAssignedToThisFrame ? 'bg-white shadow-inner' : 'bg-emerald-500 ring-2 ring-emerald-200/60'}`}></span>
                            <span className="tracking-tight">{isAssignedToThisFrame ? `Đã gán ${eid}` : `Gán ${eid}`}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* RIGHT: Video_ID + Frame_ID + Copy_ID — SHRINK ~70% so với cũ */}
                  <div className="flex items-center gap-1.5 shrink-0">
                    {/* Video ID chip — thu nhỏ 70% */}
                    <div className="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-gradient-to-br from-indigo-50 via-white to-sky-50 border border-indigo-100 shadow-xs">
                      <svg className="w-3 h-3 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                      <div className="flex flex-col leading-tight gap-px">
                        <span className="text-[7px] font-bold uppercase tracking-[0.14em] text-indigo-500">VID</span>
                        <span className="text-[11px] font-black tabular-nums text-slate-800 tracking-wide" title={videoId}>{videoId || '—'}</span>
                      </div>
                    </div>

                    {/* Frame ID chip — thu nhỏ 70% */}
                    {activeKf && activeKf.frame_idx !== undefined && (
                      <div className="hidden sm:inline-flex items-center gap-1 px-1.5 py-1 rounded-md bg-slate-50 border border-slate-200 shadow-xs">
                        <span className="text-[7px] font-bold uppercase tracking-wider text-slate-500">FR</span>
                        <span className="text-[11px] font-black tabular-nums text-slate-800">#{activeKf.frame_idx}</span>
                      </div>
                    )}

                    {/* Copy ID Button — đồng bộ PILL format của Search (rounded-xl, icon custom) */}
                    <button
                      type="button"
                      onClick={() => {
                        const fIdx = activeKf ? activeKf.frame_idx : initialFrameIdx;
                        const textToCopy = fIdx !== undefined && fIdx !== null && fIdx !== ''
                          ? `${videoId}_${fIdx}`
                          : `${videoId}`;
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                          navigator.clipboard.writeText(textToCopy);
                        } else {
                          const ta = document.createElement('textarea');
                          ta.value = textToCopy;
                          document.body.appendChild(ta);
                          ta.select();
                          document.execCommand('copy');
                          document.body.removeChild(ta);
                        }
                        if (window.__showToast) {
                          window.__showToast(`Đã copy: ${textToCopy}`, 'success');
                        }
                      }}
                      className="px-2.5 py-1 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-xl text-[11px] font-bold flex items-center justify-center gap-1 shadow-xs transition-all active:scale-95 cursor-pointer hover:border-indigo-300 hover:text-indigo-700"
                      title={`Click để copy Video ID + Frame (${videoId}_${activeKf ? activeKf.frame_idx : (initialFrameIdx ?? '?')})`}
                    >
                      <svg className="w-3.5 h-3.5 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                      <span>Copy</span>
                    </button>
                  </div>
                </div>
              </div>

              {/* Scrollable Content Body */}
              <div className="overflow-y-auto p-2 sm:p-2.5 space-y-1.5">

                {/* Order Validation Banner */}
                {!orderValidation.isValid && (
                  <div className="bg-rose-50 border border-rose-300 text-rose-800 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2">
                    <Icon name="alert-triangle" className="w-4 h-4 text-rose-600 shrink-0" />
                    <span>{orderValidation.errorMsg}</span>
                  </div>
                )}

                {/* 1. Large HD Keyframe Preview - To chuẩn 16:9, nằm chính giữa */}

            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 7. CHECK VIDEO VIEW COMPONENT (Direct Video/Frame Lookup & Verification)
    // =========================================================================
    function CheckVideoView({
      onSelectResult,
      onNoteImage,
      notedKeyframeIds = new Set(),
      onAddToKisRanking,
      onAddToQaRanking,
      kisKeyframeIds = new Set(),
      qaKeyframeIds = new Set(),
      showToast,
      submitMode = 'S',
    }) {
      const _splitVidFrame = (s) => {
        const v = String(s || '').trim();
        if (!v) return { vid: '', fid: '' };
        const commaMatch = v.match(/^([^,]+?)[,\s]+([^,\s]+)$/);
        if (commaMatch) return { vid: commaMatch[1].trim(), fid: commaMatch[2].trim() };
        const lastUs = v.lastIndexOf('_');
        const lastDash = v.lastIndexOf('-');
        const lastSep = Math.max(lastUs, lastDash);
        if (lastSep > 0) {
          const left = v.slice(0, lastSep);
          const right = v.slice(lastSep + 1);
          if (/^\d+$/.test(right)) return { vid: left.trim(), fid: right.trim() };
        }
        return { vid: v, fid: '' };
      };

      // Saved input states (persisted across tab switches via window state)
      window.__checkVideoState = window.__checkVideoState || {
        videoId: 'L23_V018',
        frameId: '46',
      };

      const _initCombined = (() => {
        const s = window.__checkVideoState;
        if (s && s.videoId && s.frameId) return `${s.videoId}_${s.frameId}`;
        return '';
      })();

      const [combinedInput, setCombinedInput] = React.useState(_initCombined);
      const [inputErrors, setInputErrors] = React.useState({ combined: '' });

      const [isLoading, setIsLoading] = React.useState(false);
      const [error, setError] = React.useState(null);

      const [currentFrameData, setCurrentFrameData] = React.useState(null);
      const [keyframes, setKeyframes] = React.useState([]);
      const [currentIndex, setCurrentIndex] = React.useState(0);
      const [videoStreamFailed, setVideoStreamFailed] = React.useState(false);

      // Realtime high-precision video playback & frame calculation states
      const [videoCurrentTime, setVideoCurrentTime] = React.useState(0);
      const [isPlaying, setIsPlaying] = React.useState(false);
      const [videoFps, setVideoFps] = React.useState(25);
      const [customSecondsInput, setCustomSecondsInput] = React.useState('');
      const [copyFormat, setCopyFormat] = React.useState('comma'); // 'comma' (<vid>,<fid>) | 'space' (<vid> <fid>)
      const [copiedAction, setCopiedAction] = React.useState(null); // 'both' | 'frame' | 'app' | 'kis' | 'qa' | 'qa_copy'

      // VQA State
      const [vqaAnswer, setVqaAnswer] = React.useState('');
      const [isSubmittingVqa, setIsSubmittingVqa] = React.useState(false);

      const [isSubmittingDres, setIsSubmittingDres] = React.useState(false);

      const videoRef = React.useRef(null);
      const animFrameRef = React.useRef(null);
      const BACKEND_BASE = `${window.location.protocol}//${window.location.hostname}:${window.location.port || '8888'}`;

      // Keep window.__checkVideoState updated
      React.useEffect(() => {
        const { vid, fid } = _splitVidFrame(combinedInput);
        window.__checkVideoState.videoId = vid;
        window.__checkVideoState.frameId = fid;
      }, [combinedInput]);

      // Auto-lookup when opened from other search tabs or on initial mount
      React.useEffect(() => {
        if (window.__checkVideoState && window.__checkVideoState.videoId) {
          const vid = window.__checkVideoState.videoId;
          const fid = window.__checkVideoState.frameId || '';
          setCombinedInput(vid && fid ? `${vid}_${fid}` : (vid || ''));
          handleLookup(vid, fid);
        }
      }, [window.__checkVideoState?.autoLookupTimestamp]);

      // Continuous high-precision real-time time tracking via requestAnimationFrame
      React.useEffect(() => {
        let isCancelled = false;

        const syncLoop = () => {
          if (!isCancelled && videoRef.current) {
            const cur = videoRef.current.currentTime || 0;
            setVideoCurrentTime(cur);
            setIsPlaying(!videoRef.current.paused && !videoRef.current.ended);
          }
          animFrameRef.current = requestAnimationFrame(syncLoop);
        };

        animFrameRef.current = requestAnimationFrame(syncLoop);

        return () => {
          isCancelled = true;
          if (animFrameRef.current) {
            cancelAnimationFrame(animFrameRef.current);
          }
        };
      }, [currentFrameData]);

      // Seek video when currentFrameData or pts_time changes
      React.useEffect(() => {
        if (currentFrameData && videoRef.current) {
          const targetPts = currentFrameData.pts_time !== undefined ? currentFrameData.pts_time : (currentFrameData.timestamp / 1000.0);
          setVideoCurrentTime(targetPts);
          setCustomSecondsInput(String(Number(targetPts.toFixed(3))));
          try {
            videoRef.current.currentTime = targetPts;
            videoRef.current.play().catch(() => { });
          } catch (e) {
            console.warn('Video seek error:', e);
          }
        }
      }, [currentFrameData]);

      // Auto-seek on loadedmetadata
      const handleVideoLoadedMetadata = () => {
        if (videoRef.current && currentFrameData) {
          const targetPts = currentFrameData.pts_time !== undefined ? currentFrameData.pts_time : (currentFrameData.timestamp / 1000.0);
          videoRef.current.currentTime = targetPts;
          setVideoCurrentTime(targetPts);
          setCustomSecondsInput(String(Number(targetPts.toFixed(3))));
          videoRef.current.play().catch(() => { });
        }
      };

      // Frame-accurate stepping by delta frames
      const handleStepFrame = (frameDelta) => {
        if (videoRef.current) {
          if (!videoRef.current.paused) {
            videoRef.current.pause();
          }
          const curTime = videoRef.current.currentTime || 0;
          const curFrame = Math.round(curTime * videoFps);
          const nextFrame = Math.max(0, curFrame + frameDelta);
          const nextTime = nextFrame / videoFps;
          videoRef.current.currentTime = nextTime;
          setVideoCurrentTime(nextTime);
          setCustomSecondsInput(String(Number(nextTime.toFixed(3))));
        }
      };

      const handleSeekRelativeSeconds = (seconds) => {
        if (videoRef.current) {
          const newTime = Math.max(0, videoRef.current.currentTime + seconds);
          videoRef.current.currentTime = newTime;
          setVideoCurrentTime(newTime);
          setCustomSecondsInput(String(Number(newTime.toFixed(3))));
        }
      };

      const handleResetToTargetFrame = () => {
        if (videoRef.current && currentFrameData) {
          const targetPts = currentFrameData.pts_time !== undefined ? currentFrameData.pts_time : (currentFrameData.timestamp / 1000.0);
          videoRef.current.currentTime = targetPts;
          setVideoCurrentTime(targetPts);
          setCustomSecondsInput(String(Number(targetPts.toFixed(3))));
          videoRef.current.play().catch(() => { });
        }
      };

      const handleJumpToCustomSeconds = (e) => {
        if (e) e.preventDefault();
        const sec = parseFloat(customSecondsInput);
        if (isNaN(sec) || sec < 0) {
          if (showToast) showToast('Vui lòng nhập số giây hợp lệ (VD: 14.5 hoặc 46.24)', 'warning');
          return;
        }
        if (videoRef.current) {
          videoRef.current.currentTime = sec;
          setVideoCurrentTime(sec);
          if (showToast) showToast(`Đã tua đến ${sec.toFixed(3)}s · Frame #${Math.round(sec * videoFps)}`, 'info');
        }
      };

      const handleLookup = async (vidParam, frameParam) => {
        let vid, fid;
        if (vidParam !== undefined && frameParam !== undefined) {
          vid = String(vidParam).trim();
          fid = String(frameParam).trim();
        } else {
          const split = _splitVidFrame(combinedInput);
          vid = split.vid;
          fid = split.fid;
        }

        const errors = { combined: '' };
        if (!vid) errors.combined = 'Vui lòng nhập format: L26_V004_0 (hoặc L26_V004,0)';
        else if (!fid) errors.combined = 'Thiếu Frame ID, format đúng: L26_V004_0';

        setInputErrors(errors);
        if (errors.combined) return;

        setIsLoading(true);
        setError(null);
        setVideoStreamFailed(false);

        try {
          const params = new URLSearchParams({
            video_id: vid,
            frame_idx: fid,
          });

          const res = await fetch(`${BACKEND_BASE}/api/v1/frame/timestamp?${params}`);
          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.detail || 'Không tìm thấy video hoặc frame này trong dataset');
          }

          setCurrentFrameData(data);
          if (data.fps && data.fps > 0) setVideoFps(data.fps);
          const pts = data.pts_time !== undefined ? data.pts_time : (data.timestamp / 1000.0);
          setVideoCurrentTime(pts);
          setCustomSecondsInput(String(Number(pts.toFixed(3))));

          // Load keyframes for timeline context strip
          try {
            const kfRes = await fetch(`${BACKEND_BASE}/api/video/${data.video_id}/keyframes`);
            if (kfRes.ok) {
              const kfData = await kfRes.json();
              const list = kfData.keyframes || [];
              setKeyframes(list);
              window.__videoKeyframesCache = window.__videoKeyframesCache || {};
              window.__videoKeyframesCache[data.video_id] = list;

              // Find current index
              const targetKid = data.keyframe_id || '';
              const targetIdx = Number(data.frame_idx);
              let foundIdx = list.findIndex(k => k.keyframe_id === targetKid);
              if (foundIdx === -1 && !isNaN(targetIdx)) {
                foundIdx = list.findIndex(k => k.frame_idx === targetIdx);
              }
              setCurrentIndex(foundIdx >= 0 ? foundIdx : 0);
            }
          } catch (e) {
            console.warn('Could not load keyframes for strip:', e);
          }

        } catch (err) {
          setError(err.message || 'Đã xảy ra lỗi khi kiểm tra video');
          setCurrentFrameData(null);
        } finally {
          setIsLoading(false);
        }
      };

      const handleFormSubmit = (e) => {
        if (e) e.preventDefault();
        handleLookup();
      };

      const handleLoadPreset = (vid, fid) => {
        setCombinedInput(`${vid}_${fid}`);
        handleLookup(vid, fid);
      };

      const handleSelectStripIndex = (newIdx) => {
        if (!keyframes || !keyframes[newIdx]) return;
        const kf = keyframes[newIdx];
        setCurrentIndex(newIdx);
        const curSplit = _splitVidFrame(combinedInput);
        const vidKeep = curSplit.vid || (window.__checkVideoState && window.__checkVideoState.videoId) || kf.video_id || '';
        setCombinedInput(`${vidKeep}_${kf.frame_idx}`);
        const pts = kf.pts_time !== undefined ? kf.pts_time : (kf.timestamp / 1000.0);
        setVideoCurrentTime(pts);
        setCustomSecondsInput(String(Number(pts.toFixed(3))));
        setCurrentFrameData(prev => ({
          ...prev,
          keyframe_id: kf.keyframe_id,
          frame_idx: kf.frame_idx,
          timestamp: kf.timestamp,
          pts_time: pts,
          image_url: kf.image_url,
          image_path: kf.image_path,
        }));
        if (videoRef.current) {
          videoRef.current.currentTime = pts;
        }
      };

      // Step to previous / next keyframe in dataset strip
      const handleStepKeyframe = (delta) => {
        if (!keyframes || keyframes.length === 0) return;
        const nextIdx = Math.max(0, Math.min(keyframes.length - 1, currentIndex + delta));
        if (nextIdx !== currentIndex) {
          handleSelectStripIndex(nextIdx);
        }
      };

      // Toggle Play / Pause video
      const handleTogglePlay = () => {
        if (!videoRef.current) return;
        if (videoRef.current.paused) {
          videoRef.current.play().catch(() => { });
        } else {
          videoRef.current.pause();
        }
      };

      // Global keyboard shortcuts for Check Video & Frame Navigation
      React.useEffect(() => {
        const handleKeyDown = (e) => {
          const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
          if (tag === 'input' || tag === 'textarea' || (document.activeElement && document.activeElement.isContentEditable)) {
            return;
          }

          if (e.key === ' ' || e.code === 'Space') {
            e.preventDefault();
            handleTogglePlay();
          } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
            e.preventDefault();
            if (e.shiftKey) {
              handleStepFrame(-5);
            } else if (e.ctrlKey || e.metaKey) {
              handleSeekRelativeSeconds(-5);
            } else {
              handleStepFrame(-1);
            }
          } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
            e.preventDefault();
            if (e.shiftKey) {
              handleStepFrame(5);
            } else if (e.ctrlKey || e.metaKey) {
              handleSeekRelativeSeconds(5);
            } else {
              handleStepFrame(1);
            }
          } else if (e.key === '[' || e.key === '{') {
            e.preventDefault();
            handleStepKeyframe(-1);
          } else if (e.key === ']' || e.key === '}') {
            e.preventDefault();
            handleStepKeyframe(1);
          } else if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            handleResetToTargetFrame();
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentIndex, keyframes, currentFrameData, videoFps, handleSelectStripIndex]);

      // Realtime millisecond-accurate frame calculation from exact videoCurrentTime
      const calculatedFrameIdx = Math.max(0, Math.round(videoCurrentTime * videoFps));
      const calculatedTimestampMs = Math.round(videoCurrentTime * 1000);
      const calculatedPts = Number(videoCurrentTime.toFixed(3));

      // Closest keyframe matching in dataset keyframes list
      const closestKeyframe = React.useMemo(() => {
        if (!keyframes || keyframes.length === 0) return null;
        let best = keyframes[0];
        let minDiff = Infinity;
        for (const kf of keyframes) {
          const kfPts = kf.pts_time !== undefined ? kf.pts_time : (kf.timestamp / 1000.0);
          const diff = Math.abs(kfPts - videoCurrentTime);
          if (diff < minDiff) {
            minDiff = diff;
            best = kf;
          }
        }
        return best;
      }, [keyframes, videoCurrentTime]);

      const calculatedKeyframeId = closestKeyframe && Math.abs((closestKeyframe.pts_time !== undefined ? closestKeyframe.pts_time : closestKeyframe.timestamp / 1000.0) - videoCurrentTime) < 0.1
        ? closestKeyframe.keyframe_id
        : `${(currentFrameData && currentFrameData.video_id) || _splitVidFrame(combinedInput).vid || 'video'}_kf_${String(calculatedFrameIdx).padStart(4, '0')}`;

      // Universal clipboard copy helper (supports modern clipboard API + fallback)
      const copyToSystemClipboard = async (text, successMsg) => {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
          }
          if (showToast) showToast(successMsg || `Đã sao chép: ${text}`, 'success');
          return true;
        } catch (err) {
          console.error('Clipboard copy error:', err);
          if (showToast) showToast('Lỗi khi sao chép vào bộ nhớ tạm!', 'error');
          return false;
        }
      };

      // Copy Video ID & Frame ID directly to user's computer clipboard
      const handleCopyVideoAndFrame = async () => {
        if (!currentFrameData) return;
        const vid = currentFrameData.video_id;
        const fid = calculatedFrameIdx;
        const textToCopy = copyFormat === 'space' ? `${vid} ${fid}` : `${vid},${fid}`;
        const ok = await copyToSystemClipboard(textToCopy, `Đã copy vào Clipboard máy: ${textToCopy}`);
        if (ok) {
          setCopiedAction('both');
          setTimeout(() => setCopiedAction(null), 2000);
        }
      };

      // Copy only Frame ID to user's computer clipboard
      const handleCopyFrameIdOnly = async () => {
        const fid = String(calculatedFrameIdx);
        const ok = await copyToSystemClipboard(fid, `Đã copy Frame ID: ${fid}`);
        if (ok) {
          setCopiedAction('frame');
          setTimeout(() => setCopiedAction(null), 2000);
        }
      };

      // Add calculated frame to App's in-memory shared Clipboard (Note)
      const handleAddFrameToAppClipboard = () => {
        if (!currentFrameData) return;
        const vid = currentFrameData.video_id;
        const fid = calculatedFrameIdx;
        const kid = calculatedKeyframeId;
        const thumbUrl = closestKeyframe && closestKeyframe.image_url
          ? `${BACKEND_BASE}${closestKeyframe.image_url}`
          : `${BACKEND_BASE}${currentFrameData.image_url}`;

        if (onNoteImage) {
          onNoteImage({
            id: kid,
            keyframe_id: kid,
            videoId: vid,
            videoTitle: vid,
            frameId: fid,
            timestamp: calculatedTimestampMs,
            pts_time: calculatedPts,
            thumbnailUrl: thumbUrl,
            answer: vqaAnswer ? vqaAnswer.trim() : undefined,
          });
          setCopiedAction('app');
          setTimeout(() => setCopiedAction(null), 2000);
          if (showToast) showToast(`Đã thêm Frame #${fid} (${calculatedPts}s) vào Clipboard của App`, 'success');
        }
      };

      // Add calculated frame to KIS Ranking
      const handleAddFrameToKis = () => {
        if (!currentFrameData) return;
        const vid = currentFrameData.video_id;
        const fid = calculatedFrameIdx;
        const kid = calculatedKeyframeId;
        const thumbUrl = closestKeyframe && closestKeyframe.image_url
          ? `${BACKEND_BASE}${closestKeyframe.image_url}`
          : `${BACKEND_BASE}${currentFrameData.image_url}`;

        if (onAddToKisRanking) {
          onAddToKisRanking({
            id: kid,
            keyframe_id: kid,
            videoId: vid,
            videoTitle: vid,
            frameId: fid,
            timestamp: calculatedTimestampMs,
            pts_time: calculatedPts,
            thumbnailUrl: thumbUrl,
            score: 1.0,
          });
          setCopiedAction('kis');
          setTimeout(() => setCopiedAction(null), 2000);
          if (showToast) showToast(`Đã thêm Frame #${fid} vào KIS Ranking`, 'success');
        }
      };

      // Add calculated frame to QA Ranking with VQA Answer
      const handleAddFrameToQa = () => {
        if (!currentFrameData) return;
        const vid = currentFrameData.video_id;
        const fid = calculatedFrameIdx;
        const kid = calculatedKeyframeId;
        const thumbUrl = closestKeyframe && closestKeyframe.image_url
          ? `${BACKEND_BASE}${closestKeyframe.image_url}`
          : `${BACKEND_BASE}${currentFrameData.image_url}`;

        if (onAddToQaRanking) {
          onAddToQaRanking({
            id: kid,
            keyframe_id: kid,
            videoId: vid,
            videoTitle: vid,
            frameId: fid,
            timestamp: calculatedTimestampMs,
            pts_time: calculatedPts,
            thumbnailUrl: thumbUrl,
            score: 1.0,
            answer: vqaAnswer ? vqaAnswer.trim() : undefined,
          });
          setCopiedAction('qa');
          setTimeout(() => setCopiedAction(null), 2000);
          if (showToast) showToast(`Đã thêm Frame #${fid} vào QA Ranking${vqaAnswer ? ` (Đáp án: ${vqaAnswer.trim()})` : ''}`, 'success');
        }
      };

      // Copy QA Submission Syntax: <video_id>,<frame_idx>,"<answer>"
      const handleCopyQaSyntax = async () => {
        if (!currentFrameData) return;
        const vid = currentFrameData.video_id;
        const fid = calculatedFrameIdx;
        const ans = vqaAnswer.trim() || 'answer';
        const text = `${vid},${fid},"${ans}"`;
        const ok = await copyToSystemClipboard(text, `Đã copy cú pháp QA: ${text}`);
        if (ok) {
          setCopiedAction('qa_copy');
          setTimeout(() => setCopiedAction(null), 2000);
        }
      };

      // Submit direct VQA to DRES Server
      const handleSubmitVqaDres = async () => {
        if (!currentFrameData) return;
        if (!vqaAnswer.trim()) {
          if (showToast) showToast('Vui lòng nhập câu trả lời VQA trước khi nộp', 'warning');
          return;
        }
        setIsSubmittingVqa(true);
        try {
          const payload = {
            video_id: String(currentFrameData.video_id),
            timestamp_ms: calculatedTimestampMs,
            timestamp: calculatedTimestampMs,
            answer: vqaAnswer.trim(),
            mode: 'vqa',
          };
          const res = await fetch(`${BACKEND_BASE}/api/dres/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok || data.status === false) {
            if (showToast) showToast(`Nộp VQA thất bại: ${data.detail || data.description || 'Lỗi'}`, 'error');
          } else {
            const subKey = `${currentFrameData.video_id}_${calculatedFrameIdx}_${calculatedTimestampMs}_vqa`;
            window.__dresSubmittedSet = window.__dresSubmittedSet || new Set();
            window.__dresSubmittedSet.add(subKey);
            if (showToast) showToast(`Đã nộp VQA: "${vqaAnswer.trim()}" tại Frame #${calculatedFrameIdx} (${calculatedTimestampMs}ms) thành công!`, 'success');
          }
        } catch (err) {
          if (showToast) showToast(`Lỗi nộp VQA DRES: ${err.message}`, 'error');
        } finally {
          setIsSubmittingVqa(false);
        }
      };

      // Submit direct KIS / Search timestamp to DRES
      const handleSubmitDres = async () => {
        if (!currentFrameData) return;
        setIsSubmittingDres(true);
        try {
          const payload = {
            video_id: currentFrameData.video_id,
            timestamp: calculatedTimestampMs,
            timestamp_ms: calculatedTimestampMs,
            start: calculatedTimestampMs,
            end: calculatedTimestampMs,
            mode: 'search',
          };
          const res = await fetch(`${BACKEND_BASE}/api/dres/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok || data.status === false) {
            if (showToast) showToast(`Nộp DRES thất bại: ${data.detail || data.description || 'Lỗi'}`, 'error');
          } else {
            const subKey = `${currentFrameData.video_id}_${calculatedFrameIdx}_${calculatedTimestampMs}`;
            window.__dresSubmittedSet = window.__dresSubmittedSet || new Set();
            window.__dresSubmittedSet.add(subKey);
            if (showToast) showToast(`Đã nộp ${currentFrameData.video_id} Frame #${calculatedFrameIdx} (${calculatedTimestampMs}ms) lên DRES thành công!`, 'success');
          }
        } catch (err) {
          if (showToast) showToast(`Lỗi nộp DRES: ${err.message}`, 'error');
        } finally {
          setIsSubmittingDres(false);
        }
      };

      const currentKeyframeId = currentFrameData ? currentFrameData.keyframe_id : '';
      const isNoted = (currentKeyframeId && notedKeyframeIds.has(currentKeyframeId)) || notedKeyframeIds.has(calculatedKeyframeId);
      const isKisRanked = (currentKeyframeId && kisKeyframeIds.has(currentKeyframeId)) || kisKeyframeIds.has(calculatedKeyframeId);
      const isQaRanked = (currentKeyframeId && qaKeyframeIds.has(currentKeyframeId)) || qaKeyframeIds.has(calculatedKeyframeId);

      const dresSubKey = currentFrameData ? `${currentFrameData.video_id}_${calculatedFrameIdx}_${calculatedTimestampMs}` : '';
      const isAlreadySubmittedDres = window.__dresSubmittedSet && dresSubKey && (
        window.__dresSubmittedSet.has(dresSubKey) ||
        window.__dresSubmittedSet.has(`${currentFrameData.video_id}_${calculatedFrameIdx}`) ||
        (closestKeyframe && (
          window.__dresSubmittedSet.has(`${currentFrameData.video_id}_${closestKeyframe.frame_idx}_${closestKeyframe.timestamp}`) ||
          window.__dresSubmittedSet.has(`${currentFrameData.video_id}_${closestKeyframe.frame_idx}`)
        ))
      );

      const vqaSubKey = currentFrameData ? `${currentFrameData.video_id}_${calculatedFrameIdx}_${calculatedTimestampMs}_vqa` : '';
      const isAlreadySubmittedVqa = window.__dresSubmittedSet && vqaSubKey && (
        window.__dresSubmittedSet.has(vqaSubKey) ||
        window.__dresSubmittedSet.has(`${currentFrameData.video_id}_${calculatedFrameIdx}_vqa`)
      );

      return (
        <div className="flex-1 flex flex-col min-w-0 bg-slate-100 overflow-y-auto">
          {/* Top Form Header Area - Clean & Minimal (Non-sticky) */}
          <div className="bg-white border-b border-slate-200 px-6 py-4 shadow-xs">
            <div className="max-w-4xl mx-auto">

              const handleSearch = async () => {
                setIsSearching(true);
                setSearchError(null);
                const searchStart = performance.now();

                const activePanels = panels.filter((p) => {
                  if (!p.enabled) return false;
                  if (p.type === 'image') {
                    return Boolean((p.query || '').trim() || ((p.videoId || '').trim() && (p.frameId || '').trim()));
                  }
                  return Boolean((p.query || '').trim());

                      text: rawVal,

                    };
                  }
                  return {
                    type: p.type || 'text',
                    text: (p.query || '').trim(),

                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                  });

                  let data;
                  try { data = await res.json(); } catch { throw new Error(`Server (${currentBackendUrl}) trả về HTTP ${res.status} nhưng phản hồi không phải JSON.`); }
                  if (!res.ok) throw new Error(data?.detail || `HTTP ${res.status}: ${res.statusText || 'request failed'}`);

                      queryTime={queryTime}
                      isSearching={isSearching || isTrakeSearching || isTemporalSearching}
                      viewMode={viewMode}
                      onChangeViewMode={setViewMode}
                      clipboardCount={totalClipboardCount}
                      submitMode={submitMode}
                      onChangeSubmitMode={setSubmitMode}
                    />
                    <div className="flex flex-1 overflow-hidden">
                      {viewMode === 'search' && (
                        <>
                          <Sidebar panels={panels} onUpdatePanel={handleUpdatePanel} onAddPanel={handleAddPanel}
                            onRemovePanel={handleRemovePanel} onSearch={handleSearch} isSearching={isSearching} />
                          <main className="flex-1 flex flex-col min-w-0 bg-slate-100 overflow-y-auto">
                            <ResultGrid
                              results={results}
                              onSelectResult={(item) => {
                                setSelectedResult(item);
                                setSelectedResultInitialShowVideo(false);
                              }}
                              isSearching={isSearching}
                              searchError={searchError}
                              onClearError={() => setSearchError(null)}
                              backendUrl={currentBackendUrl}
                              onAddToRanking={handleAddToKisRanking}
                              rankingKeyframeIds={kisKeyframeIds}
                              selectedKeyframeId={selectedResult ? (selectedResult.keyframe_id || selectedResult.id) : null}
                              onOpenInCheckVideo={(item) => {
                                setSelectedResult(item);
                                setSelectedResultInitialShowVideo(true);
                              }}
                            />
                          </main>
                        </>
                      )}
                      {viewMode === 'temporal' && (
                        <>
                          <TemporalSidebar
                            stages={temporalStages}
                            globalContext={temporalContext}
                            contextBonusWeight={temporalBonusWeight}
                            onUpdateStage={handleUpdateTemporalStage}
                            onAddStage={handleAddTemporalStage}
                            onRemoveStage={handleRemoveTemporalStage}
                            onChangeContext={setTemporalContext}
                            onChangeBonusWeight={setTemporalBonusWeight}
                            onSearch={handleTemporalSearch}
                            isSearching={isTemporalSearching}
                            onReset={handleResetTemporal}
                            onLoadMockDemo={handleLoadMockTemporalDemo}
                            filterSource={temporalFilterSource}
                            onChangeFilterSource={setTemporalFilterSource}
                            rankingCount={(clipboard.kisRanking || []).length}
                            noteCount={(clipboard.savedImages || []).length}
                          />
                          <main className="flex-1 flex flex-col min-w-0 bg-slate-50 overflow-y-auto">
                            <TemporalResultGrid
                              key={`temporal-grid-${temporalSearchSeq}`}
                              results={temporalResults}
                              totalStages={temporalStages.length}
                              isSearching={isTemporalSearching}
                              error={temporalError}
                              onClearError={() => setTemporalError(null)}
                              onSelectFrame={handleSelectTemporalFrame}
                              onSelectVideo={handleSelectTemporalVideo}
                              onLoadMockDemo={handleLoadMockTemporalDemo}
                              rankingKeyframeIds={rankingKeyframeIds}
                              notedKeyframeIds={notedKeyframeIds}
                              trakeVideoIds={trakeVideoIds}
                              trakeSequenceKeys={trakeSequenceKeys}
                              onAddToRanking={handleAddToTrakeRanking}
                              onNoteImage={handleNoteImage}
                              showToast={showToast}
                            />
                          </main>
                        </>
                      )}
                      {viewMode === 'trake' && (
                        <>
                          <TrakeSidebar
                            context={trakeContext}
                            events={trakeEvents}
                            onChangeContext={setTrakeContext}
                            onUpdateEvent={handleUpdateTrakeEvent}
                            onAddEvent={handleAddTrakeEvent}
                            onRemoveEvent={handleRemoveTrakeEvent}
                            onReset={handleResetTrake}
                            onSearch={handleTrakeSearch}
                            isSearching={isTrakeSearching}
                            rankingCount={(clipboard.trakeRanking || []).length}
                            noteCount={(clipboard.savedImages || []).length}
                            trakeFilterSource={trakeFilterSource}
                            onChangeFilterSource={setTrakeFilterSource}
                          />
                          <main className="flex-1 flex flex-col min-w-0 bg-slate-50 overflow-y-auto">
                            <TrakeResultGrid
                              results={trakeResults}
                              isSearching={isTrakeSearching}
                              error={trakeError}
                              onClearError={() => setTrakeError(null)}
                              onSelectVideo={(vidRes, frameIdx, keyframeId) => {
                                setSelectedTrakeIsTemporal(false);
                                setSelectedTrakeVideo(vidRes);
                                setTrakeInitialFrameIdx(frameIdx);
                                setTrakeInitialKeyframeId(keyframeId);
                              }}
                              rankingKeyframeIds={rankingKeyframeIds}
                              notedKeyframeIds={notedKeyframeIds}
                              trakeVideoIds={trakeVideoIds}
                              trakeSequenceKeys={trakeSequenceKeys}
                              onAddToRanking={handleAddToTrakeRanking}
                              onNoteImage={handleNoteImage}
                              showToast={showToast}
                            />
                          </main>
                        </>
                      )}
                      {viewMode === 'clipboard' && (
                        <ClipboardPanel
                          clipboard={clipboard}
                          onRestoreQuery={handleRestoreQuery}
                          onSelectImage={handleSelectClipboardImage}
                          onRemoveImage={handleRemoveSavedImage}
                          onClearAll={handleClearClipboard}
                          onClearKis={handleClearKis}
                          onClearQa={handleClearQa}
                          onClearTrake={handleClearTrake}
                          onSelectRankingItem={(item) => {
                            setSelectedResult({
                              id: item.keyframe_id || item.id,
                              keyframe_id: item.keyframe_id || item.id,
                              rank: item.rank,
                              videoId: item.videoId,
                              videoTitle: item.videoTitle || item.videoId,
                              frameId: item.frameId,
                              frame_idx: item.frameId !== undefined ? item.frameId : item.frame_idx,
                              timestamp: item.timestamp,
                              pts_time: item.pts_time,
                              score: item.score,
                              matchedSources: item.matchedSources || [],
                              caption: item.caption || item.keyframe_id,
                              thumbnailUrl: item.thumbnailUrl,
                            });
                            setSelectedResultInitialShowVideo(false);
                          }}
                          onMoveKisUp={handleMoveKisUp}
                          onMoveKisDown={handleMoveKisDown}
                          onRemoveKisItem={handleRemoveKisItem}
                          onJumpKisRank={handleJumpKisRank}
                          onAutoFillKisTop100={handleAutoFillKisTop100}
                          searchResultsCount={results ? results.length : 0}
                          onMoveQaUp={handleMoveQaUp}
                          onMoveQaDown={handleMoveQaDown}
                          onRemoveQaItem={handleRemoveQaItem}
                          onJumpQaRank={handleJumpQaRank}
                          onAutoFillQaTop100={handleAutoFillQaTop100}
                          onUpdateQaAnswer={handleUpdateQaAnswer}
                          onMoveTrakeUp={handleMoveTrakeUp}
                          onMoveTrakeDown={handleMoveTrakeDown}
                          onRemoveTrakeItem={handleRemoveTrakeItem}
                          onJumpTrakeRank={handleJumpTrakeRank}
                          onAutoFillTrakeTop100={handleAutoFillTrakeTop100}
                          trakeResultsCount={(trakeResults && trakeResults.length) || (temporalResults && temporalResults.length) || 0}
                          onSetNoteText={handleSetNoteText}
                          onSwitchToTrakeWithRanking={() => {
                            setTrakeFilterSource('ranking');
                            setViewMode('trake');
                            showToast('Đã chuyển sang TRAKE và kích hoạt lọc theo video từ Ranking', 'info');
                          }}
                          onOpenTrakeForVideo={(item) => {
                            setSelectedTrakeIsTemporal(false);
                            setViewMode('trake');
                            setSelectedTrakeVideo({
                              video_id: item.videoId,
                              global_score: 1.0,
                              timeline: [
                                {
                                  event_id: 'E1',
                                  keyframe_id: item.keyframe_id || item.id,
                                  frame_idx: item.frameId !== undefined ? Number(item.frameId) : 0,
                                  timestamp: item.timestamp || 0,
                                  image_path: `${item.videoId}/${item.keyframe_id || item.id}.jpg`,
                                  score: 1.0,
                                }
                              ]
                            });
                            setTrakeInitialFrameIdx(item.frameId !== undefined ? Number(item.frameId) : 0);
                            setTrakeInitialKeyframeId(item.keyframe_id || item.id);
                          }}
                          onOpenTrakeForVidResult={(vidResult) => {
                            setSelectedTrakeIsTemporal(false);
                            setViewMode('trake');
                            setSelectedTrakeVideo(vidResult);
                            if (vidResult.timeline && vidResult.timeline.length > 0) {
                              setTrakeInitialFrameIdx(vidResult.timeline[0].frame_idx);
                              setTrakeInitialKeyframeId(vidResult.timeline[0].keyframe_id);
                            }
                          }}
                          showToast={showToast}
                          wsStatus={wsStatus}
                          onlineUsers={onlineUsers}
                          onAddToKisRanking={handleAddToKisRanking}
                          onAddToQaRanking={handleAddToQaRanking}
                          onAddToTrakeRanking={handleAddToTrakeRanking}
                          onOpenInCheckVideo={handleOpenInCheckVideo}
                        />
                      )}
                      {viewMode === 'check_video' && (
                        <CheckVideoView
                          onSelectResult={(item) => {
                            setSelectedResult(item);
                            setSelectedResultInitialShowVideo(false);
                          }}
                          onNoteImage={handleNoteImage}
                          notedKeyframeIds={notedKeyframeIds}
                          onAddToKisRanking={handleAddToKisRanking}
                          onAddToQaRanking={handleAddToQaRanking}
                          kisKeyframeIds={kisKeyframeIds}
                          qaKeyframeIds={qaKeyframeIds}
                          showToast={showToast}
                          submitMode={submitMode}
                        />
                      )}
                    </div>
                    {selectedResult && (
                      <ResultDetailModal
                        item={selectedResult}
                        initialShowSideVideo={selectedResultInitialShowVideo}
                        onClose={() => {
                          setSelectedResult(null);
                          setSelectedResultInitialShowVideo(false);
                        }}
                        onNote={handleNoteImage}
                        notedKeyframeIds={notedKeyframeIds}
                        onAddToKisRanking={handleAddToKisRanking}
                        onAddToQaRanking={handleAddToQaRanking}
                        kisKeyframeIds={kisKeyframeIds}
                        qaKeyframeIds={qaKeyframeIds}
                        onOpenInCheckVideo={handleOpenInCheckVideo}
                        submitMode={submitMode}
                      />
                    )}
                    {selectedTrakeVideo && (
                      <TrakeVideoInspectorModal
                        videoResult={selectedTrakeVideo}
                        events={selectedTrakeIsTemporal ? temporalStages : trakeEvents}
                        initialFrameIdx={trakeInitialFrameIdx}
                        initialKeyframeId={trakeInitialKeyframeId}
                        enableStageActions={selectedTrakeIsTemporal}
                        onClose={() => {
                          setSelectedTrakeVideo(null);
                          setSelectedTrakeIsTemporal(false);
                          setTrakeInitialFrameIdx(undefined);
                          setTrakeInitialKeyframeId(undefined);
                        }}
                        onNote={handleNoteImage}
                        notedKeyframeIds={notedKeyframeIds}
                        onOpenInCheckVideo={handleOpenInCheckVideo}
                        onAddToRanking={handleAddToTrakeRanking}
                        onAddToKisRanking={handleAddToKisRanking}
                        onAddToQaRanking={handleAddToQaRanking}
                        rankingKeyframeIds={rankingKeyframeIds}
                        kisKeyframeIds={kisKeyframeIds}
                        qaKeyframeIds={qaKeyframeIds}
                        showToast={showToast}
                        submitMode={submitMode}
                      />
                    )}
                    {toast && (
                      <Toast
                        key={toast.id}
                        message={toast.message}
                        tone={toast.tone}
                        onClose={() => setToast(null)}
                      />
                    )}
                  </div>
                </ErrorBoundary>
              );
            }

            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
