                                </span>
                              );
                            })}
                            <span className="text-[10px] font-mono text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md">
                              Top-{entry.topK} · {entry.resultCount} kết quả
                            </span>
                          </div>
                          <span className="text-[11px] text-slate-400 shrink-0">{formatRelativeTime(entry.savedAt)}</span>
                        </div>
                        <div className="space-y-2 mb-3">
                          {entry.panels.map((p, i) => {
                            const meta = PANEL_TYPE_META[p.type] || PANEL_TYPE_META.text;
                            return (
                              <div key={i} className="flex items-start gap-2 text-sm">
                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded border shrink-0 ${meta.color}`}>{meta.label}</span>
                                <span className="text-slate-700 line-clamp-2 leading-snug">{p.query}</span>
                              </div>
                            );
                          })}
                        </div>
                        <div className="flex items-center justify-between">
                          {entry.queryTime && (
                            <span className="text-[11px] text-slate-400 font-mono">{entry.queryTime}s</span>
                          )}
                          <button
                            type="button"
                            onClick={() => onRestoreQuery(entry)}
                            className="ml-auto text-xs font-bold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 px-3 py-1.5 rounded-lg transition-colors"
                          >
                            Tải lại query →
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

            </div>
          </div>

          {/* Modal Nhập tên file CSV trước khi tải về */}
          {exportModal && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs animate-fade-in"
              onClick={() => setExportModal(null)}
            >
              <div
                className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md p-5 space-y-4 animate-scale-in"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div className="flex items-center gap-2.5">
                    <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-white shadow-sm ${exportModal.color === 'sky' ? 'bg-sky-600' : exportModal.color === 'purple' ? 'bg-purple-600' : 'bg-indigo-600'
                      }`}>
                      <Icon name="download" className="w-4 h-4" />
                    </div>
                    <div>
                      <h3 className="font-bold text-slate-900 text-sm">{exportModal.title}</h3>
                      <p className="text-[11px] text-slate-500 font-medium">Số lượng: <strong className="text-slate-800">{exportModal.count}</strong> dòng dữ liệu</p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setExportModal(null)}
                    className="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-bold text-slate-700 block">
                    Nhập tên file CSV cần lưu:
                  </label>
                  <div className="relative">
                    <input
                      type="text"
                      value={exportModal.fileName}
                      onChange={(e) => setExportModal({ ...exportModal, fileName: e.target.value })}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') handleConfirmExportCsv(exportModal.fileName);
                        if (e.key === 'Escape') setExportModal(null);
                      }}
                      autoFocus
                      placeholder="VD: query-1-kis.csv"
                      className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono font-bold text-slate-800 focus:bg-white focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20"
                    />
                  </div>
                  <p className="text-[11px] text-slate-500">
                    💡 Hệ thống tự động thêm đuôi <code className="font-mono font-bold text-slate-700">.csv</code> nếu chưa có.
                  </p>
                </div>

                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                  <button
                    type="button"
                    onClick={() => setExportModal(null)}
                    className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer"
                  >
                    Hủy
                  </button>
                  <button
                    type="button"
                    onClick={() => handleConfirmExportCsv(exportModal.fileName)}
                    className={`px-4.5 py-2 text-xs font-bold text-white rounded-xl shadow-sm transition-all active:scale-95 flex items-center gap-1.5 cursor-pointer ${exportModal.color === 'sky'
                        ? 'bg-sky-600 hover:bg-sky-700 shadow-sky-600/25'
                        : exportModal.color === 'purple'
                          ? 'bg-purple-600 hover:bg-purple-700 shadow-purple-600/25'
                          : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-600/25'
                      }`}
                  >
                    <Icon name="download" className="w-3.5 h-3.5" />
                    <span>Tải file về</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /**
     * TrakeSidebar:
     * Cột bên trái quản lý Stage/Event của TRAKE, hỗ trợ đa modality (Text, OCR, ASR)
     * per-stage giống temporal_search.py, có thể bật/tắt hoặc nhập query theo từng stage.
     */
    function TrakeSidebar({
      context,
      events,
      onChangeContext,
      onUpdateEvent,
      onAddEvent,
      onRemoveEvent,
      onReset,
      onSearch,
      isSearching,
      rankingCount = 0,
      noteCount = 0,
      trakeFilterSource = 'none',
      onChangeFilterSource
    }) {
      const eventListRef = React.useRef(null);

      const handleAddAndScroll = () => {
        onAddEvent();
        setTimeout(() => {
          if (eventListRef.current) {
            eventListRef.current.scrollTop = eventListRef.current.scrollHeight;
          }
        }, 80);
      };

      return (
        <aside className="w-80 md:w-96 bg-slate-50 border-r border-slate-200 flex flex-col h-full shrink-0">
          {/* Top Panel Header */}
          <div className="p-3 border-b border-slate-200 bg-white flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-6 h-6 rounded-lg bg-indigo-600 text-white flex items-center justify-center shadow-xs">
                <Icon name="clock" className="w-3.5 h-3.5" />
              </div>
              <h2 className="font-bold text-xs tracking-wide text-slate-800 uppercase">
                TRAKE Stage Search
              </h2>
              <span className="bg-indigo-100 text-indigo-800 text-[10px] font-bold px-1.5 py-0.5 rounded-full">
                {events.filter(e => e.enabled !== false).length}/{events.length} Mốc
              </span>
            </div>

            <button
              type="button"
              onClick={onReset}
              className="text-slate-400 hover:text-rose-600 p-1 rounded-lg hover:bg-slate-100 transition-all"
              title="Đặt lại các mốc sự kiện"
            >
              <Icon name="rotate-ccw" className="w-3.5 h-3.5" />
            </button>
          </div>

          {/* Scrollable Event List */}
          <div ref={eventListRef} className="flex-1 overflow-y-auto p-3 space-y-3">
            {/* Filter Sources (Ranking / Note) */}
            {(rankingCount > 0 || noteCount > 0) && (
              <div className="bg-indigo-50/70 border border-indigo-200/80 rounded-xl p-2 space-y-1.5">
                <div className="flex items-center justify-between text-[10px] font-bold uppercase text-indigo-950">
                  <span className="flex items-center gap-1">
                    <Icon name="tag" className="w-3 h-3 text-indigo-600" /> Giới hạn Video
                  </span>
                  {trakeFilterSource !== 'none' && (
                    <span className="text-[9px] bg-indigo-600 text-white px-1.5 py-0.2 rounded font-bold">
                      Đang lọc
                    </span>
                  )}
                </div>
                <div className="flex items-center gap-1.5">
                  <button
                    type="button"
                    onClick={() => onChangeFilterSource && onChangeFilterSource('none')}
                    className={`flex-1 py-1 px-1.5 rounded-lg text-[10px] font-bold border transition-all ${trakeFilterSource === 'none'
                      ? 'bg-white text-slate-800 border-slate-300 shadow-xs'
                      : 'bg-transparent text-slate-500 border-transparent hover:bg-white/60'
                      }`}
                  >
                    Tất cả
                  </button>
                  {rankingCount > 0 && (
                    <button
                      type="button"
                      onClick={() => onChangeFilterSource && onChangeFilterSource(trakeFilterSource === 'ranking' ? 'none' : 'ranking')}
                      className={`flex-1 py-1 px-1.5 rounded-lg text-[10px] font-bold border transition-all ${trakeFilterSource === 'ranking'
                        ? 'bg-sky-600 text-white border-sky-700 shadow-xs'
                        : 'bg-white text-sky-700 border-sky-200 hover:bg-sky-50'
                        }`}
                    >
                      Ranking ({rankingCount})
                    </button>
                  )}
                  {noteCount > 0 && (
                    <button
                      type="button"
                      onClick={() => onChangeFilterSource && onChangeFilterSource(trakeFilterSource === 'note' ? 'none' : 'note')}
                      className={`flex-1 py-1 px-1.5 rounded-lg text-[10px] font-bold border transition-all ${trakeFilterSource === 'note'
                        ? 'bg-amber-600 text-white border-amber-700 shadow-xs'
                        : 'bg-white text-amber-700 border-amber-200 hover:bg-amber-50'
                        }`}
                    >
                      Note ({noteCount})
                    </button>
                  )}
                </div>
              </div>
            )}

            {/* Global Context */}
            <div className="bg-white border border-slate-200 rounded-xl p-2.5 space-y-1.5 shadow-xs">
              <label className="text-[10px] font-bold text-slate-600 uppercase tracking-wider flex items-center justify-between">
                <span>Bối cảnh chung (Context)</span>
                <span className="text-[9px] text-slate-400 normal-case">Tùy chọn</span>
              </label>
              <textarea
                value={context}
                onChange={(e) => onChangeContext(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (onSearch) onSearch();
                  }
                }}
                placeholder="Mô tả bối cảnh chung xuyên suốt video..."
                rows={2}
                className="w-full text-xs bg-slate-50 border border-slate-200 rounded-lg p-2 focus:ring-1 focus:ring-indigo-400 focus:bg-white focus:outline-none transition-all resize-none text-slate-800 placeholder:text-slate-400"
              />
            </div>

            {/* List of Stage/Event Cards */}
            <div className="space-y-2.5">
              {events.map((ev, idx) => {
                const color = getEventColor(idx + 1);
                const activeTab = ev.activeTab || 'text';
                const hasText = Boolean(ev.text_query && ev.text_query.trim());
                const hasOcr = Boolean(ev.ocr_query && ev.ocr_query.trim());
                const hasAsr = Boolean(ev.asr_query && ev.asr_query.trim());

                const currentVal = activeTab === 'text'
                  ? (ev.text_query !== undefined ? ev.text_query : (ev.description || ''))
                  : activeTab === 'ocr'
                    ? (ev.ocr_query || '')
                    : (ev.asr_query || '');

                const tabs = [
                  { id: 'text', label: 'Text', field: 'text_query', placeholder: `Mô tả hình ảnh mốc E${idx + 1}...`, color: 'sky', icon: 'type', has: hasText },
                  { id: 'ocr', label: 'OCR', field: 'ocr_query', placeholder: `Chữ / text xuất hiện tại E${idx + 1}...`, color: 'amber', icon: 'scan-text', has: hasOcr },
                  { id: 'asr', label: 'ASR', field: 'asr_query', placeholder: `Lời thoại / âm thanh tại E${idx + 1}...`, color: 'purple', icon: 'mic', has: hasAsr },
                ];

                const isEventEnabled = ev.enabled !== false;

                return (
                  <div
                    key={ev.id || idx}
                    className={`bg-white border rounded-2xl p-3 shadow-xs transition-all space-y-2 ${!isEventEnabled ? 'opacity-70 bg-slate-50/80 border-slate-200' : 'border-slate-200 hover:border-indigo-300'}`}
                  >
                    {/* Stage Card Header */}
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className={`w-5 h-5 rounded-md ${isEventEnabled ? color.badge : 'bg-slate-300 text-slate-600'} text-[10px] font-bold flex items-center justify-center shadow-xs transition-colors`}>
                          E{idx + 1}
                        </span>
                        <span className={`font-bold text-xs ${isEventEnabled ? 'text-slate-800' : 'text-slate-500 line-through decoration-slate-400'}`}>
                          Mốc sự kiện {idx + 1}
                        </span>
                        {!isEventEnabled && (
                          <span className="px-1.5 py-0.2 rounded text-[9px] font-bold bg-slate-200 text-slate-600 border border-slate-300">
                            Tắt
                          </span>
                        )}
                        {isEventEnabled && (
                          <div className="flex items-center gap-1">
                            {hasText && (
                              <span className="px-1.5 py-0.2 rounded text-[9px] font-bold bg-sky-100 text-sky-800 border border-sky-200">
                                Text
                              </span>
                            )}
                            {hasOcr && (
                              <span className="px-1.5 py-0.2 rounded text-[9px] font-bold bg-amber-100 text-amber-800 border border-amber-200">
                                OCR
                              </span>
                            )}
                            {hasAsr && (
                              <span className="px-1.5 py-0.2 rounded text-[9px] font-bold bg-purple-100 text-purple-800 border border-purple-200">
                                ASR
                              </span>
                            )}
                          </div>
                        )}
                      </div>

                      <div className="flex items-center gap-1.5">
                        <button
                          type="button"
                          onClick={() => onUpdateEvent(idx, { ...ev, enabled: !isEventEnabled })}
                          title={isEventEnabled ? `Tắt mốc E${idx + 1}` : `Bật mốc E${idx + 1}`}
                          className={`relative inline-flex h-4 w-7 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${isEventEnabled ? 'bg-indigo-600' : 'bg-slate-300'}`}
                        >
                          <span className={`pointer-events-none inline-block h-3 w-3 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${isEventEnabled ? 'translate-x-3' : 'translate-x-0'}`} />
                        </button>
                        {events.length > 1 && (
                          <button
                            type="button"
                            onClick={() => onRemoveEvent(idx)}
                            className="p-1 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors"
                            title={`Xóa mốc E${idx + 1}`}
                          >
                            <Icon name="x" className="w-3.5 h-3.5" />
                          </button>
                        )}
                      </div>
                    </div>

                    {/* Modality Tabs */}
                    <div className="flex items-center gap-1 bg-slate-100/90 p-1 rounded-xl border border-slate-200/80">
                      {tabs.map((tab) => {
                        const isActive = activeTab === tab.id;
                        let activeClasses = 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/60';
                        if (isActive) {
                          if (tab.id === 'text') activeClasses = 'bg-white text-sky-700 border-sky-200 shadow-xs font-bold ring-1 ring-sky-300';
                          else if (tab.id === 'ocr') activeClasses = 'bg-white text-amber-700 border-amber-200 shadow-xs font-bold ring-1 ring-amber-300';
                          else if (tab.id === 'asr') activeClasses = 'bg-white text-purple-700 border-purple-200 shadow-xs font-bold ring-1 ring-purple-300';
                        }

                        return (
                          <button
                            key={tab.id}
                            type="button"
                            onClick={() => onUpdateEvent(idx, { ...ev, activeTab: tab.id })}
                            className={`flex-1 flex items-center justify-center gap-1 py-1 px-1 rounded-lg text-[10px] font-semibold transition-all relative border border-transparent ${activeClasses}`}
                          >
                            <Icon name={tab.icon} className="w-3 h-3 shrink-0" />
                            <span>{tab.label}</span>
                            {tab.has && (
                              <span
                                className={`w-1.5 h-1.5 rounded-full shrink-0 ${tab.id === 'text' ? 'bg-sky-500' : tab.id === 'ocr' ? 'bg-amber-500' : 'bg-purple-500'
                                  }`}
                              />
                            )}
                          </button>
                        );
                      })}
                    </div>

                    {/* Active Input */}
                    <div className="relative">
                      <textarea
                        value={currentVal}
                        onChange={(e) => {
                          const val = e.target.value;
                          const currentTabObj = tabs.find(t => t.id === activeTab) || tabs[0];
                          const updated = { ...ev, [currentTabObj.field]: val };
                          if (activeTab === 'text') {
                            updated.description = val;
                          }
                          onUpdateEvent(idx, updated);
                        }}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            if (onSearch) onSearch();
                          }
                        }}
                        placeholder={tabs.find(t => t.id === activeTab)?.placeholder}
                        rows={2}
                        className="w-full text-xs font-medium text-slate-800 bg-white border border-slate-200 rounded-xl p-2 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 transition-all resize-none placeholder:text-slate-400 placeholder:font-normal leading-relaxed"
                      />
                    </div>
                  </div>
                );
              })}
            </div>

            {/* "+ Thêm mốc sự kiện" Button */}
            <button
              type="button"
              onClick={handleAddAndScroll}
              className="w-full py-2.5 px-4 rounded-xl border-2 border-dashed border-slate-300 hover:border-indigo-500 hover:bg-indigo-50/50 text-slate-600 hover:text-indigo-800 font-bold text-xs flex items-center justify-center gap-1.5 transition-all shadow-xs"
            >
              <Icon name="plus" className="w-3.5 h-3.5 text-indigo-600" />
              <span>+ Thêm mốc E{events.length + 1}</span>
            </button>
          </div>

          {/* Sticky Bottom Search Action */}
          <div className="p-3 bg-white border-t border-slate-200 shadow-lg">
            <button
              type="button"
              onClick={onSearch}
              disabled={isSearching}
              className={`w-full py-2.5 px-4 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2 shadow-md transition-all ${isSearching
                ? 'bg-slate-600 cursor-wait'
                : 'bg-gradient-to-r from-indigo-600 to-violet-600 hover:shadow-lg active:scale-95'
                }`}
            >
              {isSearching ? (
                <>
                  <div className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin" />
                  <span>Đang giải TRAKE...</span>
                </>
              ) : (
                <>
                  <Icon name="sparkles" className="w-4 h-4" />
                  <span>Giải TRAKE (DP)</span>
                  <span className="text-[10px] bg-white/20 px-1.5 py-0.5 rounded font-mono font-normal">Enter</span>
                </>
              )}
            </button>
          </div>
        </aside>
      );
    }

    // Helper to get color classes for events (E1, E2, E3...)
    function getEventColor(eventId, type = 'badge') {
      const idx = parseInt(String(eventId).replace(/\D/g, '') || '1', 10) - 1;
      const palette = [
        { badge: 'bg-indigo-600 text-white', ring: 'ring-indigo-500', text: 'text-indigo-600', border: 'border-indigo-300', bg: 'bg-indigo-50', dot: '#4f46e5' },
        { badge: 'bg-emerald-600 text-white', ring: 'ring-emerald-500', text: 'text-emerald-600', border: 'border-emerald-300', bg: 'bg-emerald-50', dot: '#059669' },
        { badge: 'bg-amber-500 text-white', ring: 'ring-amber-500', text: 'text-amber-600', border: 'border-amber-300', bg: 'bg-amber-50', dot: '#d97706' },
        { badge: 'bg-purple-600 text-white', ring: 'ring-purple-500', text: 'text-purple-600', border: 'border-purple-300', bg: 'bg-purple-50', dot: '#9333ea' },
        { badge: 'bg-rose-600 text-white', ring: 'ring-rose-500', text: 'text-rose-600', border: 'border-rose-300', bg: 'bg-rose-50', dot: '#e11d48' },
        { badge: 'bg-cyan-600 text-white', ring: 'ring-cyan-500', text: 'text-cyan-600', border: 'border-cyan-300', bg: 'bg-cyan-50', dot: '#0891b2' },
      ];
      return palette[idx % palette.length];
    }

    // Helper to determine optimal responsive grid columns based on number of events in timeline
    function getGridColsClass(maxEvents) {
      if (maxEvents <= 1) {
        return 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-4 2xl:grid-cols-5 gap-x-1.5 gap-y-1';
      }
      if (maxEvents === 2) {
        return 'grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-x-1.5 gap-y-1';
      }
      if (maxEvents === 3) {
        return 'grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-3 gap-x-1.5 gap-y-1';
      }
      if (maxEvents === 4) {
        return 'grid grid-cols-1 xl:grid-cols-2 gap-x-1.5 gap-y-1';
      }
      return 'grid grid-cols-1 gap-y-1';
    }

    function TrakeResultGrid({ results, isSearching, error, onClearError, onSelectVideo, onSelectKeyframe, rankingKeyframeIds = new Set(), notedKeyframeIds = new Set(), trakeVideoIds = new Set(), trakeSequenceKeys = new Set(), onAddToRanking, onNoteImage, showToast }) {
      const handleAddVideoToRanking = (vidResult, e) => {
        if (e) e.stopPropagation();
        if (!onAddToRanking || !vidResult) return;
        onAddToRanking(vidResult);
        if (showToast) showToast(`Đã thêm chuỗi sự kiện của video ${vidResult.video_id} vào TRAKE Ranking!`, 'success');
      };

      const handleAddVideoToNote = (vidResult, e) => {
        if (e) e.stopPropagation();
        if (!onNoteImage || !vidResult || !vidResult.timeline) return;
        let count = 0;
        vidResult.timeline.forEach((f, idx) => {
          onNoteImage({
            id: f.keyframe_id || `${vidResult.video_id}_${f.frame_idx}`,
            keyframe_id: f.keyframe_id,
            videoId: vidResult.video_id,
            videoTitle: vidResult.video_id,
            frameId: f.frame_idx,
            timestamp: f.timestamp,
            pts_time: (f.timestamp || 0) / 1000,
            thumbnailUrl: getResolvedImageUrl(f.image_path, vidResult.video_id, f.keyframe_id),
            score: f.score || vidResult.global_score || 0,
            rank: idx + 1,
            matchedSources: ['trake', f.event_id],
            caption: `${vidResult.video_id} • ${f.event_id} (F#${f.frame_idx})`,
          });
          count++;
        });
        if (showToast) showToast(`Đã lưu ${count} mốc của video ${vidResult.video_id} vào Note!`, 'success');
      };

      const handleAddAllToRanking = () => {
        if (!onAddToRanking || !results || results.length === 0) return;
        results.forEach((vidResult) => {
          onAddToRanking(vidResult);
        });
        if (showToast) showToast(`Đã thêm toàn bộ ${results.length} chuỗi video vào TRAKE Ranking!`, 'success');
      };

      if (error) return (
        <div className="flex-1 flex flex-col items-center justify-center p-8">
          <div className="bg-rose-50 border border-rose-200 rounded-2xl p-6 max-w-md text-center shadow-sm">
            <Icon name="alert-triangle" className="w-10 h-10 text-rose-500 mx-auto mb-3" />
            <h3 className="text-sm font-bold text-rose-800 mb-1">Lỗi tìm kiếm TRAKE</h3>
            <p className="text-xs text-rose-600 mb-4">{error}</p>
            <button onClick={onClearError} className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl transition-all shadow">
              Thử lại
            </button>
          </div>
        </div>
      );

      if (isSearching) return (
        <div className="flex-1 flex flex-col items-center justify-center p-12 space-y-4">
          <div className="relative">
            <div className="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
            <div className="absolute inset-0 flex items-center justify-center">
              <Icon name="sparkles" className="w-6 h-6 text-indigo-600 animate-pulse" />
            </div>
          </div>
          <div className="text-center">
            <p className="font-bold text-sm text-slate-800">Đang giải đề TRAKE với Dynamic Programming...</p>

      if (!results || results.length === 0) return (
        <div className="flex-1 flex flex-col items-center justify-center text-slate-400 p-8 text-center">

        </div>
      );

      const eventLengths = (results || []).map(r => (r.timeline || []).length).filter(n => n > 0);
      const maxEvents = eventLengths.length > 0 ? Math.max(...eventLengths) : 1;

      return (
        <div className="flex-1 p-2 overflow-y-auto space-y-2">
          {/* Header Bar */}
          <div className="flex items-center justify-between pb-2 border-b border-slate-200 flex-wrap gap-2">

              <span className="text-xs font-bold uppercase tracking-wider text-slate-700">Top Video phù hợp nhất</span>

            <div className="flex items-center gap-2 flex-wrap">
              {results.length > 0 && (
                <button
                  type="button"

              </span>
            </div>
          </div>

          {/* Dynamic Grid based on number of events */}
          <div className={getGridColsClass(maxEvents)}>
            {results.map((vidResult, vIdx) => {
              const timeline = vidResult.timeline || [];
              const seqKey = getTrakeSequenceKey(vidResult);
              const isAllRanked = Boolean(trakeSequenceKeys && trakeSequenceKeys.has(seqKey)) || Boolean(timeline.length > 0 && timeline.every(f => rankingKeyframeIds.has(f.keyframe_id)));
              const isAllNoted = timeline.length > 0 && timeline.every(f => notedKeyframeIds.has(f.keyframe_id));

              return (
                <div
                  key={vIdx}
                  onClick={() => onSelectVideo(vidResult)}

                    <div className="flex items-center gap-2 truncate">
                      <span className="px-1.5 py-0.5 rounded bg-indigo-600 text-white font-extrabold text-[10px] shrink-0">#{vIdx + 1}</span>
                      <span className="truncate text-slate-100 font-bold text-xs sm:text-[13px] tracking-wide">{vidResult.video_id}</span>
                    </div>
                  </div>

                  {/* Horizontal Keyframes Sequence: all events visible side-by-side with equal flex-1 width */}
                  <div className="p-1 sm:p-1.5 flex items-center gap-1 sm:gap-1.5 w-full">
                    {timeline.map((frame, fIdx) => {
                      const nextFrame = timeline[fIdx + 1];
                      let gapSec = null;
                      if (
                        frame.timestamp !== null && frame.timestamp !== undefined &&
                        nextFrame && nextFrame.timestamp !== null && nextFrame.timestamp !== undefined
                      ) {
                        gapSec = Math.max(0, (nextFrame.timestamp - frame.timestamp) / 1000.0);
                      }

                      const isKfRanked = rankingKeyframeIds && rankingKeyframeIds.has(frame.keyframe_id);
                      const isKfNoted = notedKeyframeIds && notedKeyframeIds.has(frame.keyframe_id);

                      return (
                        <React.Fragment key={fIdx}>
                          <div
                            className="flex-1 min-w-0 aspect-video relative rounded-lg overflow-hidden border border-slate-800 hover:border-indigo-400 hover:shadow-lg cursor-pointer transition-all bg-slate-950 group"
                            onClick={(e) => { e.stopPropagation(); onSelectVideo(vidResult, frame.frame_idx, frame.keyframe_id); }}
                            title={`Nhấp để mở video (Keyframe ${frame.keyframe_id} • Frame ${frame.frame_idx})`}
                          >
                            {/* Ranking / Note Indicators */}
                            <div className="absolute top-1.5 left-1.5 z-10 flex items-center gap-1">
                              {isKfRanked && (
                                <span className="w-4 h-4 rounded bg-sky-500 text-white flex items-center justify-center shadow-xs" title="Có trong Ranking">
                                  <Icon name="tag" className="w-2.5 h-2.5" />
                                </span>
                              )}
                              {isKfNoted && (
                                <span className="w-4 h-4 rounded bg-amber-500 text-white flex items-center justify-center shadow-xs" title="Có trong Note">
                                  <Icon name="bookmark" className="w-2.5 h-2.5" />
                                </span>
                              )}
                            </div>

                            {/* Hover Actions: Copy & Video buttons */}
                            <div className="absolute top-1.5 right-1.5 flex items-center gap-1 z-20" onClick={(e) => e.stopPropagation()}>
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  const fId = frame.frame_idx !== undefined && frame.frame_idx !== '' ? frame.frame_idx : frame.keyframe_id;
                                  const textToCopy = `${vidResult.video_id}_${fId}`;
                                  if (navigator.clipboard && navigator.clipboard.writeText) {
                                    navigator.clipboard.writeText(textToCopy);
                                  } else {
                                    const ta = document.createElement('textarea');
                                    ta.value = textToCopy;
                                    document.body.appendChild(ta);
                                    ta.select();
                                    document.execCommand('copy');
                                    document.body.removeChild(ta);
                                  }
                                  if (window.__showToast) {
                                    window.__showToast(`Đã copy: ${textToCopy}`, 'success');
                                  }
                                }}
                                className="opacity-0 group-hover:opacity-100 transition-opacity bg-slate-900/90 hover:bg-emerald-600 text-white px-1.5 py-0.5 rounded-md text-[10px] font-bold flex items-center gap-1 shadow-sm cursor-pointer"
                                title="Copy Video ID & Frame ID (VD: L21_V001_12345)"
                              >
                                <Icon name="copy" className="w-2.5 h-2.5" />
                                <span className="hidden sm:inline">Copy</span>
                              </button>
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  onSelectVideo(vidResult, frame.frame_idx, frame.keyframe_id);
                                }}
                                className="opacity-0 group-hover:opacity-100 transition-opacity bg-purple-600/95 hover:bg-purple-700 text-white px-1.5 py-0.5 rounded-md text-[10px] font-bold flex items-center gap-1 shadow-sm cursor-pointer"
                                title="Mở video tại frame này"
                              >
                                <Icon name="video" className="w-2.5 h-2.5" />
                                <span className="hidden sm:inline">Video</span>
                              </button>
                            </div>

                            {/* Thumbnail Image */}
                            <div className="w-full h-full overflow-hidden bg-slate-950">
                              <ResultGridImage
                                src={getResolvedImageUrl(frame.image_path, vidResult.video_id, frame.keyframe_id)}
                                alt={frame.keyframe_id || `${vidResult.video_id}_${frame.frame_idx}`}
                                lazy={true}
                              />
                            </div>

                            {/* Gradient Overlay at Bottom (Frame #) */}
                            <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/85 via-black/45 to-transparent p-1.5 sm:p-2 pt-4 flex items-end justify-between text-white pointer-events-none">
                              <div className="min-w-0">
                                <p className="text-[9px] sm:text-[10px] text-white/90 font-mono font-semibold truncate drop-shadow-sm">
                                  Frame #{frame.frame_idx ?? frame.keyframe_id}
                                </p>
                              </div>
                            </div>
                          </div>

                          {/* Connector Arrow with Gap Duration */}
                          {fIdx < timeline.length - 1 && (
                            <div className="shrink-0 flex flex-col items-center justify-center select-none px-0.5">
                              <div className="flex items-center gap-0.5 bg-slate-100 border border-slate-200 text-slate-700 px-1.5 py-0.5 rounded-full font-bold shadow-2xs">
                                <Icon name="arrow-right" className="w-3 h-3 text-slate-500" />
                                {gapSec !== null && (
                                  <span className="text-[8px] font-mono text-slate-800 font-extrabold whitespace-nowrap">
                                    +{gapSec.toFixed(1)}s
                                  </span>
                                )}
                              </div>
                            </div>
                          )}
                        </React.Fragment>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // =========================================================================

    function makeStageId() {
      return 'stage_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);

    const MOCK_TEMPORAL_RESPONSE = {

    /**
     * StageCard:
     * Quản lý Stage với nhiều lớp truy vấn (subQueries): Text, OCR, ASR, Keyframe Image Similarity.
     * Mỗi lớp có trọng số riêng và được RRF hợp nhất trong Stage trước khi chạy chuỗi thời gian (DP).
     */
    function StageCard({
      stage,
      stageIndex,
      totalStages,
      onUpdateStage,
      onRemoveStage,
      onSearch
    }) {
      const [showAddMenu, setShowAddMenu] = React.useState(false);
      const isCollapsed = Boolean(stage.collapsed);
      const isEnabled = stage.enabled !== false;
      const subQueries = Array.isArray(stage.subQueries) ? stage.subQueries : [
        {
          id: `sq-${stage.id}-1`,
          type: stage.ocr_query ? 'ocr' : (stage.asr_query ? 'asr' : 'text'),
          query: stage.text_query || stage.ocr_query || stage.asr_query || '',
          videoId: stage.image_video_id || '',
          frameId: stage.image_frame_id || '',
          weight: stage.weight_text || 1.0,
          enabled: true
        }
      ];

      const isLastStage = stageIndex === totalStages - 1;

      const activeSubCount = subQueries.filter(sq => {
        if (sq.enabled === false) return false;
        if (sq.type === 'image') return Boolean((sq.videoId || '').trim() && (sq.frameId || '').trim());
        return Boolean((sq.query || '').trim());
      }).length;

      const handleUpdateSubQuery = (subId, updatedSq) => {
        const next = subQueries.map(sq => sq.id === subId ? updatedSq : sq);
        onUpdateStage(stage.id, { ...stage, subQueries: next });
      };

      const handleAddSubQuery = (type = 'text') => {
        setShowAddMenu(false);
        const newSq = {
          id: `sq-${Date.now()}-${subQueries.length + 1}`,
          type: type,
          query: '',
          videoId: '',
          frameId: '',
          weight: 1.0,
          enabled: true,
        };
        onUpdateStage(stage.id, { ...stage, subQueries: [...subQueries, newSq] });
      };

      const handleRemoveSubQuery = (subId) => {
        if (subQueries.length <= 1) return;
        const next = subQueries.filter(sq => sq.id !== subId);
        onUpdateStage(stage.id, { ...stage, subQueries: next });
      };

      const handleFieldChange = (field, value) => {
        onUpdateStage(stage.id, { ...stage, [field]: value });
      };

      return (
        <div
          id={`stage-card-${stage.id}`}
          className={`bg-white border rounded-2xl transition-all shadow-xs overflow-hidden ${!isEnabled
            ? 'border-slate-200 bg-slate-50/70 opacity-75'
            : isCollapsed
              ? 'border-slate-200 hover:border-slate-300'
              : 'border-slate-300 ring-1 ring-emerald-500/20 shadow-sm'
            }`}
        >
          {/* Card Header */}
          <div
            onClick={() => handleFieldChange('collapsed', !isCollapsed)}
            className={`flex items-center justify-between px-3.5 py-2.5 bg-slate-50/90 hover:bg-slate-100/80 cursor-pointer select-none transition-colors border-b border-slate-100 ${!isEnabled ? 'bg-slate-100/60' : ''}`}
          >
            <div className="flex items-center gap-2">
              <span className={`w-6 h-6 rounded-lg ${isEnabled ? 'bg-emerald-600 text-white' : 'bg-slate-300 text-slate-600'} text-xs font-bold flex items-center justify-center shadow-xs transition-colors`}>
                {stageIndex + 1}
              </span>
              <span className={`font-bold text-xs ${isEnabled ? 'text-slate-800' : 'text-slate-500 line-through decoration-slate-400'} tracking-tight`}>
                Stage {stageIndex + 1}
              </span>

              {/* Stage Weight Badge in Header */}
              <span className="px-1.5 py-0.5 rounded text-[10px] font-bold font-mono bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-2xs" title={`Trọng số Stage ${stageIndex + 1} so với các stage khác`}>
                w: {Number(stage.stage_weight ?? 1.0).toFixed(1)}
              </span>

              {!isEnabled && (
                <span className="px-1.5 py-0.2 rounded text-[9px] font-bold bg-slate-200 text-slate-600 border border-slate-300">
                  Tắt
                </span>
              )}

              {/* Modality Counts */}
              {isEnabled && (
                <div className="flex items-center gap-1 ml-1">
                  {subQueries.map((sq, sIdx) => {
                    const hasData = sq.type === 'image'
                      ? Boolean((sq.videoId || '').trim() && (sq.frameId || '').trim())
                      : Boolean((sq.query || '').trim());
                    if (!hasData) return null;
                    const meta = PANEL_TYPE_META[sq.type] || PANEL_TYPE_META.text;
                    const label = meta.label;
                    const badgeColor = meta.color;
                    return (
                      <span key={sq.id || sIdx} className={`px-1.5 py-0.5 rounded-md text-[10px] font-bold border ${badgeColor}`}>
                        {label}
                      </span>
                    );
                  })}
                  {activeSubCount === 0 && (
                    <span className="text-[10px] text-slate-400 italic">Chưa nhập query</span>
                  )}
                </div>
              )}
            </div>

            <div className="flex items-center gap-1.5" onClick={(e) => e.stopPropagation()}>
              {/* Toggle Switch Bật/Tắt Stage */}
              <button
                type="button"
                onClick={() => handleFieldChange('enabled', !isEnabled)}
                className={`relative inline-flex h-4 w-7 sm:h-5 sm:w-9 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${isEnabled ? 'bg-emerald-600' : 'bg-slate-300'}`}
                title={isEnabled ? `Tắt Stage ${stageIndex + 1}` : `Bật Stage ${stageIndex + 1}`}
              >
                <span className={`pointer-events-none inline-block h-3 w-3 sm:h-4 sm:w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${isEnabled ? 'translate-x-3 sm:translate-x-4' : 'translate-x-0'}`} />
              </button>
              <div
                onClick={() => handleFieldChange('collapsed', !isCollapsed)}
                className="p-1 text-slate-400 hover:text-slate-600 rounded-md cursor-pointer"
              >
                <Icon name={isCollapsed ? 'chevron-down' : 'chevron-up'} className="w-3.5 h-3.5" />
              </div>
              <button
                type="button"
                onClick={() => onRemoveStage(stage.id)}
                className="p-1 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors"
                title="Xóa stage này"
              >
                <Icon name="x" className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>

          {/* Card Body */}
          {!isCollapsed && (
            <div className="flex divide-x divide-slate-100">
              {/* Cột nhỏ dọc bên trái: Thanh trượt dọc điều chỉnh Trọng số CẤP STAGE */}
              <div className="w-10 bg-slate-50/70 py-3 px-1 flex flex-col items-center justify-between select-none shrink-0" title={`Trọng số Stage ${stageIndex + 1} (ưu tiên chuỗi match stage này)`}>
                <div className="flex flex-col items-center gap-0.5">
                  <span className="text-[9px] font-bold uppercase tracking-wider text-slate-400">W</span>
                  <span className="font-mono font-bold text-[10px] text-emerald-700 bg-white px-1 py-0.5 rounded border border-emerald-200/80 shadow-2xs">
                    {Number(stage.stage_weight ?? 1.0).toFixed(1)}
                  </span>
                </div>

                <div className="py-2 flex items-center justify-center h-36">
                  <input
                    type="range"
                    min="0.1"
                    max="3.0"
                    step="0.1"
                    value={stage.stage_weight ?? 1.0}
                    onChange={(e) => handleFieldChange('stage_weight', parseFloat(e.target.value))}
                    className="h-32 w-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-600 [writing-mode:vertical-lr] [direction:rtl]"
                    title={`Kéo lên/xuống để tăng/giảm trọng số của Stage ${stageIndex + 1}`}
                  />
                </div>

                <span className="text-[8px] font-semibold text-slate-400 uppercase">Stage</span>
              </div>

              {/* Phần nội dung chính của Stage */}
              <div className="flex-1 p-3 space-y-3 min-w-0">
                {/* List of sub-query condition panels */}
                <div className="space-y-2.5">
                  {subQueries.map((sq, sqIdx) => {
                    const sqType = sq.type || 'text';
                    const activeTypeObj = SEARCH_TYPES.find(t => t.id === sqType) || SEARCH_TYPES[0];
                    const sqColors = SEARCH_COLORS[sqType] || SEARCH_COLORS.text;

                    const hasText = sqType === 'text' && Boolean((sq.query || '').trim());
                    const hasOcr = sqType === 'ocr' && Boolean((sq.query || '').trim());
                    const hasAsr = sqType === 'asr' && Boolean((sq.query || '').trim());
                    const hasImg = sqType === 'image' && Boolean((sq.query || '').trim() || ((sq.videoId || '').trim() && (sq.frameId || '').trim()));

                    const tabs = [
                      { id: 'text', label: 'Text', icon: 'type', color: 'sky' },
                      { id: 'ocr', label: 'OCR', icon: 'scan-text', color: 'amber' },
                      { id: 'asr', label: 'ASR', icon: 'mic', color: 'purple' },
                      { id: 'image', label: 'Ảnh', icon: 'image', color: 'emerald' },
                    ];

                    return (
                      <div key={sq.id || sqIdx} className="bg-slate-50/90 border border-slate-200/90 rounded-2xl p-2.5 space-y-2 shadow-2xs">
                        {/* Segmented Modality Tabs Bar - TRAKE style */}
                        <div className="flex items-center gap-1 bg-slate-200/60 p-1 rounded-xl border border-slate-200/80">
                          {tabs.map((tab) => {
                            const isActive = sqType === tab.id;
                            let activeClasses = 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60';
                            if (isActive) {
                              if (tab.id === 'text') activeClasses = 'bg-white text-sky-700 border-sky-200 shadow-xs font-bold ring-1 ring-sky-300';
                              else if (tab.id === 'ocr') activeClasses = 'bg-white text-amber-700 border-amber-200 shadow-xs font-bold ring-1 ring-amber-300';
                              else if (tab.id === 'asr') activeClasses = 'bg-white text-purple-700 border-purple-200 shadow-xs font-bold ring-1 ring-purple-300';
                              else if (tab.id === 'image') activeClasses = 'bg-white text-emerald-700 border-emerald-200 shadow-xs font-bold ring-1 ring-emerald-300';
                            }

                            const hasDataForTab = (tab.id === 'text' && hasText) ||
                              (tab.id === 'ocr' && hasOcr) ||
                              (tab.id === 'asr' && hasAsr) ||
                              (tab.id === 'image' && hasImg);

                            return (
                              <button
                                key={tab.id}
                                type="button"
                                onClick={() => handleUpdateSubQuery(sq.id, { ...sq, type: tab.id })}
                                className={`flex-1 flex items-center justify-center gap-1 py-1 px-1 rounded-lg text-[10px] font-semibold transition-all relative border border-transparent ${activeClasses}`}
                              >
                                <Icon name={tab.icon} className="w-3 h-3 shrink-0" />
                                <span>{tab.label}</span>
                                {hasDataForTab && (
                                  <span
                                    className={`w-1.5 h-1.5 rounded-full shrink-0 ${tab.id === 'text' ? 'bg-sky-500' : tab.id === 'ocr' ? 'bg-amber-500' : tab.id === 'asr' ? 'bg-purple-500' : 'bg-emerald-500'}`}
                                  />
                                )}
                              </button>
                            );
                          })}
                        </div>

                        {/* Input field for current Modality */}
                        {sqType === 'image' ? (
                          <div className="space-y-2">
                            <input
                              type="text"
                              value={sq.query || (sq.videoId ? (sq.frameId ? `${sq.videoId}_${sq.frameId}` : sq.videoId) : '')}
                              onChange={(e) => handleUpdateSubQuery(sq.id, { ...sq, query: e.target.value, videoId: '', frameId: '' })}
                              onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSearch(); } }}
                              placeholder="VD: L21_V001_12345"
                              className="w-full px-2.5 py-1.5 bg-white border border-slate-200 focus:border-emerald-500 rounded-xl text-xs font-mono font-bold text-slate-800 outline-none transition-all placeholder-slate-400"
                            />

                            {/* Text bổ trợ (tùy chọn) đi kèm ảnh - Fusion 75/25 */}
                            <div className="space-y-1 bg-white border border-emerald-100 rounded-xl p-2">
                              <label className="text-[10px] font-semibold text-emerald-800 flex items-center justify-between">
                                <span>Text bổ trợ (tùy chọn):</span>
                                <span className="text-[9px] font-medium text-emerald-600 bg-emerald-50 px-1 py-0.2 rounded border border-emerald-200">75% Text + 25% Ảnh</span>
                              </label>
                              <textarea
                                rows={2}
                                value={sq.helperText || sq.helper_text || ''}
                                onChange={(e) => handleUpdateSubQuery(sq.id, { ...sq, helperText: e.target.value, helper_text: e.target.value })}
                                onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSearch(); } }}
                                placeholder="Nhập text mô tả bổ trợ cho ảnh (tùy chọn)..."
                                className="w-full text-xs font-medium text-slate-800 bg-white border border-slate-200 rounded-lg p-1.5 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/20 transition-all resize-none placeholder:text-slate-400"
                              />
                              <div className="text-[10px] text-slate-400 italic">
                                💡 Kết hợp với ảnh theo tỉ lệ 75% text / 25% ảnh
                              </div>
                            </div>
                          </div>
                        ) : (
                          <textarea
                            rows={2}
                            value={sq.query || ''}
                            onChange={(e) => handleUpdateSubQuery(sq.id, { ...sq, query: e.target.value })}
                            onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSearch(); } }}
                            placeholder={activeTypeObj.placeholder}
                            className={`w-full text-xs font-medium text-slate-800 bg-white border border-slate-200 rounded-xl p-2 outline-none ${sqColors.focusBorder} focus:ring-1 ${sqColors.focusRing} transition-all resize-none placeholder:text-slate-400 placeholder:font-normal leading-relaxed`}
                          />
                        )}

                        {/* Trọng số RRF cho ô này + Nút xóa ô */}
                        <div className="flex items-center justify-between gap-2 pt-1 border-t border-slate-200/50 text-[11px]">
                          <span className="text-slate-600 font-medium shrink-0 flex items-center gap-1" title="Trọng số RRF cho ô điều kiện này trong Stage">
                            <span>Trọng số RRF:</span>
                            <strong className="font-mono font-bold text-slate-800 bg-white px-1.5 py-0.2 rounded border border-slate-200">
                              {Number(sq.weight ?? 1.0).toFixed(1)}

                          <input
                            type="range"
                            min="0.1"
                            max="3"
                            step="0.1"
                            value={sq.weight ?? 1.0}
                            onChange={(e) => handleUpdateSubQuery(sq.id, { ...sq, weight: parseFloat(e.target.value) })}
                            className={`flex-1 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer ${sqColors.accentColor}`}

                {/* Add subQuery button with dropdown */}
                <div className="relative pt-0.5">
                  <button

                    onClick={() => setShowAddMenu(!showAddMenu)}
                    className="w-full py-2 px-3 bg-white hover:bg-slate-50 text-slate-700 hover:text-emerald-700 font-semibold text-xs rounded-xl border border-dashed border-slate-300 hover:border-emerald-400 flex items-center justify-center space-x-1.5 transition-all shadow-xs"
                  >

                  {showAddMenu && (

                      </div>
                      <div className="p-1 space-y-0.5">
                        {SEARCH_TYPES.map((t) => {
                          const hoverClass = HOVER_MENU_COLORS[t.id] || 'hover:bg-slate-100';
                          const softIconClass = SOFT_ICON_COLORS[t.id] || 'bg-slate-100 text-slate-700';

                    </div>

                    <label className="text-[11px] font-semibold text-slate-700 flex items-center justify-between">
                      <span>Khoảng cách tối đa tới Stage {stageIndex + 2} (giây):</span>

                    <input

                      min="1"
                      step="5"
                      value={stage.max_gap_seconds ?? ''}
                      onChange={(e) => {

                        handleFieldChange('max_gap_seconds', val);

                      placeholder="Không giới hạn (vd: 120)"
                      className="w-full text-xs bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-200"
                    />
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

     * TemporalSidebar:
     * Cột bên trái quản lý Stage, thêm/xóa/collapse và nút Search.

    function TemporalSidebar({

          <div className="p-3 border-b border-slate-200 bg-white flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-6 h-6 rounded-lg bg-emerald-600 text-white flex items-center justify-center shadow-xs">
                <Icon name="layers" className="w-3.5 h-3.5" />
              </div>
              <h2 className="font-bold text-xs tracking-wide text-slate-800 uppercase">

              </h2>
              <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-1.5 py-0.5 rounded-full">

              <button

                onClick={onLoadMockDemo}

                title="Tải nhanh dữ liệu mẫu kiểm thử UI"

              <button
                type="button"
                onClick={onReset}

                <Icon name="rotate-ccw" className="w-3.5 h-3.5" />

                      ? 'bg-white text-slate-800 border-slate-300 shadow-xs'

                    Tất cả

            {/* 1.4. Global Context Input */}

                <>
                  <Icon name="search" className="w-4 h-4" />

                  <span className="text-[10px] bg-white/20 px-1.5 py-0.5 rounded font-mono font-normal">Enter</span>

    /**
     * 3.2. FrameChainThumbnail:
     * Thumbnail đơn lẻ trong frame_chain.
     * Xử lý trường hợp missing frame (khung xám ?, disabled click).
     */
    function FrameChainThumbnail({
      frame,
      stageIndex,
      onSelectFrame,
      rankingKeyframeIds = new Set(),
      notedKeyframeIds = new Set(),
      kisKeyframeIds = new Set(),
      qaKeyframeIds = new Set(),
      onAddToKisRanking,
      onAddToQaRanking,
      showToast
    }) {
      const isMissing = frame.frame_idx === null || frame.timestamp === null;
      const [showVqa, setShowVqa] = React.useState(false);
      const [vqaAnswer, setVqaAnswer] = React.useState('');
      const [vqaStatus, setVqaStatus] = React.useState('idle');

      // Missing frame placeholder
      if (isMissing) {
        return (
          <div className="shrink-0 flex flex-col items-center">
            <div
              className="w-32 md:w-36 aspect-video rounded-xl bg-slate-100 border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 select-none cursor-not-allowed shadow-inner"
              title={`Stage ${stageIndex + 1} bị missing (không tìm thấy candidate thỏa thứ tự thời gian)`}
            >
              <span className="absolute top-1 left-1 w-4 h-4 rounded bg-amber-500 text-white text-[9px] font-bold flex items-center justify-center">{stageIndex + 1}</span>
              <Icon name="help-circle" className="w-6 h-6 text-slate-300 mb-0.5" />
              <span className="text-[10px] font-bold text-slate-500">Không tìm thấy</span>
            </div>
          </div>
        );
      }

      // Valid frame thumbnail
      const rawImgUrl = frame.image_url || (frame.image_path ? `/images/${frame.image_path}` : '');
      const fullImgUrl = rawImgUrl.startsWith('http')
        ? rawImgUrl
        : `http://${window.location.hostname}:${window.location.port || '8888'}${rawImgUrl.startsWith('/') ? '' : '/'}${rawImgUrl}`;

      const formattedTs = frame.timestamp !== null && frame.timestamp !== undefined
        ? `${frame.timestamp.toFixed(1)}s`
        : '0.0s';

      const isRanked = frame.keyframe_id && rankingKeyframeIds.has(frame.keyframe_id);
      const isNoted = frame.keyframe_id && notedKeyframeIds.has(frame.keyframe_id);
      const isKisRanked = frame.keyframe_id && kisKeyframeIds.has(frame.keyframe_id);
      const isQaRanked = frame.keyframe_id && qaKeyframeIds.has(frame.keyframe_id);

      const frameItem = {
        id: frame.keyframe_id || `${frame.video_id}_${frame.frame_idx}`,
        keyframe_id: frame.keyframe_id,
        videoId: frame.video_id,
        videoTitle: frame.video_id,
        frameId: frame.frame_idx,
        timestamp: Math.round((Number(frame.timestamp) || 0) * 1000),
        pts_time: Number(frame.timestamp) || 0,
        thumbnailUrl: fullImgUrl,
        score: frame.score || 0,
        rank: stageIndex + 1,
        matchedSources: ['temporal', `Stage ${stageIndex + 1}`],
        caption: `${frame.video_id} - Frame ${frame.frame_idx} (Stage ${stageIndex + 1})`,
      };

      const submitStageVqa = async (e) => {
        e.stopPropagation();
        if (!vqaAnswer.trim() || vqaStatus === 'submitting') return;
        setVqaStatus('submitting');
        try {
          const res = await fetch(`${window.location.protocol}//${window.location.hostname}:${window.location.port || '8888'}/api/dres/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              video_id: String(frame.video_id),
              timestamp: frameItem.timestamp,
              timestamp_ms: frameItem.timestamp,
              answer: vqaAnswer.trim(),
              mode: 'vqa',
            }),
          });
          const data = await res.json();
          if (!res.ok || data.status === false) throw new Error(data.detail || data.description || 'VQA submit failed');
          setVqaStatus('success');
          if (showToast) showToast(`Đã submit VQA cho Stage ${stageIndex + 1}`, 'success');
        } catch (err) {
          setVqaStatus('error');
          if (showToast) showToast(err.message || 'VQA submit failed', 'error');
        }
      };

      return (
        <div className="shrink-0 flex flex-col items-center">
          <div
            onClick={(e) => { e.stopPropagation(); onSelectFrame(frame); }}
            className="w-32 md:w-36 aspect-video rounded-xl overflow-hidden border border-slate-200 hover:border-emerald-500 hover:shadow-md cursor-pointer transition-all bg-slate-900 relative group/thumb shadow-xs"
            title={`Nhấp để xem chi tiết Frame ${frame.frame_idx} (${frame.keyframe_id})`}
          >
            <img
              src={fullImgUrl}

    /**

    function TemporalResultGrid({

            <p className="text-xs text-slate-400 max-w-sm mt-1 leading-relaxed">
              Tạo các Stage theo thứ tự thời gian ở cột bên trái, thêm điều kiện Text / OCR / ASR / Image tương ứng rồi bấm <strong>Tìm kiếm chuỗi Stage</strong>.

            >
              <Icon name="zap" className="w-3.5 h-3.5" />
              <span>Thử dữ liệu mẫu (Mock Demo)</span>
            </button>

      const eventLengths = (results || []).map(r => (r.timeline || r.frame_chain || []).length).filter(n => n > 0);
      const maxEvents = eventLengths.length > 0 ? Math.max(...eventLengths) : 1;

      return (

                  title="Thêm toàn bộ các chuỗi sự kiện của tất cả video này vào Ranking"

              <span className="text-[11px] text-slate-500 hidden md:inline">
